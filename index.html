oday.","p":"Jesus, thank you for forgiving me. Help me forgive others, especially the ones who frustrate me.","q":"Who do I find hardest to be patient with, and why?"},{"t":"Review: Peacemaker","ref":"Psalm 34:14","v":"Depart from evil, and do good. Seek peace, and pursue it.","r":"Notice the words seek and pursue. Peace does not usually just happen. You chase it with gentle words, listening, apologies and forgiveness. This week you have practised the tools. Keep using them.","c":"Choose one peacemaking habit to keep, such as pausing before replying, apologising first, or listening fully. Note it on your phone.","p":"God, thank you for the peace you give. Help me to keep pursuing peace at school, with friends and at home.","q":"Which peacemaking tool worked best for me this week?"}]},{"w":31,"theme":"Goals and plans","intro":"Big dreams become real through small steps. This week you will learn how to set goals, break them into manageable pieces, use your time well and notice your progress, with God in the middle of it.","days":[{"t":"Give God your plans","ref":"Proverbs 16:3","v":"Commit your deeds to Yahweh, and your plans shall succeed.","r":"Planning is not just a school skill. It is something you can do with God. When you hand him your goals, you stay open to his guidance, and you remember that your worth is not only in what you achieve.","c":"Write down one goal for this term, such as a grade, a skill or a habit. Pray over it and hand it to God.","p":"Lord, I commit my goals and my work to you. Guide my plans and help me trust you with the outcome.","q":"What is one goal I would love to achieve this term?"},{"t":"Count the cost","ref":"Luke 14:28","v":"For which of you, desiring to build a tower, doesn’t first sit down and count the cost, to see if he has enough to complete it?","r":"Good goals need honest planning. What will it take in time, energy and effort? Counting the cost is not negative. It stops you from giving up halfway because you did not realise what was involved.","c":"Take your goal and write what it will need: how many times a week, how long, and what you might have to give up.","p":"God, give me honesty about what my goals will cost. Help me choose what matters most and say no to the rest.","q":"What would I need to give up or change to reach this goal?"},{"t":"Small steps add up","ref":"Proverbs 21:5","v":"The plans of the diligent surely lead to profit; and everyone who is hasty surely rushes to poverty.","r":"Rushing and last-minute panic rarely lead anywhere good. Steady effort does. Breaking a big goal into small steps makes it less scary and gives you something you can actually tick off.","c":"Break your goal into three tiny steps, each taking under fifteen minutes. Do the first one today and tick it off.","p":"Father, help me be steady and diligent, not rushed. Show me the next small step toward what I am aiming for.","q":"What is the smallest step I could take today toward my goal?"},{"t":"Number your days","ref":"Psalm 90:12","v":"So teach us to count our days, that we may gain a heart of wisdom.","r":"You get the same twenty-four hours as everyone else. Time is not only about doing more. It is about choosing what deserves your best hours. Seeing where your time goes helps you spend it wisely.","c":"Track your time today. Jot down roughly how long you spent on screens, homework, friends, rest and chores. Look for surprises tonight.","p":"God, teach me to value my days. Help me use my time on what really matters, including rest and relationships.","q":"What did I notice about where my time goes?"},{"t":"Work heartily","ref":"Colossians 3:23","v":"And whatever you do, work heartily, as for the Lord, and not for men,","r":"Planning only works if you then do the thing. When you work as if God is your audience, boring tasks get meaning and you stop doing things just to impress or avoid trouble.","c":"Choose your most dreaded task and give it a focused twenty-five minutes with your phone out of reach. Then take a break.","p":"Lord, help me do my work well, as if it were for you. Give me focus when I would rather drift.","q":"What task do I keep putting off, and what is making it hard?"},{"t":"Press on","ref":"Philippians 3:14","v":"I press on toward the goal for the prize of the high calling of God in Christ Jesus.","r":"Tracking progress keeps you motivated. Look back at where you started, not just how far you still have to go. Paul kept pressing on without being crushed by the gap. You can too.","c":"Create a simple tracker, such as ticks on a calendar or a list in your notes, and record your steps so far this week.","p":"God, thank you for the progress I have made, even when it feels small. Help me keep pressing on without being discouraged.","q":"What progress, however small, can I see since I began?"},{"t":"Review: Goals and plans","ref":"Proverbs 16:9","v":"A man’s heart plans his course, but Yahweh directs his steps.","r":"You make plans and God guides you. Sometimes things do not go as expected, and that is okay. Adjusting a plan is not failing. Keep your goals open-handed and keep walking with God.","c":"Plan next week: pick the three most important things, put them in your calendar, and choose one tracking habit to keep.","p":"Father, thank you for guiding me, even when plans change. Help me stay flexible, faithful and hopeful.","q":"What did I learn about planning and time this week?"}]},{"w":32,"theme":"Rest","intro":"In a world of notifications, homework and activities, rest can feel like a luxury. God designed it as a gift. This week you will explore sleep, quiet and trusting God enough to stop.","days":[{"t":"Sleep is a gift","ref":"Psalm 127:2","v":"It is vain for you to rise up early, to stay up late, eating the bread of toil, for he gives sleep to his loved ones.","r":"Staying up late to cram or scroll can feel productive, but God says he gives sleep to those he loves. Rest is not wasted time. It is part of how you grow and think clearly.","c":"Set a time tonight to put your phone away, and charge it somewhere other than your bed. Aim for a calmer wind-down.","p":"God, thank you for the gift of sleep. Help me trust you enough to stop and rest tonight.","q":"What usually keeps me up late, and what could I change?"},{"t":"Safe to lie down","ref":"Psalm 4:8","v":"In peace I will both lay myself down and sleep, for you, Yahweh alone, make me live in safety.","r":"Sometimes your mind races at bedtime with worries, awkward moments or tomorrow's to-do list. You can hand those to God. If worries feel heavy or constant, tell a parent or another trusted adult.","c":"Before sleep, write down what is on your mind, then pray, 'God, you hold this,' and put the paper aside.","p":"Lord, I give you my worries tonight. Keep me safe and help my mind to settle.","q":"What worries do I need to hand over before bed?"},{"t":"Come to Jesus tired","ref":"Matthew 11:28","v":"“Come to me, all you who labor and are heavily burdened, and I will give you rest.","r":"Tiredness is not only physical. You can feel worn out from pressure, expectations or trying to keep everyone happy. Jesus invites the weary to come to him, not to try harder first.","c":"Spend five quiet minutes with God today, no phone, simply telling him what feels heavy and sitting in silence afterwards.","p":"Jesus, I am tired in more ways than one. I come to you for rest. Take what is heavy.","q":"Where do I feel most weighed down at the moment?"},{"t":"Rest is made for you","ref":"Mark 2:27","v":"He said to them, “The Sabbath was made for man, not man for the Sabbath.","r":"Sabbath is not a rule to feel guilty about. It is a gift made for you. Taking a regular break from work, homework worries and hustle reminds you that the world keeps going without you running it.","c":"Choose a block of time this week, even two hours, to do something restful that you enjoy. Put it in your calendar.","p":"God, thank you for creating rest for me. Help me enjoy it without feeling guilty.","q":"What truly refreshes me, and when did I last do it?"},{"t":"Be still","ref":"Psalm 46:10","v":"“Be still, and know that I am God. I will be exalted among the nations. I will be exalted in the earth.”","r":"Stillness is hard when everything is noisy. But being still shows trust. It says that God is in charge, even if you are not busy fixing things. Quiet moments let you actually hear him.","c":"Sit for three minutes with no phone, music or distraction. Breathe slowly and repeat, 'God, you are God, and I am not.'","p":"God, help me be still in your presence. Quieten the noise in my head and heart.","q":"What was it like to be still, and what came to mind?"},{"t":"Restored soul","ref":"Psalm 23:2-3","v":"He makes me lie down in green pastures. He leads me beside still waters. He restores my soul. He guides me in the paths of righteousness for his name’s sake.","r":"A good shepherd knows when his sheep need to stop. God leads you to restful places because he cares about your soul, not just your productivity. Notice where he is offering you a calm spot.","c":"Go for a short walk outside or sit by a window. Notice three things you can see or hear, and thank God for them.","p":"Shepherd God, thank you for leading me to rest. Restore my soul and refresh my energy.","q":"Where do I feel most calm and close to God?"},{"t":"Review: Rest","ref":"Psalm 116:7","v":"Return to your rest, my soul, for Yahweh has dealt bountifully with you.","r":"This week you have seen that rest is not laziness. It is trust. God looks after the world while you sleep. Choosing good rhythms of sleep, stillness and fun helps you look after the person he made.","c":"Choose one rest habit to keep, such as a phone-free hour before bed or a quiet ten minutes each day. Set an alarm reminder.","p":"God, thank you for being trustworthy. Help me keep a healthy rhythm of work and rest.","q":"Which rest habit helped me most this week?"}]},{"w":33,"theme":"Faith and questions","intro":"Doubt does not mean you do not belong. God can handle your honest questions. This week you will see how the Bible welcomes questions and how to keep trusting while you search for answers.","days":[{"t":"Honest with God","ref":"Psalm 13:1-2","v":"How long, Yahweh? Will you forget me forever? How long will you hide your face from me? How long shall I take counsel in my soul, having sorrow in my heart every day? How long shall my enemy triumph over me?","r":"The Psalms are full of people saying raw, honest things to God. You are allowed to ask, 'Where are you?' He is not shocked or offended. If you feel low for a long time, please tell a trusted adult.","c":"Write God a short, honest note about something confusing or painful. No fancy words, just exactly how you feel.","p":"God, here is what is really on my heart, even the confusing parts. Please meet me here.","q":"What question or feeling have I been scared to say to God?"},{"t":"Ask, seek, knock","ref":"Matthew 7:7","v":"“Ask, and it will be given you. Seek, and you will find. Knock, and it will be opened for you.","r":"Jesus encourages asking. Questions are a sign you are thinking, not a sign of weak faith. Seeking takes effort and time, so give yourself permission to explore without needing every answer today.","c":"Write down your top three questions about God or faith. Ask a trusted adult or youth leader about one of them this week.","p":"Jesus, I am asking and seeking. Please guide me to good answers and good people who can help.","q":"What is one question about faith I would love answered?"},{"t":"What faith means","ref":"Hebrews 11:1","v":"Now faith is assurance of things hoped for, proof of things not seen.","r":"Faith is not pretending you never doubt. It is choosing to trust God, even when you cannot see everything. Think of it like leaning on a chair you cannot fully test but have good reason to trust.","c":"List three times God has helped you or someone you know. Read the list when doubt creeps in today.","p":"God, strengthen my faith. Remind me of the ways you have been faithful to me before.","q":"What reasons do I have for trusting God?"},{"t":"Bigger than my brain","ref":"Romans 11:33","v":"Oh the depth of the riches both of the wisdom and the knowledge of God! How unsearchable are his judgments, and his ways past tracing out!","r":"Some questions may never be fully answered this side of life, like why hard things happen. That is not a failure of faith. It is a reminder that God is bigger than your understanding, and still near you.","c":"Look up at the sky or think of something huge, like the ocean. Spend a minute simply wondering at how big God is.","p":"God, you are far greater than I can understand. Help me trust you where I do not have answers.","q":"What am I okay leaving as a mystery for now?"},{"t":"Walk by faith","ref":"2 Corinthians 5:7","v":"for we walk by faith, not by sight.","r":"Some days you will feel close to God, others you will feel nothing at all. Faith keeps walking anyway. Feelings change, but God does not. Keep doing the simple things: pray, read, be with other believers.","c":"Do one faith habit today even if you do not feel like it, such as a short prayer or reading a verse.","p":"Lord, help me to trust you on days when I feel nothing. Keep me walking with you.","q":"How do I act on days when my feelings and faith disagree?"},{"t":"God holds me","ref":"Psalm 73:26","v":"My flesh and my heart fails, but God is the strength of my heart and my portion forever.","r":"There will be moments when your own strength and certainty run out. In those moments, God does not drop you. He becomes the strength of your heart. You do not have to hold your faith together all by yourself.","c":"Tell one trusted person, such as a parent or mentor, about a doubt you are having. Ask them to pray with you.","p":"God, when my heart feels weak, hold me up. Thank you that you do not let go of me.","q":"Who could I trust with my doubts, and what would I say?"},{"t":"Review: Faith and questions","ref":"Jeremiah 29:13","v":"You shall seek me, and find me, when you search for me with all your heart.","r":"This week you have seen that seeking God is welcome, and searching with sincerity is promised an answer. Doubt can be a doorway to deeper faith when you bring it to God and to wise people.","c":"Choose one habit to keep exploring faith, such as a weekly chat with a mentor or writing questions in a notebook.","p":"God, thank you that you welcome my questions. Keep drawing me closer as I seek you.","q":"How has my view of doubt changed this week?"}]},{"w":34,"theme":"Beautiful inside","intro":"Social media and the people around you can make you feel like you never measure up. This week you will remember how God sees you, what real beauty is, and why comparing steals your joy.","days":[{"t":"Wonderfully made","ref":"Psalm 139:14","v":"I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well.","r":"You are not an accident or a rough draft. God made you on purpose, with care. Saying thank you for who you are is not vanity. It is agreeing with what God already says about you.","c":"Look in the mirror today and say one thing you are grateful God made you, such as your laugh, your kindness or your creativity.","p":"God, thank you for making me me. Help my soul to know deep down that I am wonderfully made.","q":"What is something about me that I am genuinely thankful for?"},{"t":"God sees the heart","ref":"1 Samuel 16:7","v":"But Yahweh said to Samuel, “Don’t look on his face, or on the height of his stature, because I have rejected him; for I don’t see as man sees. For man looks at the outward appearance, but Yahweh looks at the heart.”","r":"People notice looks first, and sometimes judge quickly. God goes straight to the heart: your honesty, kindness, courage and love. You can invest in those things, and they will not fade or go out of style.","c":"Do something today that builds your heart, not your image, such as encouraging someone or being honest when it is awkward.","p":"Lord, you see my heart. Shape it to be kind, brave and true, and help me care more about that than appearances.","q":"What qualities do I most want people to see in me?"},{"t":"Quiet beauty","ref":"1 Peter 3:4","v":"but in the hidden person of the heart, in the incorruptible adornment of a gentle and quiet spirit, which is very precious in the sight of God.","r":"A gentle, peaceful spirit is precious to God, and honestly, it is attractive to people too. Inner beauty is about how you treat others and how settled you are inside, not about being quiet or shy.","c":"Do one gentle, unseen thing today, like a kind word to a sibling or letting someone else go first, without needing credit.","p":"God, grow a gentle and peaceful spirit in me. Make my inner life something beautiful to you.","q":"When do I feel most at peace with who I am?"},{"t":"Stop the comparison","ref":"Galatians 6:4","v":"But let each man examine his own work, and then he will have reason to boast in himself, and not in someone else.","r":"Comparing your behind-the-scenes to someone else's highlights is a trap. Everyone's life is edited online. Measure yourself against who you were last year, and what God has asked of you, not against someone else.","c":"Take a break from one account that makes you compare, or mute it for a week. Notice how you feel afterwards.","p":"Father, free me from comparing myself with others. Help me run my own race and celebrate theirs.","q":"Who or what makes me compare, and how does it make me feel?"},{"t":"What truly lasts","ref":"Proverbs 31:30","v":"Charm is deceitful, and beauty is vain; but a woman who fears Yahweh, she shall be praised.","r":"Trends, filters and looks change quickly. What lasts is a life that honours God. You can enjoy style and creativity, but your worth does not rise and fall with them. If you feel you are never enough, talk with a trusted adult.","c":"Write down five qualities you admire in someone you respect. Notice that none of them are about appearance. Pick one to grow.","p":"God, help me value what lasts. Let my confidence come from you, not from compliments or likes.","q":"Which of my qualities would I be proud of in ten years?"},{"t":"Made with purpose","ref":"Ephesians 2:10","v":"For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them.","r":"The word workmanship can mean masterpiece. You were made with a purpose, and God has good things prepared for you to do. That gives your life meaning far beyond how you look or what people think.","c":"Think of one way you could use a talent this week to help others, and do something small about it today.","p":"God, thank you that I have a purpose. Show me the good things you have prepared for me.","q":"What gifts do I have that could help other people?"},{"t":"Review: Beautiful inside","ref":"Zephaniah 3:17","v":"Yahweh, your God, is among you, a mighty one who will save. He will rejoice over you with joy. He will calm you in his love. He will rejoice over you with singing.","r":"Imagine God singing over you with delight. That is how he feels about you, not because of what you achieve or how you look, but because you are his. Let that sink in as this week closes.","c":"Write a short note to yourself beginning with 'God delights in me because...' and stick it somewhere you will see it each day.","p":"God, thank you for delighting in me. Help me to see myself the way you see me.","q":"What truth about myself do I most want to remember from this week?"}]},{"w":35,"theme":"Peer pressure","intro":"Wanting to fit in is normal. But sometimes friends or the crowd push you toward things you know are not right. This week you will practise standing firm kindly and setting healthy boundaries.","days":[{"t":"Do not copy the crowd","ref":"Romans 12:2","v":"Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God.","r":"The world quietly squeezes you into its mould: what to wear, say, watch and laugh at. God invites you to be transformed from the inside by thinking differently, so you choose rather than just copy.","c":"Notice one thing today that you do mainly because everyone else does. Ask yourself if you actually want to do it.","p":"God, renew my mind. Help me see clearly what is good and have the courage to choose it.","q":"Where do I feel most pulled to fit in?"},{"t":"Not just following","ref":"Exodus 23:2","v":"“You shall not follow a crowd to do evil. You shall not testify in court to side with a multitude to pervert justice.","r":"A crowd can make wrong things feel normal. Just because everyone is laughing, sharing or joining in does not make it right. You can be the one who quietly does not go along with it.","c":"Plan a polite phrase you can use if pressured, like 'No thanks, not for me.' Practise it out loud so it feels natural.","p":"Lord, give me courage to say no calmly. Help me not to be swept along by the crowd.","q":"What situation might I need a ready-made 'no' for?"},{"t":"Choose your close friends","ref":"1 Corinthians 15:33","v":"Don’t be deceived! “Evil companionships corrupt good morals.”","r":"Friends influence you far more than you think. Healthy friendships make you feel safe, respected and free to be yourself. If someone often pushes you to do things you regret, it is okay to create distance. A trusted adult can help.","c":"Think about your friends. Write one thing that is healthy and one thing you would like to change or set a boundary on.","p":"God, give me good friends and wisdom for the ones I have. Help me set boundaries kindly and clearly.","q":"Do my friendships bring out the best or worst in me?"},{"t":"Whose approval?","ref":"Galatians 1:10","v":"For am I now seeking the favor of men, or of God? Or am I striving to please men? For if I were still pleasing men, I wouldn’t be a servant of Christ.","r":"Trying to please everybody is exhausting and impossible. You will always disappoint someone. If you live to please God first, other people's opinions lose some of their grip on you.","c":"Before one decision today, ask, 'Am I doing this because it is right or because I fear what others think?'","p":"Father, free me from needing everyone's approval. Help me care most about what you think.","q":"Whose opinion do I worry about most, and why?"},{"t":"A better place to stand","ref":"Psalm 1:1","v":"Blessed is the man who doesn’t walk in the counsel of the wicked, nor stand on the path of sinners, nor sit in the seat of scoffers;","r":"Notice the slow slide: walk, stand, sit. Pressure rarely begins with a huge step. It begins with small compromises. Spotting the first step early makes it much easier to turn around.","c":"Check your group chats or social feeds today. Leave or step back from any conversation that regularly pulls you into gossip or mean talk.","p":"Lord, show me early when I am drifting. Help me turn around quickly and choose better places to stand.","q":"What small compromise am I most likely to slide into?"},{"t":"Fear of people","ref":"Proverbs 29:25","v":"The fear of man proves to be a snare, but whoever puts his trust in Yahweh is kept safe.","r":"Fear of what people think can trap you into doing things you would never choose alone. Trusting God gives you a safe place to stand. If someone is bullying or pressuring you, tell a trusted adult. That is brave.","c":"If you are being pressured by anyone, tell a parent, teacher or youth leader today. If not, offer support to a friend who is.","p":"God, be my safe place. Give me courage to stand firm and to ask for help when I need it.","q":"Who could I talk to if I felt pressured?"},{"t":"Review: Peer pressure","ref":"Joshua 1:9","v":"Haven’t I commanded you? Be strong and courageous. Don’t be afraid. Don’t be dismayed, for Yahweh your God is with you wherever you go.”","r":"You are never standing alone when you stand for what is right. God is with you in the corridor, the group chat and the party. This week you have built tools. Keep using them.","c":"Choose one boundary or phrase to keep using, such as 'I'm out' or leaving a chat. Tell a trusted person so they can back you up.","p":"God, thank you that you are with me wherever I go. Make me strong and courageous.","q":"What was my bravest moment this week, big or small?"}]},{"w":36,"theme":"Patience","intro":"Waiting is hard, whether it is for results, friends, answers or change. This week you will discover that God does good work in the waiting, and that patience can be learned like any other skill.","days":[{"t":"Wait with courage","ref":"Psalm 27:14","v":"Wait for Yahweh. Be strong, and let your heart take courage. Yes, wait for Yahweh.","r":"Waiting is not passive. It takes strength. Waiting on God means staying faithful and hopeful while you do not yet see the result. Courage and waiting often go together.","c":"Think of something you are waiting for. Each time you feel impatient today, whisper a short prayer instead of complaining.","p":"God, give me strength and courage to wait for you. Keep my heart hopeful in the meantime.","q":"What am I waiting for, and how does waiting feel?"},{"t":"Hope that waits","ref":"Romans 8:25","v":"But if we hope for that which we don’t see, we wait for it with patience.","r":"Hoping means looking forward to something you cannot see yet. Patience is hope with endurance. God is working even when nothing seems to be happening, just like a seed growing under the soil.","c":"Plant a seed, or imagine one, and write a list of three things God might be doing while you wait.","p":"Lord, help me to hope patiently. Remind me that you are working even when I cannot see it.","q":"What might God be doing in me during this wait?"},{"t":"Patient with people","ref":"Proverbs 14:29","v":"He who is slow to anger has great understanding, but he who has a quick temper displays folly.","r":"Patience is not only about big dreams. It is about the slow sibling, the friend who is late, or the teacher who repeats things. Counting to five before reacting gives you space to respond well.","c":"The next time someone tests your patience today, silently count to five and then respond kindly.","p":"God, give me patience with people. Help me respond with understanding, not irritation.","q":"Who tests my patience the most, and what might they be dealing with?"},{"t":"Do not fret","ref":"Psalm 37:7","v":"Rest in Yahweh, and wait patiently for him. Don’t fret because of him who prospers in his way, because of the man who makes wicked plots happen.","r":"It is hard when others seem to get ahead faster, whether in friendships, sport or results. Fretting only drains you. Resting in God means trusting that your timing matters to him as well.","c":"When you notice yourself comparing timelines today, pause and thank God for one thing that is going well for you.","p":"Father, help me rest in you and not compare my timing with others. I trust you with my story.","q":"Where do I feel behind, and what can I thank God for instead?"},{"t":"Renewed strength","ref":"Isaiah 40:31","v":"but those who wait for Yahweh will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.","r":"Waiting on God is not wasted time. It is when your strength is renewed. Sometimes you soar, sometimes you run, and sometimes you just keep walking. All of it counts.","c":"Take a slow walk today without headphones. Use the time to pray about whatever you are waiting for.","p":"God, renew my strength as I wait. Help me keep walking even on days when I feel tired.","q":"Which do I need most right now: soaring, running or simply walking?"},{"t":"God is good in the wait","ref":"Lamentations 3:25-26","v":"Yahweh is good to those who wait for him, to the soul who seeks him. It is good that a man should hope and quietly wait for the salvation of Yahweh.","r":"Even in a hard wait, God is good. Quiet waiting means you are not panicking or forcing things, but staying close to him. Remember that nothing about the wait is a sign that he has forgotten you.","c":"Write down one thing God has already done that you once waited for. Thank him for it today.","p":"Good God, thank you for being good to me in waiting times. Teach me to hope quietly.","q":"What did I once wait for that eventually came?"},{"t":"Review: Patience","ref":"Ecclesiastes 3:11","v":"He has made everything beautiful in its time. He has also set eternity in their hearts, yet so that man can’t find out the work that God has done from the beginning even to the end.","r":"God is not rushed. He makes things beautiful in their time, including you. This week you have practised waiting with courage, patience with people and trust in his timing. Keep going.","c":"Choose one patience habit to keep, such as counting to five, taking a slow breath before replying, or a short prayer while waiting.","p":"God, thank you that your timing is perfect. Help me trust it and grow more patient each day.","q":"Where did I show patience this week, and how did it feel?"}]},{"w":37,"theme":"Joy","intro":"Joy is deeper than a good mood. It is a steady gladness that can live alongside tough days. This week you will explore where real joy comes from and how to notice it.","days":[{"t":"Fullness of joy","ref":"Psalm 16:11","v":"You will show me the path of life. In your presence is fullness of joy. In your right hand there are pleasures forever more.","r":"Passing happiness depends on what is going on around you. Real joy comes from being close to God. It does not disappear when plans fall apart, because he is not going anywhere.","c":"Take five minutes today, with no phone, to enjoy God's company. Tell him what you are thankful for and just sit with him.","p":"God, I want your joy, not just good moods. Meet me in your presence and fill me up.","q":"When have I felt a deep, lasting joy rather than quick happiness?"},{"t":"Choose to rejoice","ref":"Philippians 4:4","v":"Rejoice in the Lord always! Again I will say, “Rejoice!”","r":"Paul wrote this from prison, so it is not about pretending everything is fine. Rejoicing is a choice to focus on who God is, even when life is hard. You can feel sad and still have joy underneath.","c":"Write three things about God that are always true, such as 'He loves me,' and read them aloud when your mood dips today.","p":"Lord, help me rejoice in you, even when my feelings are low. Remind me of who you are.","q":"What truths about God can I hold on to when I feel down?"},{"t":"Joy that stays","ref":"John 15:11","v":"I have spoken these things to you, that my joy may remain in you, and that your joy may be made full.","r":"Jesus wants his own joy to live in you, joy that is full, not thin. It grows as you stay connected to him and follow his way. It is a gift to receive, not a feeling to chase.","c":"Do something today that brings you real joy and does not involve a screen, like music, drawing, a game outside or baking.","p":"Jesus, thank you for wanting me to have joy. Fill me with your joy and keep it in me.","q":"What activities leave me with lasting joy rather than an empty feeling?"},{"t":"Joy after tears","ref":"Psalm 30:5","v":"For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning.","r":"Joy does not mean you never cry. Sadness is real and allowed. This verse promises that tears are not the end of the story. If sadness lingers for weeks, please talk to a trusted adult. It is a strong thing to do.","c":"If you feel sad, let yourself feel it today. Then tell God, or a trusted person, how you are really doing.","p":"God, you see my tears. Comfort me, and thank you that joy can return. Help me to keep hoping.","q":"What am I sad about, and who can I share it with?"},{"t":"Today is a gift","ref":"Psalm 118:24","v":"This is the day that Yahweh has made. We will rejoice and be glad in it!","r":"You do not need a special occasion to be glad. Ordinary days are gifts too. Noticing small good things, like a funny moment, a warm drink or a friend's smile, trains your heart to feel joy more often.","c":"Notice and write down five small good things from today before you go to bed. Share one with someone at home.","p":"God, thank you for today. Open my eyes to the small joys I usually miss.","q":"What tiny good thing from today made me smile?"},{"t":"Hope that overflows","ref":"Romans 15:13","v":"Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope, in the power of the Holy Spirit.","r":"Joy and peace grow as you trust God. You cannot manufacture them, but you can ask for them. When hope runs low, this verse is a prayer you can borrow and pray over yourself.","c":"Pray this verse over yourself slowly, then pray it for one friend or family member who seems down.","p":"God of hope, fill me with joy and peace as I trust you. Let it spill over to others.","q":"Who around me could use some joy and hope this week?"},{"t":"Review: Joy","ref":"Psalm 126:3","v":"Yahweh has done great things for us, and we are glad.","r":"Joy grows when you remember what God has done. This week you have noticed the difference between passing happiness and real joy. Gratitude is one of the simplest ways to keep your joy alive.","c":"Start a short gratitude list in your notes and add one thing to it every day. Keep it going for next week.","p":"Thank you, God, for the great things you have done. Keep my heart glad and thankful.","q":"What brought me the most joy this week?"}]},{"w":38,"theme":"Lead by example","intro":"You do not need a title to influence people. Younger siblings, friends and classmates are watching how you live. This week you will explore leading by serving, encouraging and being consistent.","days":[{"t":"Set the example","ref":"1 Timothy 4:12","v":"Let no man despise your youth; but be an example to those who believe, in word, in your way of life, in love, in spirit, in faith, and in purity.","r":"Being young does not make you less valuable to God. He expects you to set an example in how you talk, act and love, right now. Your age is not a barrier to your influence.","c":"Choose one area, such as words or kindness, and set a good example in it today, in a way people would notice.","p":"God, thank you that you can use me now. Help me be an example in what I say and do.","q":"Who is watching how I live, and what do they see?"},{"t":"Let your light shine","ref":"Matthew 5:16","v":"Even so, let your light shine before men; that they may see your good works, and glorify your Father who is in heaven.","r":"Light does not argue. It simply shines. Doing good things quietly, consistently and cheerfully makes people curious about the source. You do not have to preach to show God's love.","c":"Do one good act today that others can see, like helping a classmate or tidying up, and do it cheerfully.","p":"Father, let my life reflect your goodness so people see you in me, not just me.","q":"What good thing could I do this week that points to God?"},{"t":"Leaders serve","ref":"Mark 10:44","v":"Whoever of you wants to become first among you, shall be bondservant of all.","r":"Jesus flipped leadership upside down. Real leaders are not the loudest or most popular. They serve. At school or at home, the best leaders notice what needs doing and quietly do it.","c":"Serve someone today in a way that costs you something, like giving up a few minutes of your free time to help.","p":"Jesus, teach me to lead by serving. Give me a heart that notices what others need.","q":"How can I serve the people I know best?"},{"t":"Consistency counts","ref":"Titus 2:7","v":"In all things be showing yourself an example of good works. In your teaching, be showing integrity, seriousness, incorruptibility,","r":"People trust those who are the same on Monday as on Saturday, at school and at home, online and offline. Being consistent builds a reputation that others can rely on.","c":"Check that how you speak online matches how you would speak face to face. Change one comment or habit if it does not.","p":"God, help me to be the same person everywhere. Make my words and actions match.","q":"Where am I different in different settings, and why?"},{"t":"Sharpen each other","ref":"Proverbs 27:17","v":"Iron sharpens iron; so a man sharpens his friend’s countenance.","r":"Good friends make each other better. You can be the friend who encourages hard work, honesty and kindness, rather than going along with a lazy or negative mood. Influence goes both ways.","c":"Ask a friend about a goal they have, encourage them in it, and offer to help or check in with them this week.","p":"Lord, help me to be a friend who sharpens others. Bring friends into my life who do the same for me.","q":"How have my friends helped me grow, and how can I help them?"},{"t":"Spur others on","ref":"Hebrews 10:24","v":"Let’s consider how to provoke one another to love and good works,","r":"Encouragement is one of the easiest kinds of leadership. A message, a note, a thank you. You never know how much a small word of encouragement can change someone's day or give them courage.","c":"Send three encouraging messages today to people who would not expect it, such as a teacher, relative or friend.","p":"God, help me to be an encourager. Show me who needs a lift today.","q":"Who has encouraged me, and have I thanked them?"},{"t":"Review: Lead by example","ref":"1 Thessalonians 5:11","v":"Therefore exhort one another, and build each other up, even as you also do.","r":"This week you have seen that leadership is about influence, service and consistency, not titles. You are already shaping the people around you. Keep choosing to build others up.","c":"Choose one leadership habit to keep, such as serving at home, encouraging one person a day or watching how you speak online.","p":"Thank you, God, for trusting me with influence. Help me use it to build others up and point to you.","q":"Who am I influencing, and what do I want them to learn from me?"}]},{"w":39,"theme":"Integrity","intro":"Integrity means being the same person whether or not anyone is watching. It is quiet, steady honesty. This week you will look at truth, small choices and living with a clear conscience.","days":[{"t":"Guided by honesty","ref":"Proverbs 11:3","v":"The integrity of the upright shall guide them, but the perverseness of the treacherous shall destroy them.","r":"Integrity works like an inner compass. When you are honest in small things, you know where you stand in big ones. Cutting corners can feel easy in the moment but builds stress you carry around.","c":"Think of one small area where you tend to cut corners, such as homework or chores. Do it properly today.","p":"God, make me a person of integrity. Guide my choices through my values and not through convenience.","q":"Where am I tempted to cut corners when no one checks?"},{"t":"Faithful in little","ref":"Luke 16:10","v":"He who is faithful in a very little is faithful also in much. He who is dishonest in a very little is also dishonest in much.","r":"Little choices build big character. Whether you return the extra change, keep a promise or tell the whole truth, small acts of honesty shape the person you are becoming.","c":"Keep one small promise today that nobody would notice if you forgot, like replying to a message or returning something borrowed.","p":"Lord, help me to be faithful in little things. Remind me that small choices matter to you.","q":"What small promise or task have I been neglecting?"},{"t":"Seen in secret","ref":"Matthew 6:4","v":"so that your merciful deeds may be in secret, then your Father who sees in secret will reward you openly.","r":"No one sees everything you do, but God does. That is not meant to scare you. It means that quiet, good choices are noticed and valued by him, even if nobody ever claps.","c":"Do something kind today in secret, without telling anyone or posting it, and let it be between you and God.","p":"Father, thank you that you see what no one else does. Help me to do right even when unseen.","q":"What have I done recently that only God knows about?"},{"t":"Speak truth","ref":"Ephesians 4:25","v":"Therefore putting away falsehood, speak truth each one with his neighbor. For we are members of one another.","r":"Little lies, exaggerations and half-truths can feel harmless, but they weaken trust. Honesty does not need to be harsh. You can tell the truth kindly. If there is a lie you are stuck in, a trusted adult can help.","c":"Notice any moment today when you are tempted to stretch the truth. Choose to say what is true, kindly and simply.","p":"God, help me to be truthful in everything I say, even when the truth is uncomfortable.","q":"When am I most tempted to bend the truth, and why?"},{"t":"Truth is his delight","ref":"Proverbs 12:22","v":"Lying lips are an abomination to Yahweh, but those who do the truth are his delight.","r":"God delights in people who do the truth, not only speak it. That includes online habits, school work and how you handle mistakes. Owning up quickly is much lighter than covering up.","c":"If you need to come clean about something, even something small, tell the person or a trusted adult today.","p":"Lord, I want to be someone you delight in. Give me courage to own up and make things right.","q":"Is there anything I need to confess or put right?"},{"t":"Search me, God","ref":"Psalm 139:23-24","v":"Search me, God, and know my heart. Try me, and know my thoughts. See if there is any wicked way in me, and lead me in the everlasting way.","r":"This is a brave prayer. Asking God to search you means inviting him to show what you cannot see. He does not do it to shame you, but to lead you somewhere better. Expect kindness, not condemnation.","c":"Pray this prayer slowly. Then sit quietly for two minutes and write down whatever comes to mind.","p":"God, search my heart and show me what needs changing. Lead me kindly in your way.","q":"What did God bring to mind when I asked him to search me?"},{"t":"Review: Integrity","ref":"Psalm 25:21","v":"Let integrity and uprightness preserve me, for I wait for you.","r":"Integrity protects you. It gives a clear conscience, trust from others and peace with God. This week you have practised honesty in small things. Keep going, and forgive yourself when you slip.","c":"Choose one integrity habit to keep, such as telling the truth quickly, finishing work honestly or keeping small promises. Write it on a sticky note.","p":"God, thank you that you help me live with integrity. Keep me honest and forgive me when I fail.","q":"What does living with integrity mean to me after this week?"}]},{"w":40,"theme":"Welcoming home","intro":"Home is where you can practise love in small, ordinary ways. This week you will look at welcome, shared spaces and tidying, not as chores, but as ways of serving the people you live with.","days":[{"t":"Open door, open heart","ref":"Hebrews 13:2","v":"Don’t forget to show hospitality to strangers, for in doing so, some have entertained angels without knowing it.","r":"Hospitality is not about a perfect house. It is about making someone feel wanted. When a friend or relative comes over, your smile and a ‘come in, sit down’ can matter far more than the snacks.","c":"Next time someone comes to your home, greet them at the door, offer them a drink, and ask them one proper question about their day.","p":"Thank God for the people who have welcomed you. Ask Him to make you someone who makes others feel at home.","q":"When did someone make you feel truly welcome, and what did they do?"},{"t":"Welcome without grumbling","ref":"1 Peter 4:9","v":"Be hospitable to one another without grumbling.","r":"Let’s be honest, sometimes a guest, a sibling’s friend or a surprise visit feels like an interruption. God is not asking you to fake delight. He is asking you to let Him soften the grumble into kindness.","c":"Notice the next time you want to sigh or roll your eyes at something at home. Swap it for one small helpful act instead.","p":"Tell God honestly where you feel grumpy at home. Ask Him for a kinder attitude and a little patience this week.","q":"What is one thing at home that you tend to grumble about?"},{"t":"Tidy, but make it kind","ref":"1 Corinthians 14:40","v":"Let all things be done decently and in order.","r":"Order is not about being perfect. A clear space helps everyone breathe, think and find things. When you tidy a shared room, you are saying to your family, ‘You matter more than my mess.’","c":"Spend ten minutes clearing one shared space, such as the lounge, kitchen table or bathroom. Put away anything of yours that has wandered there.","p":"Ask God to help you see the little jobs that make home easier for others, and to do them without being asked.","q":"Which shared space at home do you leave messiest, and how could you fix that?"},{"t":"Serve, don’t just use","ref":"Galatians 5:13","v":"For you, brothers, were called for freedom. Only don’t use your freedom for gain to the flesh, but through love be servants to one another.","r":"Freedom is not the freedom to leave everything for someone else. Real freedom is choosing to serve. Doing a job nobody asked you to do might be one of the most Jesus-like things you do all week.","c":"Do one household job that is not normally yours, like emptying the dishwasher or putting washing away, and do not mention it afterwards.","p":"Thank Jesus for serving you first. Ask Him to give you a servant’s heart in small, unseen ways at home.","q":"How did it feel to serve quietly without anyone noticing?"},{"t":"Other people’s things","ref":"Matthew 7:12","v":"Therefore whatever you desire for men to do to you, you shall also do to them; for this is the law and the prophets.","r":"Think about how you feel when someone borrows your things without asking, or leaves them damaged. Respect means asking first, returning things on time and treating belongings as someone else’s treasure.","c":"Return anything you have borrowed from a family member or friend. If something is missing or broken, own up and offer to put it right.","p":"Ask God to help you treat other people’s belongings, rooms and privacy the way you want yours to be treated.","q":"Is there anything of someone else’s you need to return, ask about or apologise for?"},{"t":"Do it for the Lord","ref":"Colossians 3:23","v":"And whatever you do, work heartily, as for the Lord, and not for men,","r":"Washing up is not exciting. But when you do ordinary jobs as if you were doing them for Jesus, they become worship. Even a made bed or a wiped counter can say, ‘I care.’","c":"Choose one boring job today and do it really well, slowly and properly. Pray quietly while you do it, using it as thinking time with God.","p":"Offer your ordinary jobs to God. Ask Him to help you see everyday tasks as small acts of love for Him.","q":"How might a boring job feel different if you did it for God?"},{"t":"Review: building a home","ref":"Proverbs 14:1","v":"Every wise woman builds her house, but the foolish one tears it down with her own hands.","r":"This week you looked at welcome, order, service and respect. None of it is about being flawless. Every kind choice, from a tidy desk to a warm hello, is a brick in building a home people love to be in.","c":"Pick one habit from this week to keep, such as a ten-minute tidy, a proper greeting or doing one extra job, and tell someone at home about it.","p":"Thank God for your home and family, however imperfect. Ask Him to help you build it up, not tear it down.","q":"Which one habit from this week would make the biggest difference at home?"}]},{"w":41,"theme":"Morning and evening routines","intro":"Routines are not about being rigid. They are about giving your day a good shape so you have more peace and energy. This week you will build small habits that start and end the day well.","days":[{"t":"Start with God","ref":"Psalm 5:3","v":"Yahweh, in the morning you will hear my voice. In the morning I will lay my requests before you, and will watch expectantly.","r":"The first few minutes of your day set its tone. If your phone is the first thing you reach for, your head fills with everyone else’s noise. Giving God the first word is a gentle way to begin.","c":"Before you look at your phone, take one minute. Say ‘good morning’ to God and tell Him one thing you are facing today.","p":"Greet God at the start of your day. Tell Him what is on your mind and ask for His help.","q":"What usually fills your mind in the first five minutes after waking up?"},{"t":"New every morning","ref":"Lamentations 3:22-23","v":"It is because of Yahweh’s loving kindnesses that we are not consumed, because his compassion doesn’t fail. They are new every morning. Great is your faithfulness.","r":"Some mornings you wake up behind, tired, or still cross about yesterday. God’s kindness doesn’t carry yesterday’s grumpiness forward. Each morning is a clean page, and you do not have to earn it.","c":"When you wake, say out loud or in your head, ‘This is a fresh start.’ Then pick one small thing to do well today.","p":"Thank God that His mercy is fresh each morning. Hand Him any leftover worries or mistakes from yesterday.","q":"What would you like to leave behind from yesterday and not carry into today?"},{"t":"Ending the day well","ref":"Psalm 4:8","v":"In peace I will both lay myself down and sleep, for you, Yahweh alone, make me live in safety.","r":"A good evening routine helps you settle. Bright screens and scrolling can wind your mind up when it should be slowing down. Handing the day to God lets you rest without carrying everything to bed.","c":"Tonight, put your phone on charge away from your bed at least twenty minutes before sleep. Spend that time reading, tidying or praying instead.","p":"Give God your day, the good and the messy. Ask Him to give you peaceful, restful sleep.","q":"What helps you feel calm at the end of the day?"},{"t":"Prepare the night before","ref":"Proverbs 16:3","v":"Commit your deeds to Yahweh, and your plans shall succeed.","r":"Morning rush is stressful when your bag is unpacked and you cannot find your shoes. Five minutes of preparing at night is a gift to tomorrow’s you. Planning is not lack of faith; it is wisdom.","c":"Tonight, pack your bag, lay out your clothes and check tomorrow’s timetable or homework deadlines. Put everything where you will find it easily.","p":"Ask God to bless tomorrow’s plans. Thank Him for the chance to be prepared and not rushed.","q":"What is the one thing that makes your mornings stressful, and how could you fix it?"},{"t":"Making the most of time","ref":"Psalm 90:12","v":"So teach us to count our days, that we may gain a heart of wisdom.","r":"You get the same number of hours as everyone else. Time is not just something to fill; it is something to steward. Even fifteen minutes you used wisely can change a whole evening.","c":"Write a short list of three things you want to get done after school. Do the hardest first, and tick each one off.","p":"Ask God to teach you how to use your time wisely and to show you what matters most today.","q":"Where does your time tend to disappear, and is that where you want it to go?"},{"t":"Small habits that stick","ref":"Galatians 6:9","v":"Let’s not be weary in doing good, for we will reap in due season, if we don’t give up.","r":"Big changes rarely stick; tiny ones do. A habit becomes yours not because you did it perfectly but because you kept coming back to it. Missed a day? Simply start again tomorrow, without beating yourself up.","c":"Choose one tiny habit, like making your bed, drinking water or reading a verse. Link it to something you already do every day.","p":"Ask God for the steady strength to keep going with small good habits, even when you don’t feel like it.","q":"What tiny habit could you link to something you already do daily?"},{"t":"Review: routines that help","ref":"Ecclesiastes 3:1","v":"For everything there is a season, and a time for every purpose under heaven:","r":"This week you looked at mornings, evenings, planning and habits. Routines are meant to serve you, not trap you. Seasons change, and your routine can too, as long as it still makes room for God and rest.","c":"Pick one morning habit and one evening habit to keep next week. Write them somewhere you will see them, like on your mirror or phone.","p":"Thank God for the rhythm of day and night. Ask Him to help your routines create space for peace and for Him.","q":"Which routine from this week helped you most, and why?"}]},{"w":42,"theme":"Listening to God","intro":"God is not far away or silent. He speaks through His Word, through peace, and through wise people. This week you will practise slowing down, being quiet, and learning to listen.","days":[{"t":"Be still","ref":"Psalm 46:10","v":"“Be still, and know that I am God. I will be exalted among the nations. I will be exalted in the earth.”","r":"Your life is full of noise: notifications, chatter, music, worries. Stillness feels strange at first, even uncomfortable. But in the quiet, you remember that God is God, and you do not have to hold everything together.","c":"Sit somewhere quiet for three minutes with your phone out of reach. Breathe slowly and simply tell God, ‘I’m here.’","p":"Ask God to quiet your mind. Sit in silence and let Him remind you that He is in charge.","q":"What did you notice in your mind when you sat still?"},{"t":"The gentle whisper","ref":"1 Kings 19:12","v":"After the earthquake a fire passed; but Yahweh was not in the fire. After the fire, there was a still small voice.","r":"Elijah expected God in the dramatic things, but God came in a quiet whisper. Often God’s voice is not loud. It is a gentle nudge, a reminder of a verse, or a sense of peace about what is right.","c":"Pause once today before a decision, big or small, and ask quietly, ‘God, what is the kind or wise thing here?’","p":"Ask God to help you recognise His gentle voice and not miss it among the noise.","q":"When have you felt a quiet nudge to do something good?"},{"t":"Knowing His voice","ref":"John 10:27","v":"My sheep hear my voice, and I know them, and they follow me.","r":"Sheep learn their shepherd’s voice by spending time with him. You get to know God’s voice the same way, through reading the Bible and talking to Him. Listening is a skill that grows with practice.","c":"Read a short passage from one of the Gospels slowly. Underline or note one thing Jesus says that stands out to you.","p":"Thank Jesus that He knows you by name. Ask Him to help you know His voice more clearly.","q":"What did Jesus say in your reading that stood out to you?"},{"t":"When you can’t see the way","ref":"Proverbs 3:5-6","v":"Trust in Yahweh with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.","r":"Choices like subjects, friendships or what to do next can feel big and confusing. God does not promise you the whole map, but He does promise to walk each step with you as you trust Him.","c":"Write down one decision you are facing. Pray over it, then ask a wise adult what they think. Note what you learn.","p":"Tell God about the decision you are unsure of. Ask Him to guide you and to give you peace.","q":"What is one decision where you most need God’s guidance right now?"},{"t":"A lamp for your feet","ref":"Psalm 119:105","v":"Your word is a lamp to my feet, and a light for my path.","r":"A lamp doesn’t light up the whole journey, only the next few steps. God’s Word often works like that. You may not see far ahead, but you will see enough to take the next faithful step.","c":"Read a Psalm tonight. Ask God what He wants you to take from it, and write one sentence about the next step you can take.","p":"Thank God for the Bible. Ask Him to help it light your next small step, not just the big picture.","q":"What is the next small step you can see right now?"},{"t":"Ask for wisdom","ref":"James 1:5","v":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.","r":"You don’t need to pretend you have it all figured out. God gives wisdom generously and does not roll His eyes when you ask. Admitting ‘I don’t know’ is where wisdom often begins.","c":"Bring one situation to God today, perhaps a friendship, schoolwork or family matter, and ask Him plainly for wisdom. Then chat to a trusted adult too.","p":"Admit to God where you feel stuck. Ask Him for wisdom and for people who can guide you well.","q":"Where do you most need wisdom right now? Write it as a prayer."},{"t":"Review: tuning in","ref":"Isaiah 30:21","v":"and when you turn to the right hand, and when you turn to the left, your ears will hear a voice behind you, saying, “This is the way. Walk in it.”","r":"This week was about slowing down, listening and trusting. God guides through His Word, through peace, through wise people and through quiet moments. You will not always hear clearly, but you can keep tuning in.","c":"Choose a regular five-minute quiet slot, maybe before bed or on the walk to school, and keep it as your listening time next week.","p":"Thank God that He wants to guide you. Ask Him to keep your heart tuned in and willing to follow.","q":"What helped you listen to God best this week?"}]},{"w":43,"theme":"Big feelings","intro":"Feelings are not wrong. Anger, sadness, worry and frustration are real, and God made you to feel them. This week you will learn to handle them honestly, and bring them to God and to people who care.","days":[{"t":"Angry, but wise","ref":"Ephesians 4:26","v":"“Be angry, and don’t sin.” Don’t let the sun go down on your wrath,","r":"Anger itself is not the problem. It tells you something matters. The danger is what you do next: slamming doors, saying cruel things, or going silent for days. God invites you to deal with it honestly and not let it fester.","c":"Next time you feel angry, pause, take five slow breaths, and walk away for a few minutes before you respond or text anyone.","p":"Tell God honestly what makes you angry. Ask Him to help you respond wisely and not hurt anyone.","q":"What tends to make you angry, and what do you usually do?"},{"t":"A gentle answer","ref":"Proverbs 15:1","v":"A gentle answer turns away wrath, but a harsh word stirs up anger.","r":"Argument at home or with a friend? Your tone matters as much as your words. A calm, gentle reply can lower the temperature in a way shouting never will. It isn’t weakness; it takes real strength.","c":"Today, if someone speaks sharply to you, answer in a calm, quiet voice, even if you don’t feel like it. Notice what happens.","p":"Ask God to put a guard on your words and give you a gentle tone, especially when you’re tense.","q":"When has a gentle answer changed the mood of a conversation?"},{"t":"God near the hurting","ref":"Psalm 34:18","v":"Yahweh is near to those who have a broken heart, and saves those who have a crushed spirit.","r":"Some days sadness just sits on you and you cannot explain why. You are not too much, and you are not alone. God draws close to the hurting. If it keeps weighing on you, telling a trusted adult is a brave, strong thing to do.","c":"Tell God how you really feel today, in a few honest sentences. If it is heavy, share it with a parent, relative, teacher or church leader.","p":"Be honest with God about what hurts. Ask Him to comfort you and send someone kind to talk with.","q":"What are you feeling most today, and who could you talk to about it?"},{"t":"Hand it over","ref":"1 Peter 5:7","v":"casting all your worries on him, because he cares for you.","r":"Worries can swirl around at night: exams, friends, what people think. God invites you to throw them onto Him, like handing over a heavy bag. He cares about the small things too, not only the big ones.","c":"Write each worry on a scrap of paper. Pray over them one by one, then fold the paper and put it in a drawer.","p":"Name your worries to God one at a time. Tell Him you are handing them over to Him.","q":"Which worry feels heaviest, and what would handing it over look like?"},{"t":"Slow to anger","ref":"James 1:19","v":"So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger;","r":"Big feelings make you want to speak first and think later. Listening first changes everything: you understand more, you say less you’ll regret, and the other person feels heard. It’s a skill you can practise.","c":"In your next disagreement, let the other person finish, then repeat back what they said before you answer. See how it changes things.","p":"Ask God to help you listen well and think before you speak, especially when you feel strongly.","q":"What would it look like to listen before reacting in your next disagreement?"},{"t":"When you’re scared","ref":"Psalm 56:3","v":"When I am afraid, I will put my trust in you.","r":"Notice the verse says ‘when’, not ‘if’. Fear is normal, even for people who love God. Trust doesn’t mean you never feel afraid; it means you bring the fear to Him and keep going, one step at a time.","c":"Name something that scares you right now. Say this verse aloud, then do one small brave step toward it, or tell someone about it.","p":"Tell God what you are afraid of. Ask Him for courage and for His peace to settle your heart.","q":"What fear could you bring to God today, and what small brave step could follow?"},{"t":"Review: feelings and peace","ref":"Philippians 4:6-7","v":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.","r":"This week you saw that feelings are not enemies. Bring them to God honestly, talk to people who care, and give yourself time. Peace is not the absence of feelings; it is God guarding your heart through them.","c":"Choose one calming step to keep, such as five slow breaths, a short prayer, a walk or talking to someone, and use it when feelings run high.","p":"Thank God that you can bring every feeling to Him. Ask Him to guard your heart with His peace.","q":"Which calming step from this week worked best for you?"}]},{"w":44,"theme":"Belonging","intro":"Everyone longs to belong, and sometimes you can feel on the outside. This week looks at loneliness, friendship, church and community, and how God places you in a family bigger than you realise.","days":[{"t":"Not alone","ref":"Psalm 68:6","v":"God sets the lonely in families. He brings out the prisoners with singing, but the rebellious dwell in a sun-scorched land.","r":"Loneliness can strike even in a crowded room or at school. It does not mean there’s something wrong with you. God sees you, and He often brings belonging through people. If it feels heavy, please tell a trusted adult.","c":"Tell God you feel lonely if you do. Then send a message or say hello to one person, or tell a trusted adult how you feel.","p":"Tell God honestly about any lonely feelings. Ask Him to bring good friends and people who care about you.","q":"When do you feel most alone, and what helps even a little?"},{"t":"Better together","ref":"Hebrews 10:24-25","v":"Let’s consider how to provoke one another to love and good works, not forsaking our own assembling together, as the custom of some is, but exhorting one another, and so much the more as you see the Day approaching.","r":"Faith is not meant to be a solo project. Meeting with other believers, whether at church, youth group or a small group, is how you get strengthened and encouraged, and how you strengthen others in return.","c":"If you attend a church or youth group, go this week with a goal: talk to one person. If not, ask a family member about trying one.","p":"Thank God for other Christians who encourage you. Ask Him to lead you to a community where you can grow.","q":"What do you enjoy, or think you might enjoy, about meeting with other Christians?"},{"t":"One body","ref":"Romans 12:5","v":"so we, who are many, are one body in Christ, and individually members of one another,","r":"You are not a spare part. Every person in God’s family has a role, even if you can’t see yours yet. You don’t need to be the loudest or the most talented to be needed and valued.","c":"Think of one thing you are good at, big or small. Look for a way to use it for someone else this week.","p":"Thank God that you belong to His body. Ask Him to show you where you fit and what you can offer.","q":"What is one small way you could help or serve at church or school?"},{"t":"Someone to lift you","ref":"Ecclesiastes 4:10","v":"For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn’t have another to lift him up.","r":"Everyone has days when they fall, with grades, friendships or confidence. Having people to pick you up matters hugely. And you can be that person for someone else, which is often how friendships begin.","c":"Look out for someone who seems left out or down. Sit with them, message them, or invite them into your group today.","p":"Pray for someone you know who may feel left out. Ask God to help you notice them and reach out.","q":"Who could you lift up this week, and how?"},{"t":"Held by God","ref":"Isaiah 41:10","v":"Don’t you be afraid, for I am with you. Don’t be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness.","r":"Even when no one else is around, God is. His presence is not dependent on your popularity, your mood, or who is sitting next to you. You belong to Him first, and that belonging does not change.","c":"When you feel on your own today, whisper this verse. Then choose one thing, like music or a walk, that helps you feel calm and held.","p":"Thank God for being with you in every room, every day. Ask Him to help you rest in that.","q":"What changes when you remember God is with you, even when you’re on your own?"},{"t":"Doing life together","ref":"Acts 2:42","v":"They continued steadfastly in the apostles’ teaching and fellowship, in the breaking of bread, and prayer.","r":"The first Christians shared meals, prayers and learning. Belonging grew in ordinary things like eating together, praying together and being around each other regularly. You can build that too, in small ways.","c":"Eat one meal today with family or friends without phones at the table. Ask everyone one question, such as their best part of the day.","p":"Thank God for the people you share meals and life with. Ask Him to deepen those friendships.","q":"Which ordinary moments with others make you feel most like you belong?"},{"t":"Review: you belong","ref":"Ephesians 2:19","v":"So then you are no longer strangers and foreigners, but you are fellow citizens with the saints and of the household of God,","r":"Through Jesus, you are not a stranger. You belong to God’s household. Belonging is a gift from God and also something you build, by showing up, welcoming others and being patient with friendships as they grow.","c":"Pick one step to keep going, such as messaging one friend a week, attending a youth group, or sitting with someone new at lunch.","p":"Thank God for making you part of His family. Ask Him to help you welcome others in too.","q":"Where do you feel you belong, and where would you like to belong more?"}]},{"w":45,"theme":"Encouragers","intro":"Words and small acts can lift someone’s whole day. This week you will practise noticing the good in others, speaking kindly and becoming someone people feel better around.","days":[{"t":"Build each other up","ref":"1 Thessalonians 5:11","v":"Therefore exhort one another, and build each other up, even as you also do.","r":"Encouragement means giving someone courage. A kind word costs nothing, yet it can be what gets a person through a tough day. You may not know how much someone needed to hear it.","c":"Send a message or tell someone in person one specific thing you appreciate about them. Be real and specific, not generic.","p":"Ask God to show you who needs encouragement today. Thank Him for people who have lifted you up.","q":"Who encouraged you recently, and what exactly did they say or do?"},{"t":"Sweet words","ref":"Proverbs 16:24","v":"Pleasant words are a honeycomb, sweet to the soul, and health to the bones.","r":"Words can sting or soothe. Pleasant words are like honey: they make the heart feel better. Think of how a genuine compliment makes you feel, and how long it stays with you.","c":"Give three sincere compliments today to family, friends or teachers. Aim for things about character, such as kindness or effort, and not only looks.","p":"Ask God to fill your words with kindness. Ask Him to help you notice what is good in others.","q":"What kind of compliments mean the most to you, and why?"},{"t":"Words that build","ref":"Ephesians 4:29","v":"Let no corrupt speech proceed out of your mouth, but only what is good for building others up as the need may be, that it may give grace to those who hear.","r":"This includes group chats, comments and jokes at someone’s expense. If something would tear someone down, it is not worth saying or sending. Choosing not to join in unkind chatter can be a quiet act of courage.","c":"Check your group chats and social media today. If anything unkind is going on, skip it, or send something kind instead.","p":"Ask God to help you speak and type only what builds people up. Ask for courage to avoid gossip.","q":"Has there been any unkind chatter lately that you could step away from?"},{"t":"A good word","ref":"Proverbs 12:25","v":"Anxiety in a man’s heart weighs it down, but a kind word makes it glad.","r":"Plenty of people around you carry worry quietly. A good word, a note, a kind text, a ‘how are you really?’, can lift a weight. You don’t need to fix their problems; just showing you care matters.","c":"Think of someone who seems worried or tired. Ask them how they’re doing and listen without rushing to give advice.","p":"Pray for someone who seems weighed down. Ask God to use you to help them feel cared for.","q":"Who around you might be carrying something heavy, and how could you check in?"},{"t":"Putting others first","ref":"Philippians 2:3-4","v":"doing nothing through rivalry or through conceit, but in humility, each counting others better than himself; each of you not just looking to his own things, but each of you also to the things of others.","r":"Encouragers cheer for other people’s wins, even when they are wishing for the same thing themselves. That’s hard, but it is freeing: you don’t need to compete for every spotlight.","c":"Celebrate someone else’s success today, such as a grade, a goal or an achievement. Tell them you’re proud of them and mean it.","p":"Ask God to free you from jealousy and give you a genuinely happy heart for others’ successes.","q":"Is there someone whose success is hard for you to celebrate? Why?"},{"t":"Gracious speech","ref":"Colossians 4:6","v":"Let your speech always be with grace, seasoned with salt, that you may know how you ought to answer each one.","r":"Grace in speech means being honest without being harsh. Encouraging isn’t flattery or pretending. It is truth said with care, whether you’re giving feedback, disagreeing or saying something hard.","c":"If you need to say something tough to someone today, plan it first. Start with what is good, then say the hard part kindly.","p":"Ask God to help you speak truthfully and kindly, with grace in your voice as well as your words.","q":"How could you say a hard thing more gently and kindly?"},{"t":"Review: becoming an encourager","ref":"Romans 15:2","v":"Let each one of us please his neighbor for that which is good, to be building him up.","r":"This week you practised noticing, speaking and celebrating. Encouragers aren’t born; they’re made by choosing, again and again, to say the good thing. Your words are small tools that God can use in big ways.","c":"Choose one encouraging habit to keep, such as one kind message a day, a thank-you note, or a weekly shout-out to a friend.","p":"Thank God for the people He has put around you. Ask Him to keep making you a source of courage.","q":"Who is one person you want to keep encouraging, and how?"}]},{"w":46,"theme":"Learning from mistakes","intro":"Everyone gets things wrong, including the people you admire. This week is about owning mistakes without shame, receiving God’s forgiveness, and trying again with a lighter heart.","days":[{"t":"Honest and forgiven","ref":"1 John 1:9","v":"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.","r":"Owning up feels risky, but hiding is heavier. God does not respond to honesty with a lecture. He forgives and cleans the slate. You can say the true thing, ‘I got that wrong’, and still be completely loved.","c":"Think of one thing you feel bad about. Tell God plainly about it, then accept His forgiveness and say thank you.","p":"Be honest with God about something you regret. Thank Him that He forgives you fully and does not hold it over you.","q":"What is something you need to stop carrying and hand to God?"},{"t":"Getting back up","ref":"Proverbs 24:16","v":"for a righteous man falls seven times and rises up again; but the wicked are overthrown by calamity.","r":"Falling over isn’t the end of the story. What counts is that you rise again. A poor test, a lost match or a friendship fumble doesn’t decide who you are. It is just a chapter.","c":"Pick something you have given up on after a setback, like a skill or a subject. Try again for just ten minutes today.","p":"Ask God for courage to try again after setbacks. Thank Him that failure doesn’t define you.","q":"What have you almost given up on that deserves another try?"},{"t":"Far as east from west","ref":"Psalm 103:12","v":"As far as the east is from the west, so far has he removed our transgressions from us.","r":"The east and west never meet. That is how far God puts your wrongs away from you. If He has removed them, you do not need to keep digging them up and replaying them at 2am.","c":"When an old mistake pops into your head today, say, ‘God has forgiven that’, and deliberately move your thoughts to something else.","p":"Thank God that He has taken your wrongs far away. Ask Him to help you stop replaying old mistakes.","q":"Which old mistake keeps replaying in your mind, and what would it be like to let it go?"},{"t":"No condemnation","ref":"Romans 8:1","v":"There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.","r":"There is a difference between guilt, which says ‘I did something wrong’, and shame, which says ‘I am something wrong’. In Jesus, you are free from the second. You can fix what needs fixing without hating yourself.","c":"Catch one self-critical thought today, like ‘I’m so stupid’, and replace it with something true and kind you would say to a friend.","p":"Ask God to quieten the harsh voice in your head. Thank Him that you are not condemned.","q":"What harsh thing do you say to yourself that you would never say to a friend?"},{"t":"Held up","ref":"Psalm 37:23-24","v":"A man’s steps are established by Yahweh. He delights in his way. Though he stumble, he shall not fall, for Yahweh holds him up with his hand.","r":"You may stumble, but God’s hand is underneath you. He is not waiting for you to be perfect before He helps. He is the one holding you up, even in the middle of your mess.","c":"If you have wronged someone, say sorry today. Keep it simple and sincere, with no excuses, and ask how you can make it right.","p":"Thank God for holding you up when you stumble. Ask Him for humility to say sorry when it’s needed.","q":"Who might need an apology from you, and what will you say?"},{"t":"Strength in weakness","ref":"2 Corinthians 12:9","v":"He has said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me.","r":"Your weak spots are not wasted. Where you feel least capable, God’s grace shows up strongest. You do not have to be good at everything. You just need to keep leaning on Him and learning.","c":"Ask someone you trust, like a parent or teacher, for help with something you find hard. Asking is a strength, not a weakness.","p":"Tell God where you feel weak or unable. Ask for His grace and the humility to ask for help.","q":"What is one area of weakness you could ask God or someone for help with?"},{"t":"Review: try again","ref":"Philippians 3:14","v":"I press on toward the goal for the prize of the high calling of God in Christ Jesus.","r":"This week you looked at honesty, forgiveness and starting again. Mistakes are part of learning, not proof you are failing. God’s grace means you can look back with kindness and look forward with hope.","c":"Write down one lesson from a recent mistake, then one small step you will take differently. Keep it somewhere you’ll see.","p":"Thank God for His patience and grace. Ask Him to help you learn and keep moving forward.","q":"What is the most useful thing a mistake has taught you recently?"}]},{"w":47,"theme":"Dream big","intro":"God made you with particular gifts and a future in mind. This week you will explore what you enjoy, what you are good at, and how to dream big while trusting God with the details.","days":[{"t":"A future and a hope","ref":"Jeremiah 29:11","v":"For I know the thoughts that I think toward you,” says Yahweh, “thoughts of peace, and not of evil, to give you hope and a future.","r":"God is not a distant observer of your life. He has good thoughts toward you and a future in mind. You don’t need to have it all mapped out at fourteen. You just need to take the next step with Him.","c":"Write down three things you’d love to do or be one day. Don’t censor yourself. Keep the list somewhere safe.","p":"Thank God that He has good plans for you. Ask Him to shape your dreams and give you courage.","q":"What are you secretly hoping to do or become one day?"},{"t":"Not too young","ref":"1 Timothy 4:12","v":"Let no man despise your youth; but be an example to those who believe, in word, in your way of life, in love, in spirit, in faith, and in purity.","r":"Being young is not a disadvantage in God’s eyes. You can set an example now in how you speak, treat people, love and live. You don’t have to wait until you are older for your life to matter.","c":"Choose one place, such as school, home or online, where you can set a quiet good example today. Do it on purpose.","p":"Ask God to use you now, not just later. Ask Him to help you be an example in what you say and do.","q":"Where can you set a good example right now, even in a small way?"},{"t":"Gifts to give away","ref":"1 Peter 4:10","v":"As each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms.","r":"Everyone has gifts: art, kindness, humour, organising, music, listening, sport, maths. Gifts aren’t for showing off or hiding; they’re for serving. Yours may be easier to spot than you think.","c":"Ask two people you trust what they think you’re good at. Write down their answers and use one of those gifts for someone today.","p":"Thank God for the gifts He has given you. Ask Him to show you how to use them to help others.","q":"What did others say you are good at, and did it surprise you?"},{"t":"What do you love?","ref":"Psalm 37:4","v":"Also delight yourself in Yahweh, and he will give you the desires of your heart.","r":"The thin
