 and send me the right people to help.","q":"Which subject do I need help with, and who could I ask?"},{"t":"Keep going when tired","ref":"Galatians 6:9","v":"Let’s not be weary in doing good, for we will reap in due season, if we don’t give up.","r":"Mid-term weeks can feel endless, and effort doesn't always show results straight away. This verse promises that steady, faithful work does pay off, even if the harvest isn't immediate. Keep going; you're growing more than you can see.","c":"Do one small thing today that your future self will thank you for, such as packing your bag or finishing one revision card set.","p":"Lord, I get tired of the daily grind. Give me strength to keep going and trust that my effort is never wasted.","q":"When have I kept going at something hard and been glad I did?"},{"t":"More than grades","ref":"Proverbs 4:7","v":"Wisdom is supreme. Get wisdom. Yes, though it costs all your possessions, get understanding.","r":"Grades matter, but they aren't the whole point. Real wisdom means understanding things and learning to think well. You are not a test score. Curiosity and a willingness to learn will serve you long after exams are over.","c":"Find out one fascinating thing about a subject you usually find dull, and tell someone at home about it tonight.","p":"God, help me value learning itself and not just marks. Make me curious, and remind me that my worth is never decided by a result.","q":"What is one subject I could actually enjoy if I gave it a chance?"},{"t":"Review: Plans and effort","ref":"Proverbs 16:3","v":"Commit your deeds to Yahweh, and your plans shall succeed.","r":"This week you have looked at effort, focus, asking for help and not giving up. Handing your work to God doesn't mean you stop trying. It means you try with peace rather than panic, knowing he is with you.","c":"Choose one study habit from this week to keep, such as a phone-free study slot or asking questions, and put it in your planner.","p":"Lord, I give you my schoolwork, my plans and my worries. Help me keep one good habit going and trust you with the results.","q":"Which study habit worked best this week, and how will I keep it going?"}]},{"w":15,"theme":"Scroll wisely","intro":"Your phone is a brilliant tool and a powerful distraction. This week is not about shame or rules but about noticing what you feed your mind and choosing what is good for you.","days":[{"t":"Think on good things","ref":"Philippians 4:8","v":"Finally, brothers, whatever things are true, whatever things are honorable, whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report: if there is any virtue and if there is any praise, think about these things.","r":"What you watch and scroll through shapes what you think about. This verse is a lovely filter: is it true, lovely, worth praising? You do not need to be perfect, just a bit more thoughtful about what you let in.","c":"Look at who you follow today and mute or unfollow one account that leaves you feeling worse about yourself or the world.","p":"God, help me notice what I'm feeding my mind. Give me the courage to cut out things that don't build me up.","q":"How do I usually feel after scrolling, and what does that tell me?"},{"t":"Guard your heart","ref":"Proverbs 4:23","v":"Keep your heart with all diligence, for out of it is the wellspring of life.","r":"Your heart is like a spring; whatever goes in affects what comes out, including your mood, your words and your decisions. Guarding it isn't about fear. It is about looking after something precious that is truly yours.","c":"Pause before you open an app today and ask yourself, 'Am I bored, lonely, or actually wanting this?' Then choose deliberately.","p":"Lord, help me look after my heart. Show me when I'm scrolling to avoid how I feel, and meet me in those moments.","q":"What am I often trying to escape or fill when I reach for my phone?"},{"t":"Count your time","ref":"Psalm 90:12","v":"So teach us to count our days, that we may gain a heart of wisdom.","r":"An hour here and an hour there adds up fast. This verse is about making your days count, not about guilt. If you looked at your screen-time report, would you be happy with where your time goes?","c":"Check your screen-time stats and pick one app to limit by fifteen minutes today. Use that time for something you enjoy offline.","p":"God, teach me to use my time wisely. Help me spend it on people and things that really matter to me.","q":"If I got an hour back each day, what would I do with it?"},{"t":"Renew your mind","ref":"Romans 12:2","v":"Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God.","r":"Social media constantly tells you what to want, wear and be. Changing how you think takes small, steady choices. Filling your mind with truth, music, books and good conversation helps you stand out from the crowd, not blend in.","c":"Replace ten minutes of scrolling with something that feeds your mind well: a good podcast, a worship playlist, a book or a walk.","p":"Father, renew my thinking. Help me spot the lies that online life tells me and replace them with your truth.","q":"What message from social media do I need to question today?"},{"t":"Words that build","ref":"Ephesians 4:29","v":"Let no corrupt speech proceed out of your mouth, but only what is good for building others up as the need may be, that it may give grace to those who hear.","r":"Your comments, messages and posts are words too. They can hurt or help in seconds, and they last. This verse invites you to be someone whose online words make people feel seen and encouraged, not smaller.","c":"Send one genuinely kind message or comment to someone today, and think twice before posting or forwarding anything unkind.","p":"Lord, guard my words online as well as in person. Help me to build people up and to pause before I send.","q":"Would I be happy for everyone to read the last thing I posted or sent?"},{"t":"Be still","ref":"Psalm 46:10","v":"“Be still, and know that I am God. I will be exalted among the nations. I will be exalted in the earth.”","r":"Your brain rarely gets a quiet moment now. Stillness feels strange at first, but it is where you notice God, your own thoughts and what you actually need. Even a few phone-free minutes can reset a busy day.","c":"Leave your phone in another room for ten minutes and just sit, breathe and talk to God about whatever comes up.","p":"God, I'm so used to noise. Teach me to be still with you, and help me enjoy the quiet instead of fearing it.","q":"What happened in my mind when I put my phone down?"},{"t":"Review: Scroll wisely","ref":"Matthew 6:33","v":"But seek first God’s Kingdom, and his righteousness; and all these things will be given to you as well.","r":"This week you looked at what you feed your mind, how you spend time and what you say online. Putting God first doesn't mean throwing your phone away. It means it stays a tool and doesn't become the boss.","c":"Choose one phone habit to keep, such as no phone at meals, phone out of the bedroom at night, or a daily app limit.","p":"Lord, be first in my life, ahead of my phone. Help me stick to one change and be kind to myself when I slip.","q":"Which phone habit will I keep, and who could help me stick to it?"}]},{"w":16,"theme":"Brave","intro":"Everyone feels afraid sometimes: of tests, of friends, of the future, of being left out. Bravery is not having no fear; it is doing the right thing with God beside you.","days":[{"t":"You are not alone","ref":"Joshua 1:9","v":"Haven’t I commanded you? Be strong and courageous. Don’t be afraid. Don’t be dismayed, for Yahweh your God is with you wherever you go.”","r":"God didn't tell Joshua there was nothing to be scared of. He told him to be brave because he would be with him everywhere. Whatever you face today, you aren't walking into it by yourself.","c":"Think of something you're nervous about this week, and say 'God is with me' quietly before you face it.","p":"God, you know what makes me nervous. Walk with me into it today, and help me feel that you are close.","q":"What am I dreading right now, and what would courage look like?"},{"t":"Strengthened and held","ref":"Isaiah 41:10","v":"Don’t you be afraid, for I am with you. Don’t be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness.","r":"Look how many promises are in this verse: I am with you, I will strengthen you, I will help you, I will hold you up. God doesn't just say 'don't be scared'; he gives you what you need to cope.","c":"Write one line from this verse on a sticky note or in your notes app, and look at it when you feel anxious.","p":"Father, I need your help today. Hold me up when I feel shaky and remind me that you never let go.","q":"Which of God's promises in this verse do I most need today?"},{"t":"Power, love, self-control","ref":"2 Timothy 1:7","v":"For God didn’t give us a spirit of fear, but of power, love, and self-control.","r":"Fear can make you feel small and stuck. This verse says that what God puts in you is different: strength, love and a steady mind. You can take a deep breath and choose your next step, even if your hands shake.","c":"When you feel panicky today, breathe slowly in and out three times and pray one short sentence for steadiness.","p":"God, when fear shouts, help me remember what you've given me: power, love and a calm mind. Steady me.","q":"When fear speaks loudly, what is it usually telling me?"},{"t":"Trust when scared","ref":"Psalm 56:3","v":"When I am afraid, I will put my trust in you.","r":"Notice that David says 'when', not 'if'. Even someone close to God felt afraid. Fear isn't a sign of weak faith. It is simply the moment you get to choose to trust, even in a small way.","c":"Do one small brave thing today, such as speaking up in class, saying hello to someone new or asking a question.","p":"Lord, I admit I'm afraid sometimes. Help me to choose trust over hiding, one small step at a time.","q":"What small brave step could I take today, and what is holding me back?"},{"t":"Stand up for what's right","ref":"Deuteronomy 31:6","v":"Be strong and courageous. Don’t be afraid or scared of them; for Yahweh your God himself is who goes with you. He will not fail you nor forsake you.”","r":"Sometimes bravery means being the one who doesn't laugh at the cruel joke, who includes the quiet girl or who says 'I'm not comfortable with that'. It's tough, but you're never doing it without God at your side.","c":"Look for one chance to quietly stand up for someone or something right today, even just by not joining in with gossip.","p":"God, give me courage to do what's right even when it's unpopular. Help me be kind and firm at the same time.","q":"Where might I need to stand up for someone, or for myself?"},{"t":"Strength for hard things","ref":"Philippians 4:13","v":"I can do all things through Christ, who strengthens me.","r":"This verse isn't a promise that you'll ace everything. It's about being given strength for whatever you face, including hard conversations, new situations and disappointments. God's strength shows up exactly where yours runs out.","c":"Choose something hard you've been avoiding, such as an apology or an awkward chat, and take the first step towards it.","p":"Jesus, I don't have enough strength on my own. Fill me with yours for the hard thing in front of me.","q":"What is one hard thing I can face with God's strength this week?"},{"t":"Review: Brave","ref":"Psalm 27:1","v":"Yahweh is my light and my salvation. Whom shall I fear? Yahweh is the strength of my life. Of whom shall I be afraid?","r":"This week reminded you that courage isn't pretending. It is trusting that God is bigger than what scares you. If a fear feels too heavy, telling a parent or trusted adult is brave too.","c":"Pick one fear to face this coming week and tell someone you trust about it so they can cheer you on.","p":"Lord, you are my light and my strength. Thank you for this week. Help me keep stepping forward, even when I'm scared.","q":"What is one fear I'm ready to hand over to God this week?"}]},{"w":17,"theme":"Generous","intro":"Generosity isn't only about money. It is about time, attention and what you share. This week, think about how you handle what you have, whether pocket money, snacks or encouragement.","days":[{"t":"Give with joy","ref":"2 Corinthians 9:7","v":"Let each man give according as he has determined in his heart, not grudgingly or under compulsion, for God loves a cheerful giver.","r":"God cares more about your attitude than the amount. Giving because you have to isn't the same as giving because you want to. A small gift offered happily means far more than a big one given while rolling your eyes.","c":"Give something small today with a smile, such as a snack, a compliment, or a few pence into a charity box.","p":"God, make my heart generous. Help me to give happily, not grudgingly, and enjoy being a blessing to others.","q":"When did giving something away last make me feel really good?"},{"t":"Refreshing others","ref":"Proverbs 11:25","v":"The liberal soul shall be made fat. He who waters shall be watered also himself.","r":"Generous people tend to end up refreshed themselves. When you help a friend with homework, share your time or encourage someone, something good flows back into your own life. Generosity isn't a loss; it's a cycle.","c":"Think of one friend or family member who needs lifting today, and send them an encouraging message or help them with something.","p":"Lord, make me someone who refreshes other people. Show me who needs a bit of care or encouragement today.","q":"Who could I encourage today, and how exactly?"},{"t":"More blessed to give","ref":"Acts 20:35","v":"In all things I gave you an example, that so laboring you ought to help the weak, and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’”","r":"Jesus said this, and you've probably felt it at birthdays: choosing a present for someone and watching them open it can be better than opening your own. Generosity brings a joy that getting just can't match.","c":"Make or choose a small gift for someone, such as a note, a drawing or a baked treat, and give it to them today.","p":"Jesus, thank you for giving so much to me. Help me enjoy giving to others, not just receiving.","q":"What is the best thing I've ever given someone, and why?"},{"t":"Plan and save","ref":"Proverbs 21:5","v":"The plans of the diligent surely lead to profit; and everyone who is hasty surely rushes to poverty.","r":"Being generous goes hand in hand with being sensible. Saving a little regularly and planning ahead gives you something to give, and something for later. Small, steady choices usually beat quick impulse buys.","c":"Decide on a simple split for any money you receive, such as some to spend, some to save and some to give, and write it down.","p":"God, teach me to handle money wisely. Help me plan ahead and not buy things just because everyone else has them.","q":"What would I like to save up for, and what is my first step?"},{"t":"Life is not stuff","ref":"Luke 12:15","v":"He said to them, “Beware! Keep yourselves from covetousness, for a man’s life doesn’t consist of the abundance of the things which he possesses.”","r":"Adverts and online influencers say you will be happier with the next thing. Jesus says life is more than what you own. Wanting things is normal, but your joy and your worth don't depend on them.","c":"Look through your belongings and choose one thing in good condition that you could donate or pass on to someone who needs it.","p":"Father, loosen my grip on stuff. Help me find my joy in you and in people, not in buying more.","q":"What do I own that I could share or give away?"},{"t":"Share what you have","ref":"Hebrews 13:16","v":"But don’t forget to be doing good and sharing, for with such sacrifices God is well pleased.","r":"Sharing sometimes costs you something, like time, a favourite thing or the last biscuit. God notices and enjoys it when you do it. These little sacrifices are never wasted, and they build the kind of person you want to be.","c":"Offer to share something of yours today, such as your time, your lunch or your help with a chore, without being asked.","p":"Lord, show me where I can share what I have. Make me notice needs around me, at school and at home.","q":"What is something I find hard to share, and why?"},{"t":"Review: Generous","ref":"Matthew 6:21","v":"for where your treasure is, there your heart will be also.","r":"Where you put your money, time and energy shows what you really care about. This week you have practised giving cheerfully, saving wisely and holding stuff loosely. Which of those fits you best, and which needs growing?","c":"Pick one generous habit to keep, such as a monthly donation, a weekly kind act, or setting aside part of your pocket money.","p":"God, thank you for being so generous to me. Help me keep a giving heart and use what I have well.","q":"What generous habit will I keep going after this week?"}]},{"w":18,"theme":"Thankful","intro":"Gratitude is a habit that changes how you see your days. It doesn't deny hard things; it simply trains your eyes to notice what is good as well.","days":[{"t":"Thanks in everything","ref":"1 Thessalonians 5:18","v":"In everything give thanks, for this is the will of God in Christ Jesus toward you.","r":"Notice it says 'in' everything, not 'for' everything. You don't have to pretend a bad day was great. You can still find something to thank God for, like a kind word, a warm drink or a friend who showed up.","c":"Write down three things from today you're thankful for, including at least one small, ordinary thing you usually overlook.","p":"Father, thank you for today. Open my eyes to the good things I often miss, even on a rough day.","q":"What three small things am I thankful for right now?"},{"t":"He is good","ref":"Psalm 107:1","v":"Give thanks to Yahweh, for he is good, for his loving kindness endures forever.","r":"Thankfulness starts with remembering who God is: good and loving, always. Circumstances change daily, but his character doesn't. Thanking him for who he is can steady you when everything else feels wobbly.","c":"Say thank you out loud to God for something specific while you're walking, showering or getting ready this morning.","p":"God, you are good and your love never runs out. Thank you for being steady when my life isn't.","q":"What does it mean to me that God's love lasts forever?"},{"t":"Peaceful and thankful","ref":"Colossians 3:15","v":"And let the peace of God rule in your hearts, to which also you were called in one body, and be thankful.","r":"Gratitude and peace are close friends. When you focus on what you have, grumbling quietens down and your heart settles. It's hard to feel tense and truly thankful at the same moment.","c":"Thank one person out loud today, such as a teacher, a parent or a friend, and tell them exactly why.","p":"Lord, give me peace in my heart and a thankful attitude. Help me notice the people who help me and say so.","q":"Who has helped me lately that I haven't properly thanked?"},{"t":"Come in with thanks","ref":"Psalm 100:4","v":"Enter into his gates with thanksgiving, and into his courts with praise. Give thanks to him, and bless his name.","r":"Thanksgiving is like a doorway into prayer. When you begin by thanking God, you remember how much you've been given, and your worries shrink a little. Try starting every prayer this way instead of with your to-do list.","c":"Begin your next prayer or bedtime chat with God by thanking him for five specific things before you ask for anything.","p":"God, I come to you with thanks. Thank you for my home, my friends, my health and your care.","q":"How does starting with thanks change the way I pray?"},{"t":"Thank God, not only worry","ref":"Philippians 4:6","v":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God.","r":"Anxiety is real, and God wants to hear it all. Notice that thanksgiving is mixed in with asking. Remembering past help gives you confidence about what's coming next, because God has already shown he's faithful.","c":"Think of a worry, then write down one time God or someone else has already helped you through something similar.","p":"Father, I bring you my worries today, and I thank you for the times you've already helped me.","q":"When has God come through for me in the past?"},{"t":"Every good gift","ref":"James 1:17","v":"Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom can be no variation, nor turning shadow.","r":"Sunsets, music, a good laugh, food you love, a friend who gets you: all gifts. When you see good things as presents from God, ordinary days start to feel like unwrapping something. Thankfulness is mostly just noticing.","c":"Take a photo or note of something beautiful or good you spot today, and thank God for it later.","p":"God, thank you for every good gift in my life. Help me to notice them instead of rushing past.","q":"What good gift in my life do I most take for granted?"},{"t":"Review: Thankful","ref":"Psalm 103:2","v":"Praise Yahweh, my soul, and don’t forget all his benefits,","r":"This week you practised noticing, thanking and remembering. Gratitude grows like a muscle. The more you use it, the stronger it gets, and the easier it is to find good even when life is messy.","c":"Choose a gratitude habit to keep: three thank-yous each night, a notes-app list, or a thankful jar on your shelf.","p":"Lord, thank you for this week and for all your kindness. Help me keep remembering your goodness every day.","q":"Which gratitude habit will I keep, and when will I do it?"}]},{"w":19,"theme":"Clean hands, clean habits","intro":"Looking after yourself, your space and your heart matters to God. This week covers everyday things like hygiene and chores, and the deeper idea of a clean heart.","days":[{"t":"Clean hands, pure heart","ref":"Psalm 24:4","v":"He who has clean hands and a pure heart; who has not lifted up his soul to falsehood, and has not sworn deceitfully.","r":"This verse pairs clean hands with a pure heart: how we live outside matches who we are inside. Today is about both, and about caring for yourself and being honest, because small things reflect bigger ones.","c":"Wash your hands properly today, and also check your heart: is there anything you've said or done that you need to be honest about?","p":"God, make my hands and my heart clean. Help me live honestly in the small things as well as the big.","q":"Is there anything in my heart I need to be honest with God about?"},{"t":"Looking after yourself","ref":"Psalm 139:14","v":"I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well.","r":"God made you, so looking after yourself is a way of respecting his work. Showering, brushing teeth, sleeping well and wearing clean clothes aren't vanity. They are simple, daily ways of caring for what he gave you.","c":"Set up a simple routine for tonight, such as shower, teeth, clean pyjamas and a tidy bag, and stick to it.","p":"Thank you, God, for making me. Help me look after myself well and treat myself with kindness.","q":"What small self-care habit do I tend to skip, and why?"},{"t":"Faithful in small things","ref":"Luke 16:10","v":"He who is faithful in a very little is faithful also in much. He who is dishonest in a very little is also dishonest in much.","r":"Putting your dishes in the dishwasher or your laundry in the basket might seem tiny, but God notices small faithfulness. Doing little jobs without being nagged builds trust and character you'll use for years.","c":"Notice your own mess today, such as plates, clothes or towels, and tidy it up before anyone has to ask.","p":"Lord, help me be faithful in little things. Make me someone people can rely on at home and school.","q":"Which small job at home do I need reminding about, and why?"},{"t":"Chores as worship","ref":"Colossians 3:17","v":"Whatever you do, in word or in deed, do all in the name of the Lord Jesus, giving thanks to God the Father, through him.","r":"Even cleaning the bathroom can be done 'in Jesus' name'. It means doing it with a good attitude and thanking God for a home to look after. Helping out makes life easier for everyone, and it's a way of showing love.","c":"Do one household job today, such as the kitchen, bathroom or laundry, without complaining, and thank God while you're doing it.","p":"Jesus, help me to do my chores with a good attitude. Thank you for my home and for the people in it.","q":"How could I make a chore feel less annoying and more meaningful?"},{"t":"Own your mistakes","ref":"1 John 1:9","v":"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.","r":"Spills, mess and mistakes happen to everyone. Taking responsibility, saying 'that was me, sorry', is brave and mature. God does the same with the bigger stuff: he forgives and cleans us, no shame attached.","c":"Own up to something you've left undone or messed up, whether it's a mess or a mistake, and put it right.","p":"Father, I'm sorry for the times I've messed up or avoided responsibility. Thank you for forgiving me and giving me a fresh start.","q":"What is one thing I could take responsibility for today?"},{"t":"A clean heart","ref":"Psalm 51:10","v":"Create in me a clean heart, O God. Renew a right spirit within me.","r":"David prayed this after making serious mistakes. You don't have to scrub your own heart clean; you just ask. God is happy to renew your attitude and give you a fresh start any time you ask.","c":"Take five quiet minutes to tell God anything that feels heavy or messy inside, and then ask him to renew your heart.","p":"God, create a clean heart in me. Take away what's heavy, and give me a fresh, steady, honest spirit.","q":"What do I need God to wash away or renew in me?"},{"t":"Review: Clean hands, clean habits","ref":"Psalm 51:7","v":"Purify me with hyssop, and I will be clean. Wash me, and I will be whiter than snow.","r":"This week touched on hygiene, tidiness, responsibility and a clean heart. Cleanliness isn't about being perfect; it's about caring for yourself, your home and your relationship with God, and starting fresh whenever you need to.","c":"Pick one habit to keep, like tidying your room every evening or taking one chore at home each week, and write it down.","p":"Lord, thank you for washing me clean. Help me keep good habits that look after me and my home.","q":"Which clean habit will I keep, and how will I remember it?"}]},{"w":20,"theme":"Digital tidy-up","intro":"Clutter, on your phone, laptop or in your room, can quietly crowd your mind. This week is about simple organising, finishing things and making space for what matters.","days":[{"t":"Order, not chaos","ref":"1 Corinthians 14:40","v":"Let all things be done decently and in order.","r":"God likes order; just look at creation. A bit of organisation helps you find things, save time and feel calmer. It doesn't need to be perfect or Pinterest-worthy, just a little more sorted than yesterday.","c":"Tidy your phone's home screen today by putting apps in folders and deleting any you haven't used in months.","p":"God, you're a God of order. Help me create a bit of calm in my space and my mind.","q":"What area of my life feels most cluttered or chaotic right now?"},{"t":"A time for everything","ref":"Ecclesiastes 3:1","v":"For everything there is a season, and a time for every purpose under heaven:","r":"There's a season for keeping things and a season for letting go. Old screenshots, duplicate photos and files you'll never open are weighing down your phone. Tidying is just choosing what belongs in this season of your life.","c":"Delete twenty photos or screenshots you don't need, and sort your best pictures into one album.","p":"Lord, give me wisdom about what to keep and what to let go. Help me be sensible about the things I collect.","q":"What do I hold on to that I no longer need?"},{"t":"Where your treasure is","ref":"Matthew 6:19-20","v":"“Don’t lay up treasures for yourselves on the earth, where moth and rust consume, and where thieves break through and steal; but lay up for yourselves treasures in heaven, where neither moth nor rust consume, and where thieves don’t break through and steal;","r":"Stuff piles up and eventually owns you. Jesus reminds you that things don't last, while kindness, faith and love do. Decluttering your belongings is a good way to loosen your grip and make room for what matters.","c":"Pick one drawer, shelf or corner of your room and clear it, sorting things into keep, give away and bin.","p":"God, help me not to cling to things. Show me what matters and give me a lighter, freer heart.","q":"What belongings really matter to me, and which are just taking up space?"},{"t":"Finish what you start","ref":"Philippians 1:6","v":"being confident of this very thing, that he who began a good work in you will complete it until the day of Jesus Christ.","r":"Half-finished projects, abandoned drawings and unread books can nag at you. God finishes what he starts in you, and he can help you follow through too. Finishing, even a small thing, feels brilliant.","c":"Choose one unfinished task or project and complete it, or decide kindly to drop it. Either way, close the loop.","p":"Father, thank you for finishing what you begin in me. Help me to follow through on things that matter.","q":"Which unfinished thing keeps bugging me, and what's the next step?"},{"t":"Fix your gaze","ref":"Proverbs 4:25","v":"Let your eyes look straight ahead. Fix your gaze directly before you.","r":"Constant notifications pull your attention in a hundred directions. Looking straight ahead means deciding what deserves your attention instead of letting pings decide for you. You are allowed to silence things.","c":"Turn off notifications for three apps that interrupt you most, and keep only those from people and things that matter.","p":"God, help me stay focused on what's in front of me. Show me which distractions I can switch off today.","q":"Which notification disturbs me most, and what would happen if I muted it?"},{"t":"One thing needed","ref":"Luke 10:41-42","v":"Jesus answered her, “Martha, Martha, you are anxious and troubled about many things, but one thing is needed. Mary has chosen the good part, which will not be taken away from her.”","r":"Martha was busy doing everything. Mary simply sat with Jesus. A cluttered mind can feel like Martha's kitchen. Tidying your digital life is useful, but the heart of it is making room to be with God.","c":"Spend ten minutes clearing your inbox, messages or school files, then sit quietly and tell God what's on your mind.","p":"Jesus, I'm often busy and distracted. Help me choose the 'one thing' that matters and sit with you.","q":"What is the 'one thing' I most need to focus on right now?"},{"t":"Review: Digital tidy-up","ref":"Colossians 3:2","v":"Set your mind on the things that are above, not on the things that are on the earth.","r":"This week was about clearing space, on your phone, in your room and in your head. Tidiness serves a purpose: it frees you up to focus on what matters. Don't aim for perfect, just a bit lighter than last week.","c":"Choose one tidy habit to keep, such as a five-minute tidy at bedtime or a monthly photo clear-out, and put a reminder on your phone.","p":"Lord, thank you for helping me make space. Keep my mind set on what matters, and help me stick to a simple habit.","q":"Which tidy-up habit will I keep, and what will remind me?"}]},{"w":21,"theme":"Saying no, setting margins","intro":"Your time is limited, and you can't do everything. This week is about balance, healthy boundaries and protecting rest, so you can do the important things well without burning out.","days":[{"t":"Come away and rest","ref":"Mark 6:31","v":"He said to them, “You come apart into a deserted place, and rest awhile.” For there were many coming and going, and they had no leisure so much as to eat.","r":"Jesus' friends were so busy they hadn't even eaten, and he told them to rest. If Jesus gave rest this much priority, you can too. Rest isn't lazy; it helps you do everything else well.","c":"Plan thirty minutes today for pure rest, with no homework, no scrolling and no chores, doing only something that relaxes you.","p":"Jesus, thank you for letting me rest. Help me stop feeling guilty when I slow down.","q":"What helps me truly rest, and when did I last do it?"},{"t":"Yes and no","ref":"Matthew 5:37","v":"But let your ‘Yes’ be ‘Yes’ and your ‘No’ be ‘No.’ Whatever is more than these is of the evil one.","r":"It's okay to say no to things when your plate is full. A clear yes or no is kinder than saying yes and feeling resentful or exhausted. You can decline politely without making excuses or feeling guilty.","c":"Practise a kind, simple 'no' to something today, such as 'Thanks for asking, but I can't this time'.","p":"God, give me courage to say no when I need to, and wisdom to say yes to the right things.","q":"What am I saying yes to that I really need to say no to?"},{"t":"Sleep is a gift","ref":"Psalm 127:2","v":"It is vain for you to rise up early, to stay up late, eating the bread of toil, for he gives sleep to his loved ones.","r":"Staying up late scrolling or cramming can feel necessary, but God gives sleep as a gift to those he loves. Your brain, mood and friendships all work better when you're properly rested.","c":"Choose a realistic bedtime tonight and put your phone on charge outside your bedroom or out of reach by that time.","p":"Father, thank you for sleep. Help me protect my rest and trust you with what I can't finish tonight.","q":"What usually keeps me up, and what could I change?"},{"t":"Plan, then hold loosely","ref":"Proverbs 16:9","v":"A man’s heart plans his course, but Yahweh directs his steps.","r":"Planning your week helps you fit things in without panic. But plans change, and that's okay. Hold your timetable with open hands, leaving gaps for surprises, people and rest, and trust God with the rest.","c":"Write out your week and add at least one free, unscheduled slot, and take something off if the week looks overfull.","p":"Lord, help me plan well but not cling to it. Direct my steps and give me peace when plans change.","q":"Is my week realistic, or have I over-filled it?"},{"t":"Overwhelmed? Come to Jesus","ref":"Matthew 11:28","v":"“Come to me, all you who labor and are heavily burdened, and I will give you rest.","r":"Sometimes it all piles up: homework, clubs, friends, family. Jesus doesn't say 'try harder'. He says 'come to me'. Telling him how overloaded you feel is a good first step, and so is telling a parent.","c":"List everything weighing on you, pray over the list, then choose the one thing to do first. Ask an adult for help with another.","p":"Jesus, I feel stretched sometimes. I come to you and ask for rest, clarity and help in sorting things out.","q":"What is weighing on me most, and who could help me carry it?"},{"t":"Still waters","ref":"Psalm 23:2-3","v":"He makes me lie down in green pastures. He leads me beside still waters. He restores my soul. He guides me in the paths of righteousness for his name’s sake.","r":"God leads you to rest as a shepherd leads sheep. Rest isn't a reward for finishing everything; it's part of the path he leads you on. Your soul gets restored in quiet places.","c":"Spend time outside or somewhere quiet today, even just ten minutes, and let your mind slow down.","p":"Lord, my shepherd, lead me to quiet places. Restore my energy and my soul when I'm worn out.","q":"Where do I feel most calm, and how can I go there more often?"},{"t":"Review: Margins","ref":"Ecclesiastes 4:6","v":"Better is a handful, with quietness, than two handfuls with labor and chasing after wind.","r":"This week was about leaving breathing room in your life. A little less, done well and with peace, beats a lot done in a frazzle. Margins protect you, your friendships and your relationship with God.","c":"Choose one boundary to keep, such as a screen-free evening, one 'no' a week or a fixed bedtime, and tell someone about it.","p":"God, thank you for rest and wisdom. Help me protect my time, and be gentle with myself when I get it wrong.","q":"Which boundary will I keep, and what will it protect?"}]},{"w":22,"theme":"Talking with God","intro":"Prayer is simply talking and listening to God. You don't need fancy words or the perfect time. This week, try different ways of praying so it feels natural to you.","days":[{"t":"God is near","ref":"Psalm 145:18","v":"Yahweh is near to all those who call on him, to all who call on him in truth.","r":"You don't have to climb a mountain or find the right words to reach God. He's already near. Honest, simple prayer, even just 'help' or 'thanks', is exactly the kind he loves to hear.","c":"Pray a short, honest prayer right now in your own words, as if you were talking to a friend sitting next to you.","p":"God, thank you that you're near. Help me to talk to you honestly, without worrying about how I sound.","q":"What would I say to God right now if I were completely honest?"},{"t":"A pattern to follow","ref":"Matthew 6:9-10","v":"Pray like this: ‘Our Father in heaven, may your name be kept holy. Let your Kingdom come. Let your will be done on earth as it is in heaven.","r":"Jesus taught his friends a simple pattern: honour God, ask for his way, then bring your needs. You can pray the words exactly or use them as a guide, with your own words in each part.","c":"Pray the Lord's Prayer slowly today, pausing after each line to add your own thoughts or requests.","p":"Father, teach me to pray the way Jesus taught. Help me put you first and bring everything else to you.","q":"Which line of the Lord's Prayer means the most to me today?"},{"t":"Ask, seek, knock","ref":"Matthew 7:7","v":"“Ask, and it will be given you. Seek, and you will find. Knock, and it will be opened for you.","r":"God invites you to ask, and keep on asking. He doesn't always answer how or when you expect, but he never ignores you. Your requests aren't too small, too silly or too big for him.","c":"Write down three things you want to ask God about, and pray over each one this evening. Note them to look back on.","p":"God, I'm bringing you my requests today. Thank you for listening, and help me trust you with the answers.","q":"What am I asking God for right now, and how will I notice his answer?"},{"t":"Pour it out","ref":"Psalm 62:8","v":"Trust in him at all times, you people. Pour out your heart before him. God is a refuge for us.","r":"You can tell God the messy stuff: the frustration, the jealousy, the anxiety, the embarrassing bit. He can handle it. Pouring out your heart is better than bottling it up or pretending to be fine.","c":"Take five minutes to tell God everything on your mind, as it comes, without tidying it up or editing.","p":"Lord, here is everything I'm feeling. Thank you for being a safe place where I don't have to pretend.","q":"What have I been holding back from telling God?"},{"t":"When words run out","ref":"Romans 8:26","v":"In the same way, the Spirit also helps our weaknesses, for we don’t know how to pray as we ought. But the Spirit himself makes intercession for us with groanings which can’t be uttered.","r":"Some days you don't know what to say, and that's fine. The Spirit helps with your weakness. Even sitting quietly, or saying 'God, I don't know what to say, but I'm here', counts as prayer.","c":"Sit quietly for three minutes. If words don't come, simply say 'I'm here, God', and listen.","p":"Holy Spirit, help me pray when I don't know how. Take my feelings and my silence and make them prayer.","q":"How do I feel when I can't find the words to pray?"},{"t":"Pray anywhere","ref":"1 Thessalonians 5:16-17","v":"Always rejoice. Pray without ceasing.","r":"Praying without ceasing doesn't mean never stopping. It means chatting to God throughout the day: on the bus, before a test, while walking the dog. Short prayers in ordinary moments add up to a close friendship.","c":"Say three short prayers today at ordinary moments, such as before a lesson, on a walk or before you reply to a message.","p":"God, help me remember you all through my day. Make prayer feel as natural as talking to a friend.","q":"Where could I fit in a quick prayer during a normal day?"},{"t":"Review: Talking with God","ref":"Jeremiah 29:12","v":"You shall call on me, and you shall go and pray to me, and I will listen to you.","r":"You tried different ways to pray this week: simple, structured, honest and quiet. God promises to listen however you do it. A short, regular habit is better than a perfect, rare one.","c":"Choose a time and place for a short daily prayer, like before bed or on the walk to school, and set a gentle reminder.","p":"Thank you, God, that you listen. Help me keep talking with you each day, and keep my prayers honest.","q":"What prayer habit works best for me, and when will I do it?"}]},{"w":23,"theme":"Open your Bible","intro":"The Bible isn't just an old book; it's how God speaks to you today. This week, look at why Scripture matters and how to read it in a way that actually sticks.","days":[{"t":"A light for your path","ref":"Psalm 119:105","v":"Your word is a lamp to my feet, and a light for my path.","r":"A lamp doesn't light up the whole road, just enough for the next step. The Bible works like that: it won't answer every question, but it shows you what to do next. Start small and keep walking.","c":"Read one short passage today, such as a few verses of a Psalm, and note one thing that stands out.","p":"God, light up my next step through your word. Help me understand what I read and see how it applies to me.","q":"What decision or situation do I need God's light on right now?"},{"t":"Useful for life","ref":"2 Timothy 3:16-17","v":"Every Scripture is God-breathed and profitable for teaching, for reproof, for correction, and for instruction in righteousness, that each person who belongs to God may be complete, thoroughly equipped for every good work.","r":"The Bible isn't a rulebook to make you feel bad. It's breathed out by God to teach, correct and equip you for real life, from friendships to decisions. It's practical, even when it's challenging.","c":"Pick a book of the Bible, such as Mark or Proverbs, and plan to read a little of it each day this month.","p":"Father, thank you for giving me your word. Make me hungry to read it and willing to let it shape me.","q":"How could reading the Bible help with something I'm facing right now?"},{"t":"Stored in your heart","ref":"Psalm 119:11","v":"I have hidden your word in my heart, that I might not sin against you.","r":"Memorising a verse means you carry it with you when you're stressed, tempted or can't open a Bible. A verse tucked in your memory can pop up at exactly the right moment, like a friend whispering encouragement.","c":"Choose one verse from this month and learn it by heart today, writing it on a card and saying it three times.","p":"Lord, help me store your word in my heart. Bring it to my mind when I need it most.","q":"Which verse do I want to remember, and why that one?"},{"t":"Alive and active","ref":"Hebrews 4:12","v":"For the word of God is living and active, and sharper than any two-edged sword, piercing even to the dividing of soul and spirit, of both joints and marrow, and is able to discern the thoughts and intentions of the heart.","r":"The Bible isn't dusty. It's described as alive and active, able to speak right into your thoughts and motives. When you read, ask God to speak personally to you, and then listen for what stands out.","c":"Read a passage slowly twice. After the second read, write down one word or phrase that grabs your attention.","p":"God, speak to me through your word today. Help me listen, and be honest about what I hear.","q":"What phrase stood out to me, and what might God be saying?"},{"t":"Do what it says","ref":"James 1:22","v":"But be doers of the word, and not only hearers, deluding your own selves.","r":"Reading is great, but doing is where change happens. Knowing 'be kind' means little until you actually are. Each time you read, ask yourself, 'What is one small thing I can do with this today?'","c":"After your reading today, choose one small action based on it, such as forgiving someone or encouraging a friend, and do it.","p":"Lord, help me not just to read but to live out your word. Give me the courage to act on it.","q":"What is one thing from my reading I can actually do today?"},{"t":"More than bread","ref":"Matthew 4:4","v":"But he answered, “It is written, ‘Man shall not live by bread alone, but by every word that proceeds out of God’s mouth.’ ”","r":"Even Jesus leaned on Scripture when he was tired and tempted. Just like your body needs food, your spirit needs feeding. Fitting in a few verses each day keeps you strong for whatever the day brings.","c":"Link Bible reading to something you already do daily, such as breakfast or brushing your teeth, so it becomes a habit.","p":"God, feed my spirit through your word. Help me find a time each day that suits me and keep to it.","q":"When in my day could I realistically read a few verses?"},{"t":"Review: Open your Bible","ref":"Psalm 119:130","v":"The entrance of your words gives light. It gives understanding to the simple.","r":"This week you saw the Bible as a lamp, a guide and food for your spirit. You don't have to understand everything. Keep reading, keep asking questions, and talk about it with someone who loves God too.","c":"Choose a simple Bible plan to keep, such as five minutes a day or one chapter of Mark a week, and write it down.","p":"Thank you, God, for giving me your word. Help me stick with reading it, and make it clear to me.","q":"What is my Bible reading plan, and who could I share it with?"}]},{"w":24,"theme":"Serve","intro":"Serving is following Jesus' example. It's rarely glamorous, but kindness in small, practical ways is how love becomes real, at home, at school and beyond.","days":[{"t":"Jesus the servant","ref":"Mark 10:45","v":"For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.”","r":"Jesus, the most important person ever, chose to serve. That turns our idea of greatness upside down. You're never too busy or too cool to help someone, and it's when you serve that you're most like him.","c":"Do a job for someone at home today, such as making a drink, setting the table or washing up, without being asked.","p":"Jesus, thank you for serving me. Help me to notice needs and be willing to help, even when it's not exciting.","q":"Who at home could I serve today in a practical way?"},{"t":"Be kind","ref":"Ephesians 4:32","v":"And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.","r":"Kindness is more than being nice; it's choosing to be gentle, patient and forgiving when it's not easy. God has been kind to you, so you have plenty to give from. Start with the people closest to you.","c":"Do something kind for a sibling, parent or friend you find a bit difficult, and don't expect anything back.","p":"God, thank you for your kindness to me. Fill me up so I can be kind to others, even when it's tough.","q":"Who is hardest for me to be kind to, and why?"},{"t":"Serving the unnoticed","ref":"Matthew 25:40","v":"“The King will answer them, ‘Most certainly I tell you, because you did it to one of the least of these my brothers, you did it to me.’","r":"Jesus says that how we treat people others overlook, he counts as done for him. Think of the new student, the lonely person, the one who sits alone. A hello or an invitation can mean everything to them.","c":"Look for someone who seems left out today, and sit with them, say hello or invite them into your group.","p":"Lord, open my eyes to people who feel invisible. Give me courage to include them and show them love.","q":"Who might feel left out at school or in my circle, and how could I help?"},{"t":"Use your gifts","ref":"1 Peter 4:10","v":"As each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms.","r":"Whether you're good at art, listening, sport, maths, music or making people laugh, your abilities are meant to be shared. Serving doesn't require anything special, just using what you already have for someone else's good.","c":"Think of something you're good at and offer it to someone, such as helping with homework, drawing a card or playing music.","p":"God, thank you for the gifts you've given me. Show me how to use them to help other people.","q":"What am I good at that could help someone else?"},{"t":"Kindness to the poor","ref":"Proverbs 19:17","v":"He who has pity on the poor lends to Yahweh; he will reward him.","r":"Caring for people in need matters to God. You might not be able to fix big problems, but small actions add up: donating, volunteering or simply learning about those who struggle. Compassion starts with noticing.","c":"Find one way to help someone in need, such as donating food, joining a local project or asking a parent how you can help.","p":"Father, give me a caring heart for those who struggle. Show me one practical thing I can do to help.","q":"What need in my community could I help with, however small?"},{"t":"Carry each other","ref":"Galatians 6:2","v":"Bear one another’s burdens, and so fulfill the law of Christ.","r":"Everyone carries something heavy sometimes, like a bad day, a family worry or exam stress. Being there for a friend doesn't mean fixing it. Listening, checking in and saying 'I'm here' can lift more than you think.","c":"Check in with a friend who might be struggling today, and really listen to their answer without rushing to fix things.","p":"Lord, help me to be a good friend who listens. Show me who needs company or encouragement today.","q":"Which friend might need me to check on them this week?"},{"t":"Review: Serve","ref":"Micah 6:8","v":"He has shown you, O man, what is good. What does Yahweh require of you, but to act justly, to love mercy, and to walk humbly with your God?","r":"Serving isn't an extra; it's what God asks: be fair, be merciful and stay humble. This week you've practised small acts of love. Keep them going, and notice how they change you as well as other people.","c":"Pick one act of service to keep, such as helping with one chore each week or doing a daily kind act, and put it in your calendar.","p":"God, thank you for the chance to serve. Help me keep helping others humbly and without needing credit.","q":"Which act of service will I keep doing, and who will benefit?"}]},{"w":25,"theme":"Enough","intro":"Comparison steals joy quietly, especially online and at school. This week is about being content with who you are and what you have, and trusting that God made you on purpose.","days":[{"t":"Learning contentment","ref":"Philippians 4:11","v":"Not that I speak because of lack, for I have learned in whatever state I am, to be content in it.","r":"Notice Paul says he 'learned' contentment, so it's a skill, not a personality type. You can grow in it with practice. It doesn't mean you never want more; it means your peace doesn't depend on getting it.","c":"List five things you already have that you'd miss if they were gone, and keep that list somewhere you'll see it.","p":"God, teach me to be content. Help me appreciate what I have instead of always wanting the next thing.","q":"What do I already have that I'm really glad about?"},{"t":"He won't leave you","ref":"Hebrews 13:5","v":"Be free from the love of money, content with such things as you have, for he has said, “I will in no way leave you, neither will I in any way forsake you.”","r":"The secret of contentment is knowing that God is with you, and that's something no brand, post or purchase can match. Things come and go, but his presence stays, so you already have what matters most.","c":"Next time you feel the pull to buy or want something, stop and pray before you decide whether you truly need it.","p":"Lord, thank you that you never leave me. Help me remember that having you is worth more than any thing.","q":"What do I tend to think will make me happier, and is it true?"},{"t":"Run your own race","ref":"Galatians 6:4","v":"But let each man examine his own work, and then he will have reason to boast in himself, and not in someone else.","r":"Comparing yourself to others, their grades, looks, followers or friends, is a race you can never win. You have your own path. Looking at how far you've come, not at who's ahead, is the healthier measure.","c":"Notice any time you compare yourself today, and replace it with one thing you've done well or improved at lately.","p":"God, help me stop comparing. Show me my own progress and let me cheer on others instead of competing.","q":"Who do I compare myself with, and how does it make me feel?"},{"t":"Envy hurts you","ref":"Proverbs 14:30","v":"The life of the body is a heart at peace, but envy rots the bones.","r":"Envy feels like a small thing, but it eats away at you. Being jealous of a friend's success or style leaves you tired and sour. Celebrating others instead frees you, and often makes the friendship stronger.","c":"Say something sincerely positive to a person you feel a bit jealous of, such as a genuine compliment or congratulations.","p":"Father, take away jealousy from my heart. Help me be truly happy for others and trust you with my own life.","q":"What am I secretly jealous of, and what might God be showing me?"},{"t":"Made on purpose","ref":"Ephesians 2:10","v":"For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them.","r":"You're not an accident or a copy. You're God's handiwork, created for good things he planned in advance. Your personality, strengths and quirks are part of that design. You have something unique to offer.","c":"Write down three things you like about who you are, including a quality, a talent and something about your character.","p":"God, thank you for making me me. Help me to see myself the way you see me, and to enjoy it.","q":"What is something unique about me that I'm learning to appreciate?"},{"t":"A good portion","ref":"Psalm 16:5-6","v":"Yahweh assigned my portion and my cup. You made my lot secure. The lines have fallen to me in pleasant places. Yes, I have a good inheritance.","r":"David looked at his life and called it a good portion, not because it was perfect but because God was in it. Take a moment to see the 'pleasant places' you've been given, and thank God for them.","c":"Take a short walk or look around your room and name five good things in your life aloud, thanking God for each.","p":"Lord, thank you for what you've given me. Help me see my life as a good portion and be satisfied.","q":"What are the 'pleasant places' in my life right now?"},{"t":"Review: Enough","ref":"Psalm 23:1","v":"Yahweh is my shepherd: I shall lack nothing.","r":"This week was about knowing that with God, you have enough. You'll still feel pulls to compare and want more, and that's normal. Come back to this: he is your shepherd, and he provides what you really need.","c":"Choose one habit to keep contentment going, such as unfollowing a comparison trigger or writing three good things each night.","p":"God, you are my shepherd and I have enough in you. Help me remember it when I'm tempted to compare.","q":"Which contentment habit will I keep, and what's my first step?"}]},{"w":26,"theme":"Hard days","intro":"Everyone has hard days: disappointments, losses, sadness, times when nothing feels right. This week is gentle. God is near in the dark times, and you don't have to cope alone.","days":[{"t":"Close to the broken-hearted","ref":"Psalm 34:18","v":"Yahweh is near to those who have a broken heart, and saves those who have a crushed spirit.","r":"When you're hurting, God doesn't stand at a distance or tell you to cheer up. He moves closer. Whatever's weighing you down today, you're not too much for him, and you don't have to hide it.","c":"Tell God honestly how you're feeling today, even if it's sad or angry, and then sit quietly for a minute.","p":"God, I'm hurting and I need you close. Hold me, and help me know I'm not alone.","q":"What am I feeling today, and what do I need most right now?"},{"t":"Morning comes","ref":"Psalm 30:5","v":"For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning.","r":"Disappointments such as a lost friendship, a bad result or a cancelled plan really hurt. This verse doesn't deny the tears; it says they're not the end. Hard seasons do pass, and light does come again.","c":"Be kind to yourself today: do one small comforting thing, such as a favourite snack, a warm shower, music or a chat with someone you trust.","p":"Lord, I feel let down. Comfort me, and help me believe that better days are coming.","q":"What disappointment am I carrying, and how can I be gentle with myself?"},{"t":"Grief is allowed","ref":"Matthew 5:4","v":"Blessed are those who mourn, for they shall be comforted.","r":"If you've lost someone or something you loved, whether a person, a pet, a friend or a home, your sadness matters. Jesus says those who mourn will be comforted. You're allowed to cry and take your time.","c":"Look at a photo or memory that makes you think of someone you miss, and tell God or a trusted person about them.","p":"Jesus, I miss what I've lost. Comfort me, and be gentle with me as I grieve in my own time.","q":"What or who do I miss, and what do I want to remember?"},{"t":"Peace in trouble","ref":"John 16:33","v":"I have told you these things, that in me you may have peace. In the world you have trouble; but cheer up! I have overcome the world.”","r":"Jesus doesn't promise a trouble-free life. He promises peace in him, and that he has already overcome. Hard things are real, but they don't get the final word. You can hold on to that when life feels heavy.","c":"Write down one thing that feels hard right now, then write 'Jesus is with me in this' beside it and pray over it.","p":"Jesus, thank you that you've overcome the world. Give me your peace in the middle of my trouble.","q":"What trouble do I need to hand over to Jesus right now?"},{"t":"Don't carry it alone","ref":"Ecclesiastes 4:9-10","v":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn’t have another to lift him up.","r":"God made us for each other. When life is heavy, talking to a parent, relative, teacher or youth leader is a strong thing to do, not a weak one. If you ever feel unsafe or want to hurt yourself, tell an adult straight away.","c":"Choose one trusted adult and tell them honestly how you've been feeling lately. If you feel unsafe, tell them right away.","p":"God, send me people I can trust. Give me courage to say how I feel, and thank you for those who care.","q":"Who is the trusted adult I could talk to, and what will I say?"},{"t":"New every morning","ref":"Lamentations 3:22-23","v":"It is because of Yahweh’s loving kindnesses that we are not consumed, because his compassion doesn’t fail. They are new every morning. Great is your faithfulness.","r":"The writer of this verse was in a terrible time, yet found hope in God's faithfulness. Each morning is a fresh start, with fresh mercy. Yesterday's heaviness doesn't have to define today. Take it one day at a time.","c":"Tomorrow morning, before you look at your phone, say 'new mercies today' and ask God to help you take just the next step.","p":"Faithful God, thank you that your mercies are new every morning. Help me face each day with fresh hope.","q":"What small thing gave me hope or comfort during a hard time?"},{"t":"Review: Hard days","ref":"Psalm 55:22","v":"Cast your burden on Yahweh and he will sustain you. He will never allow the righteous to be moved.","r":"This week you've learned that hard days don't mean God has gone. He's near, he comforts, and he uses people to help. Looking back, you're stronger than you think. If you ever feel unsafe, always tell an adult straight away.","c":"Make a short 'hard day' plan: three things that help you, such as music, a walk or a trusted person to text.","p":"Lord, I hand you my burdens. Thank you for sustaining me. Help me reach out for help when I need it.","q":"What helps me most on a hard day, and who can I turn to?"}]},{"w":27,"theme":"Wise choices","intro":"Every day you make choices, big and small. This week you will practise pausing, asking God for wisdom, listening to good advice, and choosing well even when the right path is not obvious.","days":[{"t":"Ask for wisdom","ref":"James 1:5","v":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.","r":"You do not have to work everything out alone. God is generous with wisdom and will not roll his eyes when you ask. Wisdom often starts with simply admitting, 'I could use some help here.'","c":"Before your next decision today, even a small one like how to spend your free time, pause for ten seconds and ask God for wisdom.","p":"God, I need wisdom for the choices in front of me this week. Show me what is wise and give me courage to do it.","q":"What decision am I facing right now where I need wisdom?"},{"t":"Lean on more than yourself","ref":"Proverbs 3:5-6","v":"Trust in Yahweh with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.","r":"Your feelings are real, but they are not always right. When you are tired, annoyed or excited, your judgement can wobble. Trusting God means bringing your plans to him instead of only trusting your first instinct.","c":"Think of one thing you are unsure about. Write it down, then pray over it and sleep on it before deciding.","p":"Lord, help me not to rely only on my own feelings. I give you this decision and ask you to guide my steps.","q":"Where have I trusted my gut and later wished I had paused?"},{"t":"Start with respect for God","ref":"Proverbs 1:7","v":"The fear of Yahweh is the beginning of knowledge; but the foolish despise wisdom and instruction.","r":"Respecting God does not mean being scared of him. It means remembering he is God and you are not, and that his way really is best. That humble starting point makes every other choice clearer.","c":"Pick one instruction from the Bible or a trusted adult that you have been ignoring, and take one step to follow it today.","p":"God, I honour you as the source of all wisdom. Make me someone who listens to your instruction instead of brushing it off.","q":"What instruction have I been ignoring that I know is good for me?"},{"t":"Choose your voices","ref":"Proverbs 13:20","v":"One who walks with wise men grows wise, but a companion of fools suffers harm.","r":"The people you spend time with shape you more than you notice. This is not about being snobby or dropping friends. It is about making sure at least some of your voices are wise ones you can learn from.","c":"Name one person, such as a relative, youth leader or older friend, whose wisdom you respect. Ask them one real question today.","p":"Father, bring wise people into my life and give me the humility to listen to them. Help me be a good friend too.","q":"Who are the wisest voices in my life, and do I actually listen?"},{"t":"A light for the next step","ref":"Psalm 119:105","v":"Your word is a lamp to my feet, and a light for my path.","r":"A lamp does not light up the whole road, just the next few steps. God often guides you the same way. You may not see the entire plan, but you can usually see what to do next.","c":"Read a short passage from the Bible today and ask, 'What is one thing here I can do before bed?' Then do it.","p":"God, thank you that you guide me one step at a time. Help me to trust you with the parts I cannot see yet.","q":"What is the very next step I can see, even if the rest is blurry?"},{"t":"Think before you act","ref":"Proverbs 14:15","v":"A simple man believes everything, but the prudent man carefully considers his ways.","r":"It is easy to follow whatever is trending, shared in the group chat or said with confidence. Being wise means asking a few questions first: Is this true? Is this kind? Where will this lead?","c":"Before you share, repost or agree with something today, ask yourself three questions: is it true, is it kind, and where could it lead?","p":"Lord, give me a thoughtful mind. Help me slow down enough to check things before I jump in or pass them on.","q":"When did pausing last stop me from making a mistake?"},{"t":"Review: Wise choices","ref":"Psalm 32:8","v":"I will instruct you and teach you in the way which you shall go. I will counsel you with my eye on you.","r":"This week you have seen that wisdom is something you ask for, listen for and practise. God is not hiding the right way from you. He promises to teach and watch over you as you learn.","c":"Choose one wisdom habit to keep, such as asking God before decisions, pausing before posting, or asking an older person for advice. Write it where you will see it.","p":"Thank you, God, for teaching me. Help me keep the wisdom habit I chose, and forgive me for choices I regret.","q":"Which choice this week am I proud of, and what did I learn?"}]},{"w":28,"theme":"Self-control","intro":"Self-control is not about being perfect or punishing yourself. This week is about spotting the moments that pull you off course, building small habits, and leaning on the strength God provides.","days":[{"t":"Walls around your life","ref":"Proverbs 25:28","v":"Like a city that is broken down and without walls is a man whose spirit is without restraint.","r":"In old times, a city without walls was easy to attack. A life with no self-control feels the same: everything rushes in. Small boundaries are not a cage. They protect what matters to you.","c":"Choose one small boundary today, like phone down during homework or no scrolling in the first ten minutes after waking. Keep it.","p":"God, help me build healthy walls around my time, my habits and my heart. Show me where I am too open.","q":"Which area of my life feels most like a city without walls?"},{"t":"Fruit, not force","ref":"Galatians 5:22-23","v":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faith, gentleness, and self-control. Against such things there is no law.","r":"Notice that self-control is called fruit, something that grows as you stay close to God, not something you grit your teeth and force. You still take part, but you are not doing it alone.","c":"Spend two minutes asking God to grow self-control in you, then choose one moment today where you will practise saying no to impulse.","p":"Holy Spirit, grow your fruit in me, especially self-control. Help me depend on you when my own willpower runs out.","q":"Where do I try to rely only on my own willpower?"},{"t":"There is always a way out","ref":"1 Corinthians 10:13","v":"No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it.","r":"Feeling tempted is not a sign you are a bad person. Everyone faces it. The good news is that God promises a way out each time. Your job is to notice it and actually take it.","c":"Think of a situation that usually pulls you in, like late-night scrolling or snapping at a sibling. Plan one exit move for next time.","p":"Faithful God, thank you that I am never trapped. Open my eyes to the way out when I feel pulled.","q":"What is my usual temptation, and what exit could I plan?"},{"t":"Watch and pray","ref":"Matthew 26:41","v":"Watch and pray, that you don’t enter into temptation. The spirit indeed is willing, but the flesh is weak.”","r":"Jesus knew that wanting to do right is not always enough, especially when you are tired. That is why he says to watch and pray. Praying early makes you stronger before the pressure arrives, not after.","c":"Pray for ten seconds before the part of your day that usually trips you up, such as getting home or starting homework.","p":"Jesus, I want to do what is right, but I get weak. Help me pray first and rely on your strength.","q":"At what time of day is my self-control weakest?"},{"t":"Power, love and a clear mind","ref":"2 Timothy 1:7","v":"For God didn’t give us a spirit of fear, but of power, love, and self-control.","r":"Self-control is not meant to feel like anxiety or constant guilt. God gives it alongside power and love. You can say no to something because you are free, not because you are scared of getting it wrong.","c":"Swap one guilty thought today for a truth. Say out loud, 'God has given me power, love and self-control,' when you feel weak.","p":"God, thank you that your Spirit in me is not fearful. Replace my guilt with confidence in your power.","q":"How would my day feel different if I believed this verse?"},{"t":"Guard your eyes","ref":"Psalm 119:37","v":"Turn my eyes away from looking at worthless things. Revive me in your ways.","r":"What you look at, scroll through and watch fills your mind. Not everything is harmful, but some things drain you or make you feel worse. It is wise to notice what leaves you feeling empty or restless.","c":"Unfollow, mute or delete one thing that regularly leaves you feeling worse. If it is difficult to decide, ask a trusted adult.","p":"Lord, turn my eyes toward what is good. Give me the courage to remove what is pulling me down.","q":"What do I watch or scroll that leaves me feeling drained?"},{"t":"Review: Self-control","ref":"Galatians 6:9","v":"Let’s not be weary in doing good, for we will reap in due season, if we don’t give up.","r":"Self-control is built slowly, through lots of small wins and a few stumbles. If you slipped this week, you are not a failure. Get up, ask God for help, and keep going. Growth takes time.","c":"Pick one habit from this week to keep going for the next seven days. Make it tiny so it is easy to repeat.","p":"God, thank you for being patient with me. Help me keep going with the habit I chose, even when it feels slow.","q":"What was my biggest win this week, even if it was small?"}]},{"w":29,"theme":"Humble","intro":"Humility is not thinking badly of yourself. It is seeing yourself honestly, valuing others, and staying willing to learn. This week you will discover why God loves humble hearts so much.","days":[{"t":"Others first","ref":"Philippians 2:3-4","v":"doing nothing through rivalry or through conceit, but in humility, each counting others better than himself; each of you not just looking to his own things, but each of you also to the things of others.","r":"Humility means you stop making everything about you. It does not mean you are worth less. It means you notice other people's needs and let that change how you act, even in small things.","c":"Notice one person today who is quiet or left out, and do something kind for them, like inviting them to join in or saying hello.","p":"God, help me look beyond myself. Show me who needs kindness today and give me the courage to offer it.","q":"Who around me might need me to notice them this week?"},{"t":"Pride trips you up","ref":"Proverbs 11:2","v":"When pride comes, then comes shame, but with humility comes wisdom.","r":"Pride can make you refuse to say sorry, hide mistakes or pretend you know more than you do. That usually ends worse than just being honest. Humble people can admit when they are wrong, and that is wisdom.","c":"If you have made a mistake lately, admit it today to the person involved. Keep it short and honest, with no excuses.","p":"Lord, show me where pride is making things worse. Give me the courage to say, 'I was wrong,' when I need to.","q":"Is there something I need to admit or apologise for?"},{"t":"Be teachable","ref":"Proverbs 12:15","v":"The way of a fool is right in his own eyes, but he who is wise listens to counsel.","r":"Nobody enjoys being corrected, but a teachable person grows faster than a know-it-all. Feedback from a teacher, parent or coach is often a gift, even if it stings for a moment.","c":"Next time someone gives you feedback today, say 'thank you' first, then think about what you can learn from it before responding.","p":"God, make me teachable. Help me hear advice without getting defensive, and sort out what is useful.","q":"What is one piece of feedback I have been resisting?"},{"t":"Walk humbly","ref":"Micah 6:8","v":"He has shown you, O man, what is good. What does Yahweh require of you, but to act justly, to love mercy, and to walk humbly with your God?","r":"God keeps it simple: do right, be kind and stay humble before him. Walking humbly with God means remembering you need him every day, not just when things go wrong.","c":"Start your day with one honest sentence to God, such as 'I need you today,' and notice how it changes your attitude.","p":"God, I want to walk with you humbly. Remind me today that I need you, and I am grateful for you.","q":"What does walking humbly with God look like in my normal day?"},{"t":"Let others cheer","ref":"Proverbs 27:2","v":"Let another man praise you, and not your own mouth; a stranger, and not your own lips.","r":"Social media makes bragging feel normal. You can be proud of your achievements without constantly announcing them. Real confidence is quiet. It lets your actions speak and celebrates others as well.","c":"Celebrate someone else's success today with a sincere compliment or message, and resist the urge to mention your own good news unless asked.","p":"Father, free me from needing to impress people. Help me enjoy my achievements and cheer for others too.","q":"Do I ever boast to feel better, and what am I really needing?"},{"t":"Lifted by God","ref":"Matthew 23:12","v":"Whoever exalts himself will be humbled, and whoever humbles himself will be exalted.","r":"God's way of success is the opposite of the world's. You do not need to climb over people or push yourself forward. Serving others and staying humble is how real, lasting honour grows.","c":"Do one unseen job at home today without being asked, like clearing the table or tidying a shared space, and say nothing about it.","p":"Jesus, you humbled yourself for me. Teach me to serve quietly and trust you to lift me up in your time.","q":"What task could I do quietly today that nobody expects me to do?"},{"t":"Review: Humble","ref":"1 Peter 5:6","v":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time,","r":"This week you have seen that humility is strength under control. It is honest about weaknesses, open to learning and kind to others. God cares for humble people and you can trust his timing.","c":"Choose one humble habit to keep, such as saying thank you for feedback, admitting mistakes quickly, or cheering for others. Put a reminder on your mirror.","p":"God, thank you for caring about me. Help me stay humble and trust your timing for my life.","q":"Where did humility make a difference to me this week?"}]},{"w":30,"theme":"Peacemaker","intro":"Arguments and anger happen, even in good families and friendships. This week you will learn how to cool things down, speak gently, forgive, and become someone who builds peace instead of winning fights.","days":[{"t":"Blessed peacemakers","ref":"Matthew 5:9","v":"Blessed are the peacemakers, for they shall be called children of God.","r":"Peacemaking is not the same as avoiding conflict or being a pushover. It means working to make things right, calmly and fairly. Jesus says those who do this reflect God's character.","c":"Think of one tension in your life, perhaps with a friend or sibling. Take one small step toward peace today, like a kind message.","p":"Jesus, make me a peacemaker. Show me where I can calm things down instead of making them worse.","q":"Where in my life is there tension that I could help ease?"},{"t":"Soft words","ref":"Proverbs 15:1","v":"A gentle answer turns away wrath, but a harsh word stirs up anger.","r":"Ever noticed how a snappy reply makes an argument bigger? Your tone is powerful. A calm, gentle answer can take the heat out of a moment before it explodes into something you regret.","c":"The next time you feel like snapping at someone today, take one slow breath and answer in a quieter voice than usual.","p":"God, set a guard on my tongue. Help me choose gentle words when I feel annoyed.","q":"What usually makes me snap, and what could I do differently?"},{"t":"Slow to anger","ref":"James 1:19-20","v":"So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger; for the anger of man doesn’t produce the righteousness of God.","r":"Listening first can change a conflict completely. Anger is a normal feeling, but it makes a poor driver. If you are very upset, step away for a few minutes before you say anything. If anger feels too big, talking to a trusted adult is a strong move.","c":"In your next disagreement, listen to the other person until they finish, then repeat back what you heard before you respond.","p":"Lord, teach me to listen before I speak. Help me manage my anger and not let it control me.","q":"How do I usually behave when I am angry, and is that how I want to be?"},{"t":"Drop the bitterness","ref":"Ephesians 4:31-32","v":"Let all bitterness, wrath, anger, outcry, and slander be put away from you, with all malice. And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.","r":"Holding on to a grudge feels like protection, but it mostly hurts you. Forgiving does not mean what happened was fine. It means you stop carrying it around. If someone hurt you badly, a trusted adult can help you through it.","c":"Write down a grudge you are carrying, pray about it, and then rip up or delete the note as a picture of letting go.","p":"God, you forgave me so much. Help me release my bitterness and treat others with tenderness, even when it is hard.","q":"What am I holding on to that I would like to put down?"},{"t":"Do your part","ref":"Romans 12:18","v":"If it is possible, as much as it is up to you, be at peace with all men.","r":"You cannot control how other people behave. Sometimes peace takes two people and you only control one. This verse is freeing: do your part, be honest and kind, and then you can let the rest go.","c":"Do your part in one strained relationship today. Say sorry for your side, offer a friendly hello or simply stay calm.","p":"Father, help me do my part for peace. Give me peace about the things I cannot control.","q":"What is my part in this tension, and what is not mine to fix?"},{"t":"Forgive as you are forgiven","ref":"Colossians 3:13","v":"bearing with one another, and forgiving each other, if any man has a complaint against any; even as Christ forgave you, so you also do.","r":"Everyone is annoying sometimes, including you. Bearing with people means giving grace for quirks and mistakes. Forgiveness is a decision you can make, even before your feelings catch up.","c":"Pick a person who irritates you and think of two good things about them. Say one of those things to them or to God t
