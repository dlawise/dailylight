gs that light you up aren’t accidents. When you enjoy God, your desires start to line up with His good plans. Pay attention to what you are drawn to. It might be a clue.","c":"Spend half an hour doing something you really enjoy, like drawing, sport, music, baking or writing, and thank God for it as you go.","p":"Thank God for the things you enjoy. Ask Him to shape your desires so they match what He has in mind.","q":"What activity makes you lose track of time, and why do you think that is?"},{"t":"Made on purpose","ref":"Ephesians 2:10","v":"For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them.","r":"The word ‘workmanship’ means something like a masterpiece. You weren’t made by accident. There are good things God has prepared for you to do, and you walk into them one day at a time.","c":"Do one good thing today that you didn’t have to do, such as helping a neighbour, helping a friend or tidying for someone.","p":"Thank God that He made you with purpose. Ask Him to show you the good things He has prepared for you.","q":"What good thing do you think God might want you to do this year?"},{"t":"More than you imagine","ref":"Ephesians 3:20","v":"Now to him who is able to do exceedingly abundantly above all that we ask or think, according to the power that works in us,","r":"Your biggest dream may still be smaller than what God can do. That doesn’t mean you shouldn’t dream; it means you can dream with open hands, trusting He may exceed what you picture.","c":"Write one big, brave prayer about your future, and then put it somewhere you will see it. Pray it on and off this week.","p":"Pray a big prayer today, one you are almost nervous to ask. Tell God you trust Him with the result.","q":"If nothing could stop you, what would you ask God for?"},{"t":"Review: planning with God","ref":"Proverbs 16:9","v":"A man’s heart plans his course, but Yahweh directs his steps.","r":"This week you dreamed, noticed your gifts and thought about your future. Planning is good, but holding plans loosely is wiser. God steers the steps, and sometimes the road turns out better than the plan.","c":"Choose one small step toward a dream, like researching, practising or asking someone about it, and put a date for it in your diary.","p":"Give your plans and dreams to God. Ask Him to direct your steps and keep your heart open.","q":"What is one small step toward a dream you can take this month?"}]},{"w":48,"theme":"Hope","intro":"Hope is not wishful thinking; it is confidence in a God who is good. This week you will find steady ground for the days when things feel unsettled, whether at school, home, or inside your head.","days":[{"t":"The God of hope","ref":"Romans 15:13","v":"Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope, in the power of the Holy Spirit.","r":"Hope isn’t something you have to generate by trying harder. It is something God fills you with. When you feel low on it, you can simply ask. He enjoys answering that prayer.","c":"Pray this verse out loud, putting your name in it: ‘God, fill me with joy, peace and hope.’ Say it a few times today.","p":"Ask God to fill you with hope today, especially in the areas where things feel uncertain.","q":"Where do you most need hope right now?"},{"t":"An anchor","ref":"Hebrews 6:19","v":"This hope we have as an anchor of the soul, a hope both sure and steadfast and entering into that which is within the veil;","r":"An anchor doesn’t stop storms; it stops you drifting. When exam stress, friend drama or family changes toss you around, your hope in Jesus keeps you from being swept away. He stays steady even when you don’t.","c":"Draw a small anchor on your hand or in your notebook. When you feel unsettled today, look at it and remember God holds steady.","p":"Thank Jesus that He’s your anchor in rough weather. Ask Him to keep you steady today.","q":"What has felt like a storm recently, and what steady things do you still have?"},{"t":"Working it for good","ref":"Romans 8:28","v":"We know that all things work together for good for those who love God, for those who are called according to his purpose.","r":"This verse does not say every event is good. It says God can weave even painful things into something good. Not always quickly, and not always in the way you would choose, but He does not waste anything.","c":"Think of something hard from the past that eventually led to something good. Thank God for it, and tell someone about it today.","p":"Thank God that He can bring good out of hard things. Ask Him to help you trust Him with what you can’t yet see.","q":"Can you think of a hard time that later led to something good?"},{"t":"Talking to your soul","ref":"Psalm 42:11","v":"Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him, the saving help of my countenance, and my God.","r":"The writer argues with his own gloomy feelings and tells them where to look. When your mood sinks, you can speak truth to yourself. If you feel low for long, tell a trusted adult. It’s a wise, brave step.","c":"Write down three things you’re thankful for. Then say the verse aloud, telling your own heart to hope in God.","p":"Tell God honestly how low you feel. Ask Him to lift you, and for people who can support you.","q":"What would you say to your own heart if you were being as kind as God?"},{"t":"Renewed strength","ref":"Isaiah 40:31","v":"but those who wait for Yahweh will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.","r":"Waiting is hard when you want answers now. But waiting on God isn’t wasted time; it is when He renews you. Some days you will soar, and some days you will just keep walking. Both count.","c":"Pick one thing you are waiting on, like an answer, a result or a change. Hand it to God and do something restful instead.","p":"Tell God what you are waiting for. Ask Him to renew your strength while you wait.","q":"What are you waiting for, and what would trusting God while you wait look like?"},{"t":"One day at a time","ref":"Matthew 6:34","v":"Therefore don’t be anxious for tomorrow, for tomorrow will be anxious for itself. Each day’s own evil is sufficient.","r":"Your mind can race ahead to next week, next term, even next year. Jesus gently pulls you back to today. You have enough grace for today’s needs, and tomorrow’s grace is waiting there when you arrive.","c":"When your thoughts jump ahead today, say, ‘That’s for tomorrow.’ Then focus on one thing in front of you right now.","p":"Ask God to help you live today and not rush ahead in worry. Thank Him for today’s grace.","q":"What worry about the future could you leave with God until tomorrow?"},{"t":"Review: hope that holds","ref":"Psalm 62:5","v":"My soul, wait in silence for God alone, for my expectation is from him.","r":"This week you looked at hope as an anchor, a promise and a daily choice. Hope grows when you remember what God has done, talk to Him honestly, and lean on trusted people when life feels heavy.","c":"Choose one hope-builder to keep, such as a gratitude list, a verse on your wall or a weekly chat with someone you trust.","p":"Thank God that your hope rests on Him, not on how things look. Ask Him to keep your hope alive.","q":"What is one thing that has helped you hold onto hope this week?"}]},{"w":49,"theme":"Light in the dark","intro":"Jesus came into a dark world as its light. This week you will think about the first Christmas, the coming of Jesus, and how His light shines into your own dark or difficult places.","days":[{"t":"The light of the world","ref":"John 8:12","v":"Again, therefore, Jesus spoke to them, saying, “I am the light of the world. He who follows me will not walk in the darkness, but will have the light of life.”","r":"Light changes a room instantly. Jesus doesn’t just describe light; He says He is the light. Following Him means you won’t be lost in the dark, even when you can’t see the whole road.","c":"Light a candle, switch on fairy lights or open the curtains. Take a minute and thank Jesus for being your light.","p":"Thank Jesus for being the light of the world and of your life. Ask Him to guide you today.","q":"Where in your life do you most need Jesus’ light right now?"},{"t":"A great light","ref":"Isaiah 9:2","v":"The people who walked in darkness have seen a great light. The light has shined on those who lived in the land of the shadow of death.","r":"Hundreds of years before Jesus was born, God promised light would come. The world felt dark, but God had not forgotten. Waiting seasons in your own life are not forgotten seasons either.","c":"Look at the lights around you, such as street lamps, Christmas lights or stars. Each time you notice one, remember God keeps His promises.","p":"Thank God that He keeps His promises, even the ones that take time. Ask Him to help you wait with trust.","q":"What promise of God do you most need to remember at the moment?"},{"t":"Darkness can’t win","ref":"John 1:5","v":"The light shines in the darkness, and the darkness hasn’t overcome it.","r":"Dark times are real: sadness, tension, bad news. But notice the verse: the darkness has not overcome the light. It can’t. One tiny flame in a pitch-black room still wins. If things feel too dark, please talk to someone you trust.","c":"Think of one dark or difficult thing you face. Name it to God and to a trusted person, and let some light in.","p":"Tell God about the dark places in your life. Ask Him to shine His light there and send you help.","q":"What dark or hard thing could you invite God’s light into?"},{"t":"No need to fear","ref":"Psalm 27:1","v":"Yahweh is my light and my salvation. Whom shall I fear? Yahweh is the strength of my life. Of whom shall I be afraid?","r":"Fear shrinks when you remember who is with you. David wrote this when facing real enemies, so this is no fairy-tale verse. Having God as your light and your strength gives you courage to face things you would rather avoid.","c":"Say this verse before something that makes you nervous today, such as a test, a conversation or a trip. Breathe slowly and say it again.","p":"Ask God to be your light and strength when you feel fear. Thank Him that He is with you.","q":"What makes you feel braver when you remember God is on your side?"},{"t":"Let it shine","ref":"Matthew 5:16","v":"Even so, let your light shine before men; that they may see your good works, and glorify your Father who is in heaven.","r":"You are not the source of the light, Jesus is, but you get to reflect it. Kindness, honesty and patience at home and school are like small lamps. People may never mention it, but they notice.","c":"Do one quiet act of kindness today that nobody has to know about, such as helping, sharing or including someone.","p":"Ask God to let His light shine through you in everyday ways. Ask for the courage to be kind.","q":"Where could you be a small light for someone this week?"},{"t":"Dawn is coming","ref":"Luke 1:78-79","v":"because of the tender mercy of our God, by which the dawn from on high will visit us, to shine on those who sit in darkness and the shadow of death; to guide our feet into the way of peace.”","r":"Jesus is described here as the dawn breaking. After a long night, the sunrise is such a relief. He brings guidance and peace, and He does it because of God’s tender mercy, not because you earned it.","c":"Notice the light early tomorrow, whether sunrise, a window or a lamp, and use that moment to thank God for a fresh start.","p":"Thank God for His tender mercy in sending Jesus. Ask Him to guide your feet toward peace this week.","q":"What does peace look like for you right now?"},{"t":"Review: bring light","ref":"John 12:46","v":"I have come as a light into the world, that whoever believes in me may not remain in the darkness.","r":"This week you saw that Jesus came into the dark on purpose. You do not have to stay stuck in it. You can walk in His light, share it, and trust that no night lasts forever.","c":"Pick one way to keep light visible, like a candle at your desk, a Bible verse on a sticky note or a daily thank-you prayer.","p":"Thank Jesus for coming to bring light. Ask Him to help you walk in it and share it with others.","q":"What is one thing you learned about Jesus as light this week?"}]},{"w":50,"theme":"The greatest gift","intro":"Christmas is about a gift so big it changed everything: God sent Jesus. This week you will think about receiving that gift, giving to others, and finding joy beyond the wrapping paper.","days":[{"t":"Good news of great joy","ref":"Luke 2:10-11","v":"The angel said to them, “Don’t be afraid, for behold, I bring you good news of great joy which will be to all the people. For there is born to you today, in David’s city, a Savior, who is Christ the Lord.","r":"The first people to hear about Jesus were ordinary shepherds working the night shift. God sent the news to them first. This good news isn’t only for the impressive or the perfect. It’s for everyone, including you.","c":"Read the Christmas story in Luke 2:1-20. Afterwards, pick the moment you like best and think about why.","p":"Thank God for sending Jesus as good news for you. Tell Him what part of the story means the most.","q":"Which part of the Christmas story stands out to you most, and why?"},{"t":"Born for us","ref":"Isaiah 9:6","v":"For a child is born to us. A son is given to us; and the government will be on his shoulders. His name will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.","r":"These names describe who Jesus is: a wise guide, a strong God, a loving father, a bringer of peace. Which one do you need most today? You can ask Him to be exactly that for you.","c":"Choose one of these names for Jesus that you need most today. Write it on a card and carry it with you.","p":"Pray to Jesus using the name you chose. Tell Him why you need Him to be that for you.","q":"Which name of Jesus matters most to you right now, and why?"},{"t":"God gave","ref":"John 3:16","v":"For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life.","r":"Love gives. God didn’t just feel loving from far away; He gave His own Son. Christmas starts here. The best gift in history was given on purpose, to you, without you having to earn it.","c":"Write down this verse on a card or a note and put it where you will see it, such as on your mirror or in your Bible.","p":"Thank God for loving you enough to give Jesus. Tell Him you want to receive the gift again today.","q":"What does it mean to you that God gave His Son?"},{"t":"An unspeakable gift","ref":"2 Corinthians 9:15","v":"Now thanks be to God for his unspeakable gift!","r":"Sometimes words really aren’t enough. Paul just bursts out with thanks. Receiving a gift well means saying thank you, and meaning it. Gratitude is one of the simplest prayers you can pray.","c":"Write a thank-you note or message to someone who has given you something this year, whether a gift or time or help.","p":"Thank God for Jesus in your own words. Then thank Him for three specific gifts you’ve enjoyed this year.","q":"Who deserves a proper thank-you from you this season?"},{"t":"Better to give","ref":"Acts 20:35","v":"In all things I gave you an example, that so laboring you ought to help the weak, and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’”","r":"Jesus said this, and many people find it is true. Giving doesn’t have to cost much. Time, attention, a handmade card or a favour can mean more than anything from a shop. The best gifts say, ‘I thought of you.’","c":"Plan one thoughtful, low-cost gift for someone this week, such as a handwritten note, a baked treat or an offer to help. Do it.","p":"Ask God to make you generous with your time, kindness and things. Thank Him for people you can bless.","q":"What thoughtful gift could you give that is more about the person than the price?"},{"t":"God with us","ref":"Matthew 1:23","v":"“Behold, the virgin shall be with child, and shall give birth to a son. They shall call his name Immanuel;” which is, being interpreted, “God with us.”","r":"Immanuel means God with us. Jesus didn’t shout from a distance; He came and lived among people. At Christmas, remember that He is with you in your family’s busy kitchens, your noisy houses and your quiet rooms.","c":"Spend ten quiet minutes with God today, with no phone. Tell Him about your Christmas, the happy bits and the hard bits.","p":"Thank Jesus for coming to be with us. Ask Him to make His presence feel real to you this season.","q":"Where do you most want to feel God with you this Christmas?"},{"t":"Review: receiving and giving","ref":"Ephesians 2:8-9","v":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast.","r":"A gift can’t be earned, only received. This week you looked at how God gave first, how you can thank Him, and how you can give in return. Christmas isn’t about getting everything right. It’s about receiving Jesus.","c":"Choose one gift habit to keep, like a weekly thank-you, a regular act of giving or time set aside each day to say thanks to God.","p":"Thank God that His gift is free. Ask Him to make you someone who receives and gives with a thankful heart.","q":"What is the best gift you’ve received, and how does Jesus’ gift compare?"}]},{"w":51,"theme":"Looking back","intro":"The year is nearly over. Before you rush ahead, it is wise to pause and notice what God has done, what you have learned and how you have grown. This week you will remember and give thanks.","days":[{"t":"Don’t forget","ref":"Psalm 103:2","v":"Praise Yahweh, my soul, and don’t forget all his benefits,","r":"It’s easy to remember what went wrong and forget the many good things. Looking back with thankfulness is like turning a light on: you notice the kindness that was there all along.","c":"Write down ten good things from this year, big or small, such as people, moments or answered prayers. Keep the list.","p":"Thank God for the good things of this year. Tell Him what you noticed when you looked back.","q":"What are some of the best moments of this year for you?"},{"t":"Remember His deeds","ref":"Psalm 77:11","v":"I will remember Yah’s deeds; for I will remember your wonders of old.","r":"When life is hard, remembering what God has done before gives you courage for what comes next. His track record is long and good. Your own story is part of it too.","c":"Think of a time this year when God helped you, even in a small way. Share the story with someone today.","p":"Thank God for specific times He has helped you. Ask Him to help you remember them when you doubt.","q":"When did you most clearly see God helping you this year?"},{"t":"Stones of remembrance","ref":"1 Samuel 7:12","v":"Then Samuel took a stone, and set it between Mizpah and Shen, and called its name Ebenezer, saying, “Yahweh helped us until now.”","r":"Samuel set up a stone as a reminder that God had helped. You can create your own reminder: a note, a photo or a pebble. When doubts come, it says, ‘Look how far He’s brought you.’","c":"Choose a small object, like a stone, a card or a photo, to represent God’s help this year. Put it where you’ll see it.","p":"Say to God, ‘You have helped me until now.’ Thank Him for His help throughout this year.","q":"What object could remind you of God’s help this year?"},{"t":"Great things","ref":"Psalm 126:3","v":"Yahweh has done great things for us, and we are glad.","r":"Sometimes joy gets lost in busyness. Take a moment to be glad. God has done great things in your life, probably more than you have noticed. Gladness is a good way to worship.","c":"Play a song that makes you happy and thankful today, sing along if you want, and thank God for His goodness.","p":"Tell God you are glad about what He has done. Thank Him for specific joys from this year.","q":"What great thing has God done in your life or your family this year?"},{"t":"Growing and growing","ref":"Philippians 1:6","v":"being confident of this very thing, that he who began a good work in you will complete it until the day of Jesus Christ.","r":"You are not the same person you were a year ago. You have grown in ways you may not see: patience, maturity, faith. God is not finished, and He is faithful to complete what He started in you.","c":"List three ways you’ve grown this year, such as skills, attitudes or friendships. Ask someone else if they’ve noticed any growth too.","p":"Thank God that He is still working on you. Ask Him to keep shaping you with patience and kindness.","q":"In what ways have you grown or changed this year?"},{"t":"Thankful heart","ref":"Psalm 107:1","v":"Give thanks to Yahweh, for he is good, for his loving kindness endures forever.","r":"Thankfulness shifts your mood and your focus. Even in a hard year, there are things to be grateful for. Giving thanks doesn’t deny the hard parts; it reminds you that God’s love is still there through them.","c":"Say a specific thank-you to three people today, such as a parent, a friend or a teacher, and tell them why.","p":"Thank God for His goodness. Pray for the people you named who have been good to you this year.","q":"Who has been a gift to you this year, and have you told them?"},{"t":"Review: year in review","ref":"Psalm 138:8","v":"Yahweh will fulfill that which concerns me. Your loving kindness, Yahweh, endures forever. Don’t forsake the works of your own hands.","r":"This week you looked back with thankfulness: good things, God’s help, your growth. Remembering is not about reliving everything perfectly. It is about noticing that God has been faithful and trusting that He will continue to be.","c":"Write a short summary of your year: three highs, one lesson and one prayer. Put it somewhere safe to read next year.","p":"Thank God for walking with you all year. Give Him the parts you’re still unsure about.","q":"What are the three biggest things you’ve learned or enjoyed this year?"}]},{"w":52,"theme":"Looking forward","intro":"A new year is a fresh page. This final week is about stepping forward with courage, setting small and wise goals, and trusting the God who goes with you into everything that comes next.","days":[{"t":"Something new","ref":"Isaiah 43:18-19","v":"“Don’t remember the former things, and don’t consider the things of old. Behold, I will do a new thing. It springs out now. Don’t you know it? I will even make a way in the wilderness, and rivers in the desert.","r":"God loves to do new things, even in places that feel dry or stuck. Looking back with thanks is good, but you don’t need to be held back by old mistakes. He is making a way ahead of you.","c":"Write down one thing you hope will be new or different next year, such as a habit, an attitude or a friendship.","p":"Thank God for new beginnings. Ask Him to do something fresh in your heart and life.","q":"What new thing are you hoping God will do in your life?"},{"t":"This is the day","ref":"Psalm 118:24","v":"This is the day that Yahweh has made. We will rejoice and be glad in it!","r":"A good year is made of ordinary days. Instead of waiting for a perfect future, practise being glad in today. Every day is a gift God made, including the dull, rainy, Monday-ish ones.","c":"Find one small thing to enjoy fully today, such as a favourite snack, a funny moment or some fresh air. Notice it properly.","p":"Thank God for today specifically. Ask Him to help you notice and enjoy the good things in it.","q":"What small thing today could you really enjoy on purpose?"},{"t":"Be brave","ref":"Joshua 1:9","v":"Haven’t I commanded you? Be strong and courageous. Don’t be afraid. Don’t be dismayed, for Yahweh your God is with you wherever you go.”","r":"Courage isn’t feeling no fear. It’s going ahead because you know Someone is with you. Whatever your new year holds, new school year, new friends or new challenges, God will be right there.","c":"Choose one thing you’ve been nervous about and take one small brave step today. Then tell someone you did it.","p":"Ask God for courage for what’s ahead. Thank Him that He goes with you wherever you go.","q":"What is one thing you would do if you felt braver?"},{"t":"In everything","ref":"Colossians 3:17","v":"Whatever you do, in word or in deed, do all in the name of the Lord Jesus, giving thanks to God the Father, through him.","r":"Faith isn’t just for Sundays or devotion time. It can be woven into homework, friendships, sports and chores. Doing things with thanks, and with Jesus in mind, turns an ordinary life into something meaningful.","c":"Before one ordinary activity today, like starting homework or heading to school, pause and say, ‘Jesus, I’m doing this with you.’","p":"Ask God to be part of every area of your life, not just your quiet times. Thank Him for being near.","q":"Which area of your life do you find hardest to include God in?"},{"t":"First things first","ref":"Matthew 6:33","v":"But seek first God’s Kingdom, and his righteousness; and all these things will be given to you as well.","r":"If you only have energy for a few things next year, put God first and let the rest fall in around Him. It won’t make life problem-free, but it makes it well ordered, with the right things at the centre.","c":"Decide when and where you will spend time with God next year, even five minutes. Put it in your diary, phone or calendar.","p":"Tell God you want to put Him first this year. Ask Him to help you keep your time with Him.","q":"What would putting God first look like in your daily routine?"},{"t":"Power, love, self-control","ref":"2 Timothy 1:7","v":"For God didn’t give us a spirit of fear, but of power, love, and self-control.","r":"God has already given you what you need: strength, love and the ability to steer yourself. Fear will visit, but it does not run the show. You can face next year with the spirit God gave you.","c":"Write down one fear about next year and one thing God has given you that helps with it. Pray over both.","p":"Thank God for giving you power, love and self-control. Hand Him your fears about the future.","q":"Which of power, love or self-control do you most want to grow in?"},{"t":"Review: running the race","ref":"Hebrews 12:1-2","v":"let’s run with perseverance the race that is set before us, looking to Jesus, the author and perfecter of faith,","r":"This year you have read, prayed, thought and tried things. Not every day went perfectly, and that’s fine. Faith is a long race, run best with your eyes on Jesus and one step at a time.","c":"Pick two habits from this whole year that helped you most and commit to keeping them going. Write them down and tell someone.","p":"Thank Jesus for being with you all year. Ask Him to keep your eyes on Him in the race ahead.","q":"Which two habits from this year do you most want to keep?"},{"t":"Day 365: Onward","ref":"Numbers 6:24-26","v":"‘Yahweh bless you, and keep you. Yahweh make his face to shine on you, and be gracious to you. Yahweh lift up his face toward you, and give you peace.’","r":"You have made it a whole year of showing up for God. That’s something to be proud of. This old blessing is for you as you go on: God keeps you, smiles on you, and gives you peace.","c":"Write yourself a short letter for next year: what you’re thankful for, what you hope for, and one promise from God to hold on to.","p":"Thank God for this whole year with Him. Ask Him to bless and keep you as you start fresh tomorrow.","q":"What do you most want to remember about this year with God?"}]}];
const DAYS=[];
WEEKS.forEach(w=>w.days.forEach((d,i)=>DAYS.push(Object.assign({w:w.w,wt:w.theme,wi:w.intro,di:i+1,wn:w.days.length},d))));
const TOTAL=DAYS.length;
const KEY="dailylight.year.v1", RKEY="dailylight.reports.v1";
const HABITS=["Made my bed","Tidied my space","Bag and plans ready","Phone down at bedtime","Practised violin or piano"];
const HNORM=a=>HABITS.map((_,i)=>(a&&a[i])?1:0);
let mem=null, memR=null, fb=null, pushT=null, unsub=null, liveRpt=null, rptLive=false, cloudStatus="", inBadge=false, lastSaved=0, storageOK=true, helpTopic=null, prevView="today", lsEmpty=false, restorePending=false;

const DEF=()=>({name:"Marvy",start:null,done:{},notes:{},chal:{},hab:{},top:{},pin:"",shareNotes:false,preview:false,badges:[],wr:{},note:null,welcomed:false,lastBackup:"",nudge:"",cloud:{cfg:"",code:"",role:""}});
function load(){
  try{lsEmpty=localStorage.getItem(KEY)===null}catch(e){lsEmpty=true}
  restorePending=lsEmpty;
  let o=null;
  try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){o=mem}
  o=o||{};
  const d=Object.assign(DEF(),o);if(!d.cloud)d.cloud={cfg:"",code:"",role:""};return d;
}
function save(){
  try{checkBadges()}catch(e){}
  mem=JSON.parse(JSON.stringify(S));
  let ok=true;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}
  storageOK=ok;lastSaved=Date.now();
  try{mirrorIDB()}catch(e){}
  try{pushReport()}catch(e){}
  try{updateSaved()}catch(e){}
}
function loadReports(){try{return JSON.parse(localStorage.getItem(RKEY))||memR||[]}catch(e){return memR||[]}}
function saveReport(r){
  let list=loadReports().filter(x=>!(x.n===r.n&&x.g===r.g));
  list.unshift(r);list=list.slice(0,10);memR=list;
  try{localStorage.setItem(RKEY,JSON.stringify(list))}catch(e){}
}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>parse(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const hashPin=p=>{let h=5381;for(const c of "dl|"+p)h=((h<<5)+h+c.charCodeAt(0))>>>0;return String(h)};
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))};

let S=load();
if(!S.start){S.start=iso(new Date());save()}
function todayNum(){return Math.max(1,Math.min(TOTAL,diffDays(iso(new Date()),S.start)+1))}
function unlocked(){return S.preview?TOTAL:todayNum()}
function streakOf(dates){
  const set=new Set(dates);let d=iso(new Date());
  if(!set.has(d))d=addDays(d,-1);
  let n=0;while(set.has(d)){n++;d=addDays(d,-1)}
  return n;
}
const streak=()=>streakOf(Object.values(S.done));
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"}

let view="today", viewDay=todayNum(), saveTimer=null, settingsOpen=false, rpt=null;

function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m;t.classList.add("show");
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400);
}

function renderTabs(){
  const items=[["today","☀️","Today"],["plan","🗓️","Plan"],["habits","✅","Habits"],["journal","📓","Journal"],["settings","⚙️","Settings"]];
  document.getElementById("tabs").innerHTML=view==="report"?"":items.map(([k,i,l])=>
    `<button data-act="tab" data-v="${k}" class="${view===k?"on":""}"><b>${i}</b>${l}</button>`).join("");
}
function header(){
  const c=Object.keys(S.done).length;
  return `<div class="top"><div><div class="hello">${greeting()}</div><div class="name">${esc(S.name||"Friend")}</div><div class="saved ${storageOK?"":"bad"}" id="savedmsg">${savedText()}</div></div>
  <div class="hdr"><button class="info" data-act="help" data-t="" aria-label="Help and guides">ⓘ</button><div class="pill">🔥 ${streak()} day${streak()===1?"":"s"}</div></div></div>
  <div class="progress"><i style="width:${c/TOTAL*100}%"></i></div>`;
}

function renderToday(){
  const n=viewDay, d=DAYS[n-1], isDone=!!S.done[n], max=unlocked();
  const allDone=Object.keys(S.done).length===TOTAL;
  return header()+
  (allDone?`<div class="card finish"><h2>🎉 You finished the whole year!</h2><p class="muted">That's something to be proud of, ${esc(S.name||"")}. Read back through your journal. God's not finished with you.</p></div>`:"")+
  welcomeCard()+nudgeCard()+noteCard()+`<div class="daynav"><button data-act="prev" ${n<=1?"disabled":""} aria-label="Previous day">‹</button>
    <div class="daylabel">Day ${n} of ${TOTAL}${n===todayNum()?" · Today":""}</div>
    <button data-act="next" ${n>=max?"disabled":""} aria-label="Next day">›</button></div>
  <div class="weeklabel">Week ${d.w} · ${esc(d.wt)}</div>
  ${d.di===1?`<div class="card intro"><div class="sec">This week</div><p>${esc(d.wi)}</p></div>`:""}
  <h1 class="title">${esc(d.t)}</h1>
  <div class="card"><blockquote class="verse"><p>${esc(d.v)}</p><cite>${esc(d.ref)} · WEB</cite></blockquote></div>
  <div class="card"><div class="sec">Think about it</div><p>${esc(d.r)}</p></div>
  <div class="card"><div class="sec">Try this today</div><p>${esc(d.c)}</p>
    <div class="check ${S.chal[n]?"on":""}" data-act="chal"><div class="box">${S.chal[n]?"✓":""}</div><span class="l">I did it</span></div></div>
  <div class="card"><div class="sec">Pray</div><p>${esc(d.p)}</p></div>
  <div class="card"><div class="sec">Journal ${infoBtn("journal")}</div><p class="q">${esc(d.q)}</p>
    <textarea id="note" placeholder="Write a few lines.">${esc(S.notes[n]||"")}</textarea></div>
  <button class="btn ${isDone?"done":""}" data-act="done">${isDone?"✓ Completed (tap to undo)":"Mark today complete"}</button>`;
}

function renderPlan(){
  const cur=todayNum(), max=unlocked();
  const curW=DAYS[cur-1].w;
  let html=header();
  let idx=0;
  WEEKS.forEach(w=>{
    let dots="",c=0;
    w.days.forEach((d,i)=>{
      const n=idx+i+1;if(S.done[n])c++;
      const cls=S.done[n]?"ok":n===cur?"now":"";
      dots+=`<div class="dot ${cls} ${n>max?"lock":""}" data-act="open" data-n="${n}">${S.done[n]?"✓":i+1}</div>`;
    });
    idx+=w.days.length;

function stats(){
  const done=Object.keys(S.done).length;
  let full=0,idx=0;
  WEEKS.forEach(w=>{let all=true;for(let j=0;j<w.days.length;j++)if(!S.done[idx+j+1]){all=false;break}if(all)full++;idx+=w.days.length});
  const hd=Object.keys(S.hab).filter(d=>HNORM(S.hab[d]).slice(0,4).every(x=>x)).sort();
  let run=0,best=0,prev=null;
  hd.forEach(d=>{run=(prev&&addDays(prev,1)===d)?run+1:1;if(run>best)best=run;prev=d});
  const top=Object.keys(S.top).filter(d=>S.top[d].every(x=>x.t&&x.t.trim()&&x.d)).length;
  const notes=Object.keys(S.notes).filter(k=>S.notes[k]&&S.notes[k].trim()).length;
  const md=Object.keys(S.hab).filter(d=>HNORM(S.hab[d])[4]).sort();
  let mr=0,mb=0,mp=null;md.forEach(d=>{mr=(mp&&addDays(mp,1)===d)?mr+1:1;if(mr>mb)mb=mr;mp=d});
  return {done,streak:streak(),full,hrun:best,mrun:mb,top,notes};
}

  }finally{inBadge=false}

function randCode(){

  const r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint32Array(14)):Array.from({length:14},()=>Math.floor(Math.random()*4e9));
  for(let i=0;i<14;i++)s+=a[r[i]%a.length];

function parseCfg(t){
  t=String(t).trim();
  try{const o=JSON.parse(t);if(o&&o.apiKey&&o.projectId)return o}catch(e){}
  const o={};const re=/(\w+)\s*:\s*["']([^"']*)["']/g;let m;
  while((m=re.exec(t)))o[m[1]]=m[2];
  return o.apiKey&&o.projectId?o:null;
}

const FB_V="10.12.2";
function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("couldn't load Firebase (offline?)"));document.head.appendChild(s)});
}
function cloudStop(){
  try{if(unsub)unsub()}catch(e){}
  unsub=null;fb=null;cloudStatus="";liveRpt=null;
}
async function cloudInit(manual){
  const c=S.cloud;
  if(!c||!c.cfg||!c.code||!c.role)return;
  cloudStop();
  try{
    if(!window.firebase){
      const b="https://www.gstatic.com/firebasejs/"+FB_V+"/firebase-";
      await loadScript(b+"app-compat.js");await loadScript(b+"auth-compat.js");await loadScript(b+"firestore-compat.js");
    }
    const cfg=JSON.parse(c.cfg);
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    const ref=firebase.firestore().collection("families").doc(c.code);
    fb={ref:ref};
    cloudStatus="";
    let first=true;
    if(c.role==="child"){
      pushReport(true);
      let firstC=true;
      unsub=ref.onSnapshot(snap=>{
        const d=snap.data();
        if(firstC){firstC=false;if(d&&d.backup&&freshLocal()&&confirm("Found saved progress in the cloud. Restore it on this phone?"))restoreCloud(d.backup,true)}
        if(d&&d.note&&(!S.note||S.note.id!==d.note.id)){
          S.note={id:d.note.id,t:String(d.note.t).slice(0,300),g:d.note.g||iso(new Date()),x:0};
          save();if(view==="today")render();toast("New note from your supervisor");
        }
      },err=>{cloudStatus="Sync error: "+err.message;if(view==="settings")render()});
    }else{
      unsub=ref.onSnapshot(snap=>{
        const d=snap.data();
        if(d&&d.report){
          liveRpt=d.report;
          if(first&&(view==="today"||view==="settings")){rpt=liveRpt;rptLive=true;view="report";render()}
          else if(view==="report"&&rptLive){rpt=liveRpt;render()}
        }
        first=false;
      },err=>{cloudStatus="Sync error: "+err.message;if(view==="settings")render()});
    }
    if(manual)toast("Live sync connected");
  }catch(e){
    fb=null;cloudStatus="Couldn't connect: "+(e&&e.message?e.message:e);
  }
  if(view==="settings"||manual)render();
}
function pushReport(now){
  if(!fb||!S.cloud||S.cloud.role!=="child")return;
  clearTimeout(pushT);
  const go=()=>{try{const o={report:makeReport(),updated:Date.now()},f=["report","updated"];if(!freshLocal()){o.backup=JSON.stringify(cloudSafeState());f.push("backup")}fb.ref.set(o,{mergeFields:f}).catch(()=>{})}catch(e){}};
  if(now)go();else pushT=setTimeout(go,1500);
}

/* ===== autosave: second copy, indicator, nudge ===== */
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("dailylight",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
function mirrorIDB(){
  if(!window.indexedDB||restorePending)return;
  const txt=JSON.stringify(S);
  idbOpen().then(db=>{db.transaction("kv","readwrite").objectStore("kv").put(txt,"state")}).catch(()=>{});
}
function idbRead(){
  if(!window.indexedDB)return Promise.resolve(null);
  return idbOpen().then(db=>new Promise(res=>{
    const q=db.transaction("kv").objectStore("kv").get("state");
    q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
  })).catch(()=>null);
}
function hasProgress(o){return !!o&&(Object.keys(o.done||{}).length+Object.keys(o.hab||{}).length+Object.keys(o.notes||{}).length)>0}
function freshLocal(){return !hasProgress(S)}
async function restoreMirror(){
  try{
    if(!lsEmpty)return;
    const t=await idbRead();if(!t)return;
    const o=JSON.parse(t);
    if(hasProgress(o)&&freshLocal()){
      S=Object.assign(DEF(),o);if(!S.cloud)S.cloud={cfg:"",code:"",role:""};
      restorePending=false;save();viewDay=todayNum();render();
      toast("Restored your progress from this device's backup copy");
    }
  }catch(e){}finally{restorePending=false}
}
function savedText(){
  if(!storageOK)return "⚠ Can't save on this device";
  if(!lastSaved)return "✓ Autosaves on this device";
  const d=new Date(lastSaved);
  return "✓ Saved "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function updateSaved(){
  const el=document.getElementById("savedmsg");
  if(el){el.className="saved"+(storageOK?"":" bad");el.textContent=savedText()}
}
function cloudSafeState(){
  return Object.assign({},S,{notes:S.shareNotes?S.notes:{},wr:S.shareNotes?S.wr:{},pin:"",cloud:{cfg:"",code:"",role:""}});
}
function restoreCloud(txt,quiet){
  try{
    const b=JSON.parse(txt);if(!hasProgress(b))throw 0;
    if(!quiet&&!confirm("Replace progress on this device with the cloud copy? Your journal stays as it is."))return;
    S=Object.assign(DEF(),b,{notes:Object.assign({},b.notes,S.notes),wr:Object.assign({},b.wr,S.wr),pin:S.pin,cloud:S.cloud});
    save();viewDay=todayNum();render();toast("Progress restored from the cloud");
  }catch(e){toast("No usable cloud copy found")}
}

}

document.addEventListener("click",e=>{

    if(view==="plan"){const w=document.getElementById("wk"+DAYS[todayNum()-1].w);if(w)w.scrollIntoView({block:"center"})}}

  else if(a==="top"){const t=iso(new Date());const tp=todayTop().map(x=>({t:x.t,d:x.d}));const i=+el.dataset.i;if(tp[i].t.trim()){tp[i].d=tp[i].d?0:1;S.top[t]=tp;save();render()}else toast("Write the priority first")}
