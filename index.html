<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Light">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14102b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314102b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23ffb86b'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314102b'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23ffb86b'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<title>Daily Light</title>
<style>
:root{
  --bg:#14102b; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.11);
  --text:#f5f2ff; --muted:#b5aed6; --accent:#ffb86b; --accent2:#ff7aa2; --violet:#9a8bff; --ok:#6ee7b7; --warn:#ffd36e;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#3a2a7a55,transparent 60%),radial-gradient(900px 500px at -10% 10%,#ff7aa222,transparent 55%),var(--bg);background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 100px)}
h1,h2,h3{margin:0;line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.hello{font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.name{font-size:26px;font-weight:700;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.progress{height:8px;border-radius:99px;background:var(--card);overflow:hidden;margin:0 0 20px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:20px;margin-bottom:14px;backdrop-filter:blur(8px)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.daynav button{background:var(--card2);color:var(--text);border:0;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.daynav button:disabled{opacity:.25;cursor:default}
.daylabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.weeklabel{text-align:center;font-size:13px;color:var(--violet);font-weight:700;margin-bottom:6px}
.title{font-size:28px;font-weight:800;text-align:center;margin:2px 0 18px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.verse{border-left:4px solid var(--accent);padding:4px 0 4px 16px;margin:0}
.verse p{font-size:19px;line-height:1.55;margin:0 0 8px;font-family:Georgia,"Times New Roman",serif}
.verse cite{font-style:normal;font-weight:700;color:var(--accent);font-size:14px}
.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:6px}
.card p{margin:0}
.intro{background:linear-gradient(135deg,#9a8bff22,#ffb86b18)}
.check{display:flex;gap:12px;align-items:center;cursor:pointer;margin-top:10px;padding:12px;background:var(--card);border-radius:14px}
.box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;color:#14102b}
.check.on .box{background:var(--ok);border-color:var(--ok)}
.check span.l{font-size:15px;color:var(--text)}
.check.on span.l{color:var(--muted)}
textarea,input[type=text],input[type=password],input[type=date],input[type=time]{width:100%;background:rgba(0,0,0,.25);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;font:inherit;font-size:16px;resize:vertical}
textarea{min-height:120px;margin-top:10px}
textarea:focus,input:focus{outline:2px solid var(--violet);outline-offset:1px}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;color:#14102b;background:linear-gradient(90deg,var(--accent),var(--accent2));margin-top:4px}
.btn.done{background:var(--card2);color:var(--ok)}
.btn.ghost{background:var(--card2);color:var(--text);font-weight:600;font-size:15px;padding:13px;margin-top:8px}
.btn.danger{background:#ff5d6c33;color:#ffb3ba}
.q{font-size:15px;color:var(--text);font-style:italic;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid transparent;background:var(--card);color:var(--muted);cursor:pointer;font-size:13px}
.dot.ok{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#14102b}
.dot.now{border-color:var(--accent);color:var(--text)}
.dot.lock{opacity:.3;cursor:default}
.wk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.wk b{font-size:16px}
.wk small{color:var(--muted);white-space:nowrap}
.wkcur{border-color:var(--accent)}
.entry{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.entry:last-child{border:0}
.entry h3{font-size:16px}
.entry small{color:var(--accent);font-weight:600}
.entry p{white-space:pre-wrap;margin-top:6px;color:var(--text);font-size:15px}
.muted{color:var(--muted);font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(20,16,43,.94);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08);padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
.tabs div{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0;font-size:10.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:20px;line-height:1}
.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);background:#fff;color:#14102b;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:52px;height:30px;border-radius:99px;background:var(--card2);position:relative;border:0;cursor:pointer;flex:0 0 52px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{left:25px}
.finish{text-align:center;background:linear-gradient(135deg,#ffb86b33,#ff7aa233)}
.finish h2{font-size:22px;margin-bottom:6px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.top3{display:flex;gap:10px;align-items:center;margin-top:10px}
.top3 .box{cursor:pointer}
.top3 .box.on{background:var(--ok);border-color:var(--ok)}
.top3 input{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td:first-child,th:first-child{text-align:left}
.y{color:var(--ok);font-weight:700}.n{color:var(--muted);opacity:.5}
.banner{background:#ffd36e22;border:1px solid #ffd36e66;color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.badge{display:inline-block;background:var(--violet);color:#14102b;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 10px;margin-bottom:8px}
.info{background:none;border:0;color:var(--violet);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.info.sm{font-size:15px;vertical-align:middle}
.saved{font-size:12px;color:var(--ok);margin-top:2px}
.saved.bad{color:#ff9aa5}
.hdr{display:flex;align-items:center;gap:8px}
details{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
details p,details li{font-size:14.5px;color:var(--muted);margin:8px 0 0}
details ol,details ul{padding-left:20px;margin:8px 0 0}
details pre{background:rgba(0,0,0,.3);border-radius:10px;padding:10px;font-size:12px;overflow-x:auto;color:var(--text)}
details code{color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bd{text-align:center;font-size:11px;color:var(--muted);line-height:1.2}
.bd i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:var(--card);font-style:normal;font-size:26px;margin-bottom:5px;filter:grayscale(1);opacity:.35}
.bd.on{color:var(--text)}
.bd.on i{filter:none;opacity:1;background:linear-gradient(135deg,#ffb86b44,#ff7aa244)}
.rv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.rv:last-of-type{border:0}
.rv b{color:var(--accent)}
.revday{border-color:var(--accent)}
.status{font-size:13px;margin:8px 0;color:var(--muted)}
.status.ok{color:var(--ok)}
.btn.sel{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#14102b}
input[type=file]{width:100%;color:var(--muted);margin-bottom:8px}
#printarea{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  #app,.tabs,.toast{display:none!important}
  #printarea{display:block!important;color:#000;font-family:Arial,Helvetica,sans-serif}
  #printarea h1{font-size:22px;margin:0 0 4px;color:#000;-webkit-text-fill-color:#000}
  #printarea p{margin:0 0 10px;font-size:13px}
  #printarea table{border-collapse:collapse;width:100%}
  #printarea th,#printarea td{border:1px solid #888;padding:10px 6px;text-align:center;font-size:13px;color:#000}
  #printarea td:first-child,#printarea th:first-child{text-align:left}
  #printarea .ln{border-bottom:1px solid #444;height:26px;margin-top:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<div id="printarea"></div>

<script>
/* Scripture quotations are from the World English Bible (public domain). */
const WEEKS=[{"w":1,"theme":"Made on purpose","intro":"This week is about who you really are. Before grades, followers or friend groups, God made you with care and on purpose. Let that truth settle in deeper each day.","days":[{"t":"Wonderfully made","ref":"Psalm 139:14","v":"I will give thanks to you, for I am fearfully and wonderfully made. Your works are wonderful. My soul knows that very well.","r":"You are not a copy or an accident. The one who made the stars paid close attention when he made you. On the days you feel ordinary, this verse says something different: you are wonderful, and your soul can know it.","c":"Write three things about yourself you are genuinely glad about, such as a skill, a quirk or a way you treat people. Stick the note inside a wardrobe door.","p":"Thank God for making you the way he did. Ask him to help you see yourself as he sees you today.","q":"What is one thing about me that I am thankful God made?"},{"t":"Made in his image","ref":"Genesis 1:27","v":"God created man in his own image. In God’s image he created him; male and female he created them.","r":"Being made in God's image means your worth was settled before you did anything. You do not earn it with good marks or a good day, and nobody can take it away with a bad comment or a rude message.","c":"The next time you catch yourself thinking something harsh about yourself, pause and say out loud: I am made in God's image. Then carry on with your day.","p":"Tell God you are grateful that your worth does not depend on performance. Ask him to remind you when your inner voice gets mean.","q":"What unkind thing do I tell myself that God would never say?"},{"t":"Made for good things","ref":"Ephesians 2:10","v":"For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them.","r":"The word workmanship means something like a handmade masterpiece. God made you with things to do in mind: kind things, creative things, brave things. They are not a burden. They are part of how your life gets its meaning.","c":"Do one small good thing nobody asked you to do today, like making a drink for someone at home or leaving an encouraging note for a classmate.","p":"Ask God to show you one good thing he has prepared for you this week. Tell him you are ready to notice it.","q":"What good thing might God have prepared for me to do this week?"},{"t":"God sees your heart","ref":"1 Samuel 16:7","v":"But Yahweh said to Samuel, “Don’t look on his face, or on the height of his stature, because I have rejected him; for I don’t see as man sees. For man looks at the outward appearance, but Yahweh looks at the heart.”","r":"Social media, school corridors and group chats all judge by how things look. God does not. He cares about who you are inside: your honesty, your kindness, your courage. You can relax a little, because that is where real value sits.","c":"Spend ten minutes today off your phone and away from mirrors and filters. Notice how it feels to just be, rather than be looked at.","p":"Thank God that he sees past the surface. Tell him anything you have been hiding or pretending about, and ask him for honesty.","q":"Where do I feel pressure to look a certain way, and why?"},{"t":"Sung over","ref":"Zephaniah 3:17","v":"Yahweh, your God, is among you, a mighty one who will save. He will rejoice over you with joy. He will calm you in his love. He will rejoice over you with singing.","r":"Imagine God singing over you, not sighing at you. This verse says he delights in you and his love can quieten your heart. Even on a day you feel you got everything wrong, that does not change.","c":"Put on a worship song or any calm music you love and listen to it all the way through, letting the idea of being sung over sink in.","p":"Sit quietly and tell God you want to feel his love, not just know about it. Thank him for delighting in you.","q":"How would my day feel different if I believed God delights in me?"},{"t":"Called his child","ref":"1 John 3:1","v":"See how great a love the Father has given to us, that we should be called children of God! For this cause the world doesn’t know us, because it didn’t know him.","r":"You belong to someone. Whether you have had a great week or a rubbish one, God calls you his child. That is a family you cannot be voted out of, and it is the strongest identity you will ever have.","c":"Introduce yourself in your head today as a child of God before anything else, like your name, your school or your talents. Notice what changes.","p":"Thank God for being a Father who loves you. Ask him to help you live today like someone who truly belongs.","q":"What changes in my day if I remember I am a child of God?"},{"t":"Review: you matter","ref":"Luke 12:7","v":"But the very hairs of your head are all counted. Therefore don’t be afraid. You are of more value than many sparrows.","r":"This week you looked at being made on purpose, in his image, for good things, seen by him, delighted in and called his child. Every one of those says the same thing: you matter. Hold onto the one that spoke to you most.","c":"Choose one verse from this week and write it on a sticky note for your mirror, bag or phone case. That is your reset.","p":"Thank God for what he has shown you this week. Ask him to help the truth sink from your head into your heart.","q":"Which truth from this week do I most need to keep believing?"}]},{"w":2,"theme":"Hand it over","intro":"Everyone worries sometimes, about tests, friends, family or the future. This week you will practise a simple habit: handing your worries to God and letting his peace stand guard over your mind.","days":[{"t":"Pray instead of panic","ref":"Philippians 4:6-7","v":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.","r":"This is not a command to feel nothing. It is an invitation to tell God everything. When you pray the worry out loud instead of spinning it round in your head, peace has room to arrive and stand guard.","c":"Write down what is worrying you right now, then pray over the list, one item at a time, and tell God each one in your own words.","p":"Name your biggest worry to God, then thank him for one thing that is going right. Ask for his peace to guard your thoughts.","q":"What is the one worry I keep replaying, and can I tell God about it now?"},{"t":"He cares","ref":"1 Peter 5:7","v":"casting all your worries on him, because he cares for you.","r":"Notice the reason: because he cares for you. God is not irritated by your worries or too busy for them. Casting is a throwing motion, so you are allowed to fling the whole heavy lot at him, not just the tidy ones.","c":"Take a piece of scrap paper, write a worry on it, scrunch it up and put it in the bin as a way of handing it over to God.","p":"Tell God you are handing over your worries and you do not want to pick them back up. Thank him that he cares.","q":"What worry do I keep picking back up after handing it over?"},{"t":"Just today","ref":"Matthew 6:34","v":"Therefore don’t be anxious for tomorrow, for tomorrow will be anxious for itself. Each day’s own evil is sufficient.","r":"Much of what makes your stomach flip is not happening today. It is a what-if about next week. Jesus gently pulls you back to now: deal with today and trust that tomorrow will have its own help.","c":"When a what-if thought pops up, ask yourself: what is one thing I can actually do about this today? Do only that thing, then let the rest go.","p":"Ask God for the strength you need for today only. Tell him which what-ifs you are choosing to leave with him.","q":"What is one thing I can do today, and what can I leave until tomorrow?"},{"t":"Not alone in it","ref":"Isaiah 41:10","v":"Don’t you be afraid, for I am with you. Don’t be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness.","r":"Fear shrinks when you are not facing it alone. God does not promise nothing scary will happen, but he promises to be with you, strengthen you and hold you up. That is a very different kind of safe.","c":"Think of something coming up that scares you, such as a presentation, a match or a conversation. Say this verse out loud before it, and tell one trusted person about it.","p":"Tell God what scares you about what is coming. Ask him to remind you that he is right there with you.","q":"What am I afraid of, and how would it feel to face it with God beside me?"},{"t":"A different kind of peace","ref":"John 14:27","v":"Peace I leave with you. My peace I give to you; not as the world gives, I give to you. Don’t let your heart be troubled, neither let it be fearful.","r":"The world offers distractions: scrolling, snacks, noise. They numb worry for a while but do not remove it. Jesus offers his own peace, which sits inside you even when things around you are messy and uncertain.","c":"Instead of reaching for your phone the next time you feel stressed, take five slow breaths and say to Jesus: I receive your peace.","p":"Ask Jesus to give you his peace right now, the kind that does not depend on how your day is going.","q":"What do I usually reach for when I feel stressed, and does it really help?"},{"t":"Comfort in a busy mind","ref":"Psalm 94:19","v":"In the multitude of my thoughts within me, your comforts delight my soul.","r":"The writer admits his head was full of thoughts, and that is normal. What helped was not stopping the thoughts but noticing God's comfort in the middle of them. If anxiety feels too big, talking to a parent, teacher or counsellor is a strong, wise step.","c":"Before bed, jot down every thought buzzing round your head, then close the notebook. If any feel too heavy, decide who you will talk to tomorrow.","p":"Thank God that he comforts you even when your mind is noisy. Ask him to quieten your thoughts tonight.","q":"Who is a trusted adult I could talk to if worry feels too big?"},{"t":"Review: worry handed over","ref":"Psalm 55:22","v":"Cast your burden on Yahweh and he will sustain you. He will never allow the righteous to be moved.","r":"This week you practised praying instead of panicking, living one day at a time, and not facing things alone. You will not stop worrying forever, but you now have a place to take it: to God, and to people who care.","c":"Pick one habit from this week to keep, such as a worry-note, five slow breaths or praying before bed, and put a reminder on your phone.","p":"Thank God for what you learned about peace this week. Ask him to help you keep handing things over.","q":"Which worry-handling habit helped me most this week, and why?"}]},{"w":3,"theme":"Real friends","intro":"Friendships can be the best and the hardest part of school life. This week looks at what real friendship looks like and how to be the kind of friend you would want to have.","days":[{"t":"Loyal when it counts","ref":"Proverbs 17:17","v":"A friend loves at all times; and a brother is born for adversity.","r":"Real friends do not only show up for the fun parts. They are still there when you are embarrassed, sad or having a bad week. That is the kind of friend to find, and the kind of friend to become.","c":"Check in on a friend who has seemed quiet lately. Send a simple message: thinking of you, want to chat or hang out?","p":"Thank God for the friends you have. Ask him to make you someone who stays loyal when things get hard.","q":"Who has stuck by me when things were hard, and have I thanked them?"},{"t":"Sharpening each other","ref":"Proverbs 27:17","v":"Iron sharpens iron; so a man sharpens his friend’s countenance.","r":"Good friends make each other better: braver, kinder, more themselves. Ask whether your closest friendships do that. After spending time with them, do you feel more like the person you want to be, or less?","c":"Encourage a friend today by telling them specifically something they are good at or something you have noticed them do well.","p":"Ask God to help you choose friends who sharpen you and to be that kind of friend yourself.","q":"Do my friendships make me feel more like myself or less?"},{"t":"Better together","ref":"Ecclesiastes 4:9-10","v":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn’t have another to lift him up.","r":"We were not made to go through life alone. Having someone to pick you up when you fall, and to pick up in return, is one of God's good gifts. If you feel lonely, that does not mean something is wrong with you.","c":"Invite someone to sit with you, work with you or walk with you today, especially someone who seems to be on their own.","p":"Pray for anyone you know who feels lonely. If that is you, tell God honestly and ask him to bring good friends.","q":"Who might feel left out right now, and what could I do about it?"},{"t":"Choose carefully","ref":"Proverbs 13:20","v":"One who walks with wise men grows wise, but a companion of fools suffers harm.","r":"You tend to become like the people you spend most time with. This is not about looking down on anyone. It is about noticing who pulls you towards good choices and who pulls you away, and being wise about it.","c":"Think about your closest friends and spend a quiet minute asking: who encourages me to be my best? Plan to spend a bit more time with them.","p":"Ask God for wisdom about who to spend time with, and for courage to step back from anything that is not good for you.","q":"Which friend brings out the best in me, and why?"},{"t":"Feeling with them","ref":"Romans 12:15","v":"Rejoice with those who rejoice. Weep with those who weep.","r":"Good friends celebrate your wins without jealousy and sit with you in the sad stuff without needing to fix it. That takes effort, especially when you feel a bit envious. Try being fully glad for someone today.","c":"Congratulate someone on something good that happened to them, and mean it. Or listen properly to a friend who is down, without looking at your phone.","p":"Ask God to take jealousy out of your heart and help you truly celebrate others. Pray for one friend by name.","q":"Is there someone whose success I find hard to celebrate, and why?"},{"t":"A friend who sticks closer","ref":"Proverbs 18:24","v":"A man of many companions may be ruined, but there is a friend who sticks closer than a brother.","r":"Having lots of friends is not the same as having real ones. Quality beats quantity every time. And above everyone, Jesus is the friend who never leaves, which means you never have to beg for belonging.","c":"Take a few minutes to talk to Jesus the way you would to a close friend: what is happening, what you feel, what you are hoping for.","p":"Thank Jesus for being a friend who sticks closer. Tell him about your day as if he were sitting beside you.","q":"What would I tell Jesus about my day if he were sitting here?"},{"t":"Review: treat them how you hope to be treated","ref":"Luke 6:31","v":"“As you would like people to do to you, do exactly so to them.","r":"This week you looked at loyalty, encouragement, wisdom in choosing friends and celebrating others. All of it comes back to one simple test: would I like to be treated this way? If yes, do it.","c":"Pick one friend and one specific thing you will do this week to be a better friend to them, then add it to your phone reminders.","p":"Thank God for friendship. Ask him to help you treat people as you would like to be treated, even when it is hard.","q":"What kind of friend do I want to be this coming week?"}]},{"w":4,"theme":"Clean room, clear mind","intro":"A tidy space will not fix everything, but it often helps your head feel lighter. This week is about small, doable habits for your room and home, done as a way of looking after yourself and others.","days":[{"t":"Start with the bed","ref":"1 Corinthians 14:40","v":"Let all things be done decently and in order.","r":"Making your bed takes about a minute and is your first small win of the day. It will not change the world, but it sets a tone: I can look after my space, and today I am starting well.","c":"Make your bed before you leave your room tomorrow morning, pulling up the covers and straightening the pillow, and notice how the room feels when you come back.","p":"Thank God for a new day and a place to sleep. Ask him to help you start the day with order and calm.","q":"How does my room feel when my bed is made compared with when it is not?"},{"t":"Wisdom fills the room","ref":"Proverbs 24:3-4","v":"Through wisdom a house is built; by understanding it is established; by knowledge the rooms are filled with all rare and beautiful treasure.","r":"A home is not just walls. It is shaped by the choices people make in it. Your own room can be a calm, pleasant place when you choose to care for it, even in small ways.","c":"Set a ten-minute timer, put on some music and tidy one area: your desk, your floor or the top of a chest of drawers.","p":"Ask God to make your room a peaceful place where you can rest and think. Thank him for what you have.","q":"Which part of my room bothers me most, and what is one step to fix it?"},{"t":"Chores as a gift","ref":"Colossians 3:23","v":"And whatever you do, work heartily, as for the Lord, and not for men,","r":"Dishes, bins and hoovering are rarely exciting, but this verse says even ordinary jobs can be done for God, not just to avoid a telling-off. That turns a boring job into something that matters a little more.","c":"Do one chore today without being asked, such as emptying the dishwasher or putting your shoes away, and do it properly rather than rushing.","p":"Offer God your chores today. Ask him to help you do them with a good attitude, even the boring ones.","q":"What chore do I resist most, and how could I do it differently?"},{"t":"Faithful in small things","ref":"Luke 16:10","v":"He who is faithful in a very little is faithful also in much. He who is dishonest in a very little is also dishonest in much.","r":"Putting dirty clothes in the wash and folding the clean ones feels tiny. But small habits shape who you are. Being reliable with little things trains you to be trusted with bigger ones.","c":"Sort your laundry today: dirty clothes into the basket, clean ones folded or hung up. If you are unsure how the washing machine works, ask someone to show you.","p":"Ask God to help you be faithful with small things. Thank him for the clothes you have and those who help care for them.","q":"What small job do I put off that I could just do now?"},{"t":"God of peace, not chaos","ref":"1 Corinthians 14:33","v":"for God is not a God of confusion, but of peace, as in all the assemblies of the saints.","r":"God loves order and peace. When your desk is buried under paper and your floor is covered, your brain has to work around the mess. Clearing a space can help you think more clearly and feel calmer.","c":"Clear your desk or the place you do homework so there is only what you need on it. Put everything else away or in a tray.","p":"Ask God to bring peace and clear thinking to you as you sort out your space. Thank him for being a God of peace.","q":"What would change about my homework time if my desk were clear?"},{"t":"Do not give up","ref":"Galatians 6:9","v":"Let’s not be weary in doing good, for we will reap in due season, if we don’t give up.","r":"Tidy rooms do not stay tidy. That is normal and not a failure. The goal is not perfection but returning to good habits again and again, and the calm does build up over time.","c":"Set a two-minute reset for tonight: put things back where they belong, clothes in the basket and bag by the door. Tiny, but it counts.","p":"Tell God you are going to keep trying, even when it slips. Ask for his help to build habits that last.","q":"What small daily habit would make the biggest difference to my room?"},{"t":"Review: order brings peace","ref":"Proverbs 16:3","v":"Commit your deeds to Yahweh, and your plans shall succeed.","r":"This week you looked at making your bed, tidying your space, doing chores, sorting laundry and keeping a clear desk. None of it is about being perfect. It is about making your space a place where you can rest and think.","c":"Choose one tidy habit to keep every day, such as making your bed, and tell someone at home so they can cheer you on.","p":"Dedicate your home and habits to God. Ask him to help you keep going with the habit you have chosen.","q":"Which tidy habit will I keep going, and when will I do it?"}]},{"w":5,"theme":"A place for everything","intro":"Organisation is really just making life easier for future you. This week covers your bag, planner, deadlines and paper piles, with small habits that save stress and hunting for lost things.","days":[{"t":"Plan before you plunge","ref":"Proverbs 21:5","v":"The plans of the diligent surely lead to profit; and everyone who is hasty surely rushes to poverty.","r":"Rushing feels quick but usually costs you time later: the lost worksheet, the forgotten book, the panic. A few minutes of planning, like looking at what is due this week, saves a lot of scrambling.","c":"Open your planner or phone calendar and write in everything due this week, tests, homework and activities, so nothing sneaks up on you.","p":"Ask God for wisdom to plan ahead and not rush. Thank him for the people who help you stay on track.","q":"What is due this week that I have not written down yet?"},{"t":"Learn from the ant","ref":"Proverbs 6:6","v":"Go to the ant, you sluggard. Consider her ways, and be wise;","r":"The ant gets ready ahead of time without anyone telling it to. For you, that might be packing your school bag the night before: books, PE kit, charger, lunch. It is a small habit that makes mornings calmer.","c":"Pack your school bag tonight: check your timetable, put in what you need and leave it by the door.","p":"Ask God to help you prepare ahead so mornings are calmer. Thank him for a day full of possibilities.","q":"What always goes wrong in my mornings, and how could I prepare for it?"},{"t":"Count the cost","ref":"Luke 14:28","v":"For which of you, desiring to build a tower, doesn’t first sit down and count the cost, to see if he has enough to complete it?","r":"Big projects feel overwhelming when you only see the whole mountain. Counting the cost means working out how long things will really take and when to start. Then a deadline becomes steps, not a looming wall.","c":"Pick your biggest upcoming assignment. Break it into three smaller steps and write a date next to each one in your planner.","p":"Ask God to give you clear thinking about your homework. Tell him if any deadline is stressing you out.","q":"What is my next big deadline, and what are its first three steps?"},{"t":"Finding the lost","ref":"Luke 15:8","v":"Or what woman, if she had ten drachma coins, if she lost one drachma coin, wouldn’t light a lamp, sweep the house, and seek diligently until she found it?","r":"Everyone loses things: keys, earphones, that one important sheet. Jesus tells a story about a woman who searches carefully till she finds her coin. Keeping a home for things means less searching and more peace.","c":"Choose a home for the things you lose most, like a bowl for keys and earphones or a folder for loose sheets, and always put them back there.","p":"Thank God that he never loses track of you. Ask him to help you look after the things you have been given.","q":"What do I lose most often, and where could its home be?"},{"t":"Spot trouble early","ref":"Proverbs 22:3","v":"A prudent man sees danger and hides himself; but the simple pass on, and suffer for it.","r":"Paper piles grow quietly. A prudent person spots a small problem before it becomes a big one. Sorting the paper every few days is far easier than facing a whole mountain the night before a test.","c":"Gather the loose papers from your bag and desk. Bin what is finished, file what you need and put anything unclear in one tray to check later.","p":"Ask God to help you notice small problems before they grow. Thank him for helping you with the things you find tricky.","q":"What pile or problem have I been avoiding that I could sort now?"},{"t":"Ask for help","ref":"Proverbs 15:22","v":"Where there is no counsel, plans fail; but in a multitude of counselors they are established.","r":"If organising does not come naturally, that is fine. Some brilliant people struggle with it. Asking a parent, teacher or friend how they keep track of things is a smart move, not a weak one.","c":"Ask someone you trust how they organise homework, notes or their calendar. Try one idea they share this week.","p":"Thank God for people who can teach you. Ask him for humility to ask for help when you need it.","q":"Who could I ask for organising tips, and what would I ask?"},{"t":"Review: a steady path","ref":"Proverbs 4:26","v":"Make the path of your feet level. Let all of your ways be established.","r":"This week you looked at planning, packing ahead, deadlines, finding things, paper piles and asking for help. You do not need all of them at once. One steady habit at a time makes the path smoother.","c":"Choose one organising habit to keep, such as packing your bag at night or checking the planner daily, and set a reminder for it.","p":"Thank God for helping you grow in practical things. Ask him to help you stick with your chosen habit.","q":"Which organising habit made the biggest difference to my week?"}]},{"w":6,"theme":"Your time is a gift","intro":"You have the same 24 hours as everyone else, and how you spend them shapes your life. This week is about choosing priorities, planning your day and using time wisely, without guilt or pressure.","days":[{"t":"Counting your days","ref":"Psalm 90:12","v":"So teach us to count our days, that we may gain a heart of wisdom.","r":"Your days are not endless, and that is not meant to scare you. It is meant to make you thoughtful. Wisdom starts when you ask: what do I actually want to do with this day?","c":"Look at your screen time report for yesterday. Without feeling bad, just notice where the hours went and whether you are happy with it.","p":"Ask God to teach you how to use your days well. Thank him for the time you have been given.","q":"Where did most of my free time go this week, and am I happy with that?"},{"t":"Make the most of it","ref":"Ephesians 5:15-16","v":"Therefore watch carefully how you walk, not as unwise, but as wise, redeeming the time, because the days are evil.","r":"Redeeming the time means getting good value out of it, like rescuing it from being wasted. This is not about being busy every second. Rest is good use of time too. It is about choosing on purpose.","c":"Write a rough plan for tomorrow, including school, homework, something fun and some rest, and put it where you will see it.","p":"Ask God to help you spend time on what really matters. Offer him your plans for tomorrow.","q":"What would make tomorrow a good day, and what needs to happen for that?"},{"t":"Put first things first","ref":"Matthew 6:33","v":"But seek first God’s Kingdom, and his righteousness; and all these things will be given to you as well.","r":"When everything feels urgent, it helps to decide what comes first. Jesus says to start with God and trust the rest to fall into place. A day that begins with that tends to feel less scattered.","c":"Pick your top three for today: the three things that matter most. Write them down and do the first one before anything else.","p":"Give God your top three for today. Ask him to show you what matters most and to help you focus on it.","q":"What are my top three priorities for today?"},{"t":"Everything in its season","ref":"Ecclesiastes 3:1","v":"For everything there is a season, and a time for every purpose under heaven:","r":"There is a time for homework, a time for friends, a time for rest and a time for fun. Problems come when everything gets mashed together, like doing homework while scrolling and enjoying neither.","c":"Try one focused block today: 25 minutes of work with your phone in another room, followed by a proper five-minute break.","p":"Ask God to help you do each thing in its time and enjoy it fully. Thank him for seasons of work and rest.","q":"What gets mixed up in my day, and how could I separate it?"},{"t":"Start the day on purpose","ref":"Mark 1:35","v":"Early in the morning, while it was still dark, he rose up and went out, and departed into a deserted place, and prayed there.","r":"Jesus was the busiest person around, yet he made space to pray before the day began. You do not need to get up in the dark. Even five quiet minutes before you pick up your phone can set the direction of your day.","c":"Tomorrow, spend the first five minutes after waking without your phone. Sit up, breathe, and say a short prayer about the day ahead.","p":"Talk to God as your day begins. Tell him what is ahead and ask him to guide your steps.","q":"What would I want to say to God before my day starts?"},{"t":"Distracted by many things","ref":"Luke 10:41-42","v":"Jesus answered her, “Martha, Martha, you are anxious and troubled about many things, but one thing is needed. Mary has chosen the good part, which will not be taken away from her.”","r":"Martha was busy and stressed while Mary simply sat with Jesus. He was not telling Martha off. He was gently saying she was distracted. Notifications and pinging chats pull you away from what matters just the same.","c":"Turn off notifications for one app that distracts you most, or move it off your home screen for the day.","p":"Ask Jesus to help you notice what matters most today and not get pulled away by every little thing.","q":"What distracts me most, and what could I do about it?"},{"t":"Review: my times are in his hands","ref":"Psalm 31:15","v":"My times are in your hand. Deliver me from the hand of my enemies, and from those who persecute me.","r":"This week you looked at counting your days, planning, top priorities, focus and starting the day well. You will not use every minute perfectly, and that is okay. Your times are in God's hands.","c":"Pick one time habit to keep, such as choosing a top three each morning or a phone-free first five minutes, and stick it somewhere visible.","p":"Thank God that your time is in his hands. Ask him to help you use it well without worry or guilt.","q":"What one time habit will I keep going after this week?"}]},{"w":7,"theme":"Who are you performing for","intro":"Wanting people to like you is human, but chasing everyone's approval is exhausting. This week looks at living for an audience of one and being yourself, with the freedom that brings.","days":[{"t":"Pleasing God or people","ref":"Galatians 1:10","v":"For am I now seeking the favor of men, or of God? Or am I striving to please men? For if I were still pleasing men, I wouldn’t be a servant of Christ.","r":"Paul asked himself a tough question and it is worth asking yourself too. Who are you trying to impress? Wanting friends is normal, but when approval becomes your boss, you end up tired and unsure who you are.","c":"Notice one moment today when you change what you say or do to be liked. Just notice it, without judging yourself.","p":"Ask God to show you where you try too hard to be liked. Tell him you want to care most about what he thinks.","q":"When do I most feel the urge to please people?"},{"t":"Free from the snare","ref":"Proverbs 29:25","v":"The fear of man proves to be a snare, but whoever puts his trust in Yahweh is kept safe.","r":"A snare is a trap. Fear of what people think can trap you into doing things you do not really want to do. Trusting God gives you somewhere solid to stand, even when the group around you is wobbling.","c":"Practise a kind, polite no today to something small, such as a favour or a suggestion that you are not keen on.","p":"Ask God for courage to be yourself in front of others. Thank him that you are safe with him.","q":"What would I do differently if I did not fear what people think?"},{"t":"Approved by God","ref":"1 Thessalonians 2:4","v":"But even as we have been approved by God to be entrusted with the Good News, so we speak: not as pleasing men, but God, who tests our hearts.","r":"Being approved by God means you do not have to audition for him. He already accepts you. That frees you to speak and act honestly, instead of saying whatever will get a nod or a laugh.","c":"Say what you genuinely think in a conversation today, kindly and calmly, even if it is slightly different from everyone else.","p":"Thank God that you do not have to earn his approval. Ask him to help you speak honestly and kindly.","q":"Where have I gone along with something just to fit in?"},{"t":"Nothing to fear","ref":"Psalm 118:6","v":"Yahweh is on my side. I will not be afraid. What can man do to me?","r":"When someone laughs at you, ignores a message or leaves you out, it can feel enormous. This verse does not say it will not hurt. It says God is on your side, and that changes how big it feels.","c":"If you are hurt by something someone said or did, write it down and give it to God. Talk to a trusted adult if it keeps hurting.","p":"Tell God honestly about a time you felt rejected or embarrassed. Ask him to remind you he is on your side.","q":"Whose opinion do I give too much power to?"},{"t":"Not copying the crowd","ref":"Romans 12:2","v":"Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God.","r":"Trends, group chats and influencers constantly tell you who to be. God invites you to a different way: letting him reshape how you think, so your choices come from the inside rather than from pressure.","c":"Look at the accounts you follow. Unfollow or mute one that makes you feel you are not enough, and follow something that lifts you up.","p":"Ask God to renew your mind and help you think his way. Thank him for making you different and unique.","q":"What messages from social media am I believing about myself?"},{"t":"Quiet goodness","ref":"Matthew 6:1","v":"“Be careful that you don’t do your charitable giving before men, to be seen by them, or else you have no reward from your Father who is in heaven.","r":"It is easy to do good things just to be noticed, like posting about a kind act. Jesus encourages doing good quietly, because God sees. There is a special freedom in kindness no one knows about.","c":"Do something kind in secret today, like leaving a treat or tidying up for someone, and do not tell anyone.","p":"Ask God to help you do good for the right reasons. Thank him that he sees even the things nobody else notices.","q":"What good thing could I do today that nobody needs to see?"},{"t":"Review: you belong to him","ref":"Isaiah 43:1","v":"But now Yahweh who created you, Jacob, and he who formed you, Israel, says: “Don’t be afraid, for I have redeemed you. I have called you by your name. You are mine.","r":"This week you looked at whose approval you chase and how to live more freely. Before any crowd, God calls you by name and says you are his. That is the one opinion that never changes.","c":"Choose one way to be more yourself this week, such as sharing an honest opinion or dropping a pretence, and plan when you will try it.","p":"Thank God for calling you by name. Ask him to help you live as someone who belongs to him.","q":"Where do I want to be more honest and less performing?"}]},{"w":8,"theme":"Words that build up","intro":"Words can lift a person up or knock them flat, and you use hundreds of them every day. This week is about speaking, texting and listening in ways that make people feel safe and valued.","days":[{"t":"Words that build","ref":"Ephesians 4:29","v":"Let no corrupt speech proceed out of your mouth, but only what is good for building others up as the need may be, that it may give grace to those who hear.","r":"Before you say or send something, ask: will this build someone up? It does not mean being fake or never being honest. It means choosing words that help rather than hurt, even when you are annoyed.","c":"Say or text one genuinely encouraging thing to someone today, such as a compliment, a thank-you or a quick well done.","p":"Ask God to put good words in your mouth today. Thank him for people whose words have encouraged you.","q":"Whose words have built me up, and have I thanked them?"},{"t":"Soft answers","ref":"Proverbs 15:1","v":"A gentle answer turns away wrath, but a harsh word stirs up anger.","r":"When someone is angry with you, snapping back feels natural but usually makes things worse. A calm voice can take the heat out of an argument. It is not weakness. It takes real strength.","c":"Next time you feel like snapping, whether at a sibling, parent or friend, take a breath and answer more quietly instead.","p":"Ask God for gentleness when you are annoyed. Tell him about someone who tests your patience.","q":"What situation makes me snap, and what could I try instead?"},{"t":"Life and death in a sentence","ref":"Proverbs 18:21","v":"Death and life are in the power of the tongue; those who love it will eat its fruit.","r":"A single sentence can stay with someone for years, for better or worse. That is a lot of power, and you have it. Use it well, and remember it works on how you talk about yourself too.","c":"Notice how you talk about yourself today. Swap one harsh self-comment for something kind and true.","p":"Ask God to help you use your words for life. Pray for someone who has been hurt by what others said.","q":"What words have stayed with me, good or bad?"},{"t":"Slow to speak","ref":"James 1:19","v":"So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger;","r":"Listening is a skill, and a rare one. In a conversation, most of us are just waiting for our turn. Listening well makes people feel valued, and it stops you saying things you regret.","c":"In one conversation today, listen fully without interrupting or checking your phone, then ask one follow-up question.","p":"Ask God to help you be a better listener. Thank him that he always listens to you.","q":"Who in my life really listens to me, and what do they do?"},{"t":"Sweet as honey","ref":"Proverbs 16:24","v":"Pleasant words are a honeycomb, sweet to the soul, and health to the bones.","r":"Kind words are more than nice. They actually do people good. A warm message on a hard day can lift someone more than you realise, and costs you nothing but a few seconds.","c":"Think of someone who is struggling or has been quiet. Send them a warm message, even something short and simple.","p":"Ask God to show you who needs a kind word today. Thank him for the kind words you have received.","q":"Who might really need a kind message from me today?"},{"t":"Gossip stops here","ref":"Proverbs 11:13","v":"One who brings gossip betrays a confidence, but one who is of a trustworthy spirit is one who keeps a secret.","r":"Gossip feels like bonding but it leaves trust in pieces. Being someone who keeps confidences makes people feel safe with you. If a secret is about someone being harmed, though, telling a trusted adult is right.","c":"If a conversation turns to gossip today, change the subject, say something kind about the person, or just quietly step away.","p":"Ask God for courage to refuse gossip. Pray for someone who has been talked about behind their back.","q":"How do I feel when I know people have talked about me?"},{"t":"Review: guard your mouth","ref":"Psalm 19:14","v":"Let the words of my mouth and the meditation of my heart be acceptable in your sight, Yahweh, my rock, and my redeemer.","r":"This week you looked at building words, gentle answers, listening, kindness and gossip. Words flow from the heart, so the best change starts inside. Ask God to shape both what you think and what you say.","c":"Pick one word habit to keep, such as a daily encouragement or a pause before replying, and tell a friend to hold you to it.","p":"Ask God to shape your heart so that your words honour him. Thank him for growth in this area.","q":"Which word habit will I work on next week?"}]},{"w":9,"theme":"Truth-teller","intro":"Honesty is about more than not telling lies. It means being real with God, others and yourself. This week looks at telling the truth even when it is awkward, and the freedom that comes with it.","days":[{"t":"Speak the truth","ref":"Ephesians 4:25","v":"Therefore putting away falsehood, speak truth each one with his neighbor. For we are members of one another.","r":"We are all connected, and trust is what holds friendships and families together. Every small lie, even a white one, chips at it a little. Being a truth-teller makes you someone people can rely on.","c":"Today, be completely honest in every small thing you say, including the little excuses and exaggerations you usually make without thinking.","p":"Ask God to help you speak honestly in small things as well as big ones. Thank him that he is always truthful.","q":"What small untruths do I slip into without really noticing?"},{"t":"God loves truth","ref":"Proverbs 12:22","v":"Lying lips are an abomination to Yahweh, but those who do the truth are his delight.","r":"Notice the second half: those who do the truth are his delight. God does not just disapprove of lying. He positively enjoys honest people. Imagine being someone he smiles over because of your honesty.","c":"If you have been avoiding telling someone something true, work out what you will say, then say it kindly and simply today.","p":"Thank God that honesty delights him. Ask him to give you courage to say the true thing in a kind way.","q":"What truth have I been putting off telling?"},{"t":"Nothing to hide","ref":"Proverbs 10:9","v":"He who walks blamelessly walks surely, but he who perverts his ways will be found out.","r":"Lies need maintenance: you have to remember what you said to whom. Honesty is lighter. If you do not hide anything, you do not have to keep track of a cover story or worry about being found out.","c":"Think about whether there is anything you are covering up. If so, plan to tell a trusted adult, and know that coming clean is a brave thing.","p":"Tell God anything you have been hiding. Ask him to give you courage to be open and the peace that follows.","q":"What would feel lighter if I told the truth about it?"},{"t":"Truth sets free","ref":"John 8:32","v":"You will know the truth, and the truth will make you free.”","r":"Truth is not just about not lying. Believing what is true, like that you are loved and valued, frees you from the lies in your head. Jesus is the truth that sets you free from both kinds of lies.","c":"Write down one lie you tend to believe about yourself, such as I am not good enough. Next to it, write what is actually true about you according to God.","p":"Ask Jesus to help you see the truth about yourself and your life. Thank him for the freedom he gives.","q":"What lie do I need to replace with something true?"},{"t":"Just say yes or no","ref":"Matthew 5:37","v":"But let your ‘Yes’ be ‘Yes’ and your ‘No’ be ‘No.’ Whatever is more than these is of the evil one.","r":"Be the kind of person whose word means something. If you say you will do it, do it. If you cannot, say so early. Trustworthy people make promises carefully and keep them.","c":"Keep one promise today that you have been slack about, such as returning something, replying to a message or doing a favour.","p":"Ask God to help you keep your word. Thank him that he always keeps his promises to you.","q":"Is there a promise I have made that I need to keep?"},{"t":"When you get it wrong","ref":"1 John 1:9","v":"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.","r":"Everyone lies sometimes or bends the truth. When you do, God does not hold it over you. If you tell him honestly, he forgives and cleans the slate. Honest confession is the way back to a clear conscience.","c":"If there is something on your conscience, say sorry to God in your own words, then, if it affects someone else, apologise to them too.","p":"Be honest with God about any time you were not truthful. Thank him that he forgives and makes you clean.","q":"What do I need to say sorry for, to God or to someone else?"},{"t":"Review: truth in the inward parts","ref":"Psalm 51:6","v":"Behold, you desire truth in the inward parts. You teach me wisdom in the inmost place.","r":"This week you looked at honesty in words, promises, secrets and facing your mistakes. God cares about truth deep inside, not just what shows on the outside. That is where real integrity grows.","c":"Choose one honesty habit to keep, such as no more little white lies, and tell a trusted person so they can encourage you.","p":"Ask God to teach you wisdom in the hidden places of your heart. Thank him for what he has shown you.","q":"Where do I want to be more honest next week?"}]},{"w":10,"theme":"Beating procrastination","intro":"Putting things off is something almost everyone struggles with. This week is about getting started, doing the hard thing first and breaking tasks into small steps, without shame when you slip.","days":[{"t":"Do not just wish","ref":"Proverbs 13:4","v":"The soul of the sluggard desires, and has nothing, but the desire of the diligent shall be fully satisfied.","r":"Wanting to do well and actually doing it are two different things. Procrastination is rarely laziness. Often it is feeling overwhelmed or unsure where to start. The good news: starting is the hardest part, and it gets easier.","c":"Pick one task you have been avoiding. Tell yourself you will work at it for just five minutes, and start right now.","p":"Ask God to help you move from wishing to doing. Tell him which task feels hardest to start.","q":"What task am I avoiding, and what is it about it that feels hard?"},{"t":"Small starts matter","ref":"Zechariah 4:10","v":"Indeed, who despises the day of small things? For these seven shall rejoice, and shall see the plumb line in the hand of Zerubbabel. These are Yahweh’s eyes, which run back and forth through the whole earth.”","r":"Do not look down on small beginnings. One paragraph, one maths question or one email is a start. Small steps build momentum, and momentum carries you much further than waiting until you feel ready.","c":"Break your biggest task into tiny steps, like open the document, write the title or find the book, and do just the first one.","p":"Thank God that small steps count with him. Ask him to help you take the first one on your task.","q":"What is the very first, smallest step on my biggest task?"},{"t":"Strength for the hard stuff","ref":"Philippians 4:13","v":"I can do all things through Christ, who strengthens me.","r":"This verse is not about being a superhero. It is about not facing difficult things on your own strength. The thing you dread, whether homework, a conversation or a chore, is easier with God helping.","c":"Do the hardest thing on your list first today, before the easy bits. Say a quick prayer for help before you begin.","p":"Ask Jesus to give you strength for the thing you are dreading. Thank him that you do not have to do it alone.","q":"What is the hardest thing on my list, and how would it feel to finish it?"},{"t":"Lay it aside","ref":"Hebrews 12:1","v":"Therefore let’s also, seeing we are surrounded by so great a cloud of witnesses, lay aside every weight and the sin which so easily entangles us, and let’s run with perseverance the race that is set before us,","r":"Some things weigh you down and tangle your feet: your phone, endless snacks, TV in the background. You do not have to get rid of them forever, just put them aside while you run your race.","c":"Put your phone in another room for a 30-minute work session today, and see how much you get done without it.","p":"Ask God to help you lay aside whatever slows you down. Thank him for the people who cheer you on.","q":"What distraction trips me up most when I should be working?"},{"t":"Do not wait for tomorrow","ref":"Proverbs 27:1","v":"Don’t boast about tomorrow; for you don’t know what a day may bring.","r":"Tomorrow-you always seems more organised and energetic than today-you, but tomorrow-you is usually just as tired. Doing a little today takes pressure off and gives you a head start.","c":"Do one small thing today that you were planning to do tomorrow, even just ten minutes of it.","p":"Ask God to help you use today well and not keep postponing. Thank him for the day in front of you.","q":"What have I been saying I will do tomorrow for a while now?"},{"t":"Work brings reward","ref":"Proverbs 14:23","v":"In all hard work there is profit, but the talk of the lips leads only to poverty.","r":"Talking about doing something, or planning forever, is not the same as doing it. Real progress comes from actually working, even badly at first. A messy first draft beats a perfect blank page.","c":"Lower your standard for a first go. Write a rough, imperfect first attempt at something you have been putting off, and fix it later.","p":"Ask God to free you from needing everything to be perfect before you start. Thank him for being patient with you.","q":"What would I attempt if I knew it was fine to do it badly first?"},{"t":"Review: power, love and self-control","ref":"2 Timothy 1:7","v":"For God didn’t give us a spirit of fear, but of power, love, and self-control.","r":"This week you looked at getting started, small steps, hard things first and cutting distractions. God gives you self-control and power, so you are not stuck. If you slipped, that is okay. Start again today.","c":"Pick one anti-procrastination habit to keep, like the five-minute start or hardest-first, and write it on a sticky note where you work.","p":"Thank God for giving you power and self-control. Ask him to help you keep your chosen habit going.","q":"Which anti-procrastination trick worked best for me this week?"}]},{"w":11,"theme":"Looking after your body","intro":"Your body is a gift to look after and be thankful for, not something to criticise. This week is about sleep, movement, good food, hygiene and rest, as simple ways to care for yourself.","days":[{"t":"A gift to care for","ref":"1 Corinthians 6:19","v":"Or don’t you know that your body is a temple of the Holy Spirit who is in you, whom you have from God? You are not your own,","r":"Your body is not just a thing you carry around. It is home to God's Spirit, which makes caring for it a way of honouring him. Looking after yourself is not vain or selfish. It is thankfulness in action.","c":"Thank your body today for three things it does for you, like carrying you around, helping you laugh or letting you hug someone.","p":"Thank God for your body and everything it does. Ask him to help you look after it with kindness.","q":"What am I most thankful that my body can do?"},{"t":"Sleep in peace","ref":"Psalm 4:8","v":"In peace I will both lay myself down and sleep, for you, Yahweh alone, make me live in safety.","r":"Good sleep affects your mood, memory and patience. Trusting God with your worries makes it easier to switch off. If you often cannot sleep or feel low, talk to a parent or doctor, as that is wise and normal.","c":"Tonight, put your phone on charge outside your bed or at least face-down well before bed, and wind down with something calm.","p":"Hand your tomorrow to God before you sleep. Thank him that he stays awake so you can rest safely.","q":"What helps me wind down at night, and what keeps me awake?"},{"t":"Move and enjoy it","ref":"1 Timothy 4:8","v":"For bodily exercise has some value, but godliness has value in all things, having the promise of the life which is now, and of that which is to come.","r":"Moving your body helps your mood, energy and sleep. It does not have to be a sport or a gym. Dancing in your room, walking, cycling or stretching all count. God cares about the whole of you, body included.","c":"Move in a way you enjoy for fifteen minutes today, whether a walk, dance, stretch or kick-about, and notice how you feel after.","p":"Thank God for a body that can move. Ask him to help you find ways of moving that bring you joy.","q":"What kind of movement do I actually enjoy?"},{"t":"Taste and see","ref":"Psalm 34:8","v":"Oh taste and see that Yahweh is good. Blessed is the man who takes refuge in him.","r":"Food is a daily gift, and a varied mix of things helps your body feel good. Eating with others, or at least pausing to say thanks, turns an ordinary meal into something a little more thankful.","c":"Say a quick thank-you to God before one meal today and try to include something fresh, like fruit, vegetables or a glass of water.","p":"Thank God for the food you have and the people who provide it. Ask him to help you enjoy it with a thankful heart.","q":"What meal am I most thankful for, and who helps provide it?"},{"t":"Fresh and clean","ref":"Ecclesiastes 9:8","v":"Let your garments be always white, and don’t let your head lack oil.","r":"Looking after the basics, like showering, brushing teeth, clean clothes and deodorant, helps you feel fresh and confident. It is not about impressing anyone. It is simply caring for yourself. If anything feels awkward, ask a trusted adult.","c":"Check your daily care routine: teeth morning and night, wash, clean clothes. Fix one gap if you spot it, and ask for help if needed.","p":"Thank God for the simple things that help you feel fresh. Ask him to help you take care of yourself well.","q":"What part of my daily care routine do I tend to skip?"},{"t":"Come away and rest","ref":"Mark 6:31","v":"He said to them, “You come apart into a deserted place, and rest awhile.” For there were many coming and going, and they had no leisure so much as to eat.","r":"Even Jesus told his friends to rest. Rest is not laziness. It is part of looking after yourself. Doing nothing in particular, like lying in the garden, reading or drawing, can recharge you more than you expect.","c":"Plan twenty minutes of real rest today, with no screens and no tasks. Read, listen to music, doodle or just lie quietly.","p":"Thank Jesus for inviting you to rest. Ask him to help you stop and recharge without feeling guilty.","q":"What kind of rest actually refreshes me?"},{"t":"Review: rest is a gift","ref":"Psalm 127:2","v":"It is vain for you to rise up early, to stay up late, eating the bread of toil, for he gives sleep to his loved ones.","r":"This week you looked at your body as a gift, plus sleep, movement, food, hygiene and rest. God gives sleep to those he loves, so rest is not wasted time. It is part of how he looks after you.","c":"Pick one body-care habit to keep, such as a screen-free bedtime wind-down or a daily walk, and put a reminder on your phone.","p":"Thank God for caring about every part of you. Ask him to help you keep looking after your body with kindness.","q":"Which body-care habit will I keep up next week, and when?"}]},{"w":12,"theme":"Family matters","intro":"Family can be your safest place and your most irritating one, often on the same day. This week is about honour, patience and helping at home, one small step at a time.","days":[{"t":"Honouring parents","ref":"Exodus 20:12","v":"“Honor your father and your mother, that your days may be long in the land which Yahweh your God gives you.","r":"Honouring does not mean agreeing with everything or never being frustrated. It means treating your parents or carers with respect and thanks, even when you disagree. Small acts of respect add up to a strong relationship.","c":"Thank a parent or carer for something specific today, like a meal, a lift or just being there, and look them in the eye as you say it.","p":"Thank God for the people who look after you. Ask him to help you show them respect, even when it is hard.","q":"What is one thing I appreciate about my parents or carers?"},{"t":"Bearing with each other","ref":"Ephesians 4:2","v":"with all lowliness and humility, with patience, bearing with one another in love,","r":"Living closely with people means seeing their annoying habits up close, and them seeing yours. Patience does not mean pretending nothing bothers you. It means choosing love over the urge to snap.","c":"The next time a family member irritates you, pause, breathe, and ask yourself what you would want if you were in their shoes.","p":"Ask God to give you patience with your family. Tell him honestly who is hardest to be patient with.","q":"Who in my family do I find hardest to be patient with, and why?"},{"t":"Help without grumbling","ref":"1 Peter 4:9","v":"Be hospitable to one another without grumbling.","r":"We can do a job and ruin it with a sigh and an eye-roll. Cheerful help makes a bigger difference than people realise. Try doing something helpful without any complaining, not even in your head.","c":"Do a household job today without being asked and without complaining, such as laying the table, helping with shopping or tidying a shared space.","p":"Ask God to give you a cheerful, helpful heart at home. Thank him for the home and family you have.","q":"What job at home could I do without being asked this week?"},{"t":"Serve in love","ref":"Galatians 5:13","v":"For you, brothers, were called for freedom. Only don’t use your freedom for gain to the flesh, but through love be servants to one another.","r":"Real freedom is not just doing what you like. It includes choosing to serve people you love. Helping your family, even when you would rather be doing something else, is a quiet kind of strength.","c":"Ask a family member, Is there anything I can help with? Then do it properly, whatever it is.","p":"Ask God to help you notice when someone at home needs help. Thank him for those who serve you.","q":"How does it feel when someone helps me without being asked?"},{"t":"Peace at home","ref":"Proverbs 17:1","v":"Better is a dry morsel with quietness, than a house full of feasting with strife.","r":"A peaceful home is worth more than any treat or upgrade. You cannot control everyone, but you can add to the peace by how you speak, how you react and when you choose to walk away from an argument.","c":"Do one thing to bring calm at home: keep your voice low, step out of an argument or offer to make peace after a disagreement.","p":"Pray for peace in your home and ask God to make you someone who helps bring it. If home feels unsafe, tell a trusted adult.","q":"What helps my home feel peaceful, and what disturbs it?"},{"t":"Look out for others","ref":"Philippians 2:4","v":"each of you not just looking to his own things, but each of you also to the things of others.","r":"Families work best when everyone looks out for each other, not just themselves. Noticing that a sibling is stressed or a parent is tired, and doing something small, is a mark of real maturity.","c":"Notice how each person at home seems today. Do one small thoughtful thing, like a drink, a hug or leaving them in peace.","p":"Ask God to help you see the needs of those in your home. Pray for each family member by name.","q":"Who in my family might need a bit of kindness this week?"},{"t":"Review: live at peace","ref":"Romans 12:18","v":"If it is possible, as much as it is up to you, be at peace with all men.","r":"This week you looked at honour, patience, helping and peace at home. You cannot make others change, but you can control your own part. As much as it depends on you, you can add peace.","c":"Choose one family habit to keep, such as a daily thank-you or one regular job, and tell someone at home.","p":"Thank God for your family, with all its mess and love. Ask him to help you keep being a peacemaker.","q":"What is one way I can be a better family member next week?"}]},{"w":13,"theme":"Forgiveness","intro":"Forgiveness is one of the hardest and most freeing things you will practise. This week is about letting go of hurt and receiving forgiveness yourself. Forgiving never means pretending it did not happen.","days":[{"t":"Kind and forgiving","ref":"Ephesians 4:32","v":"And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.","r":"You have been forgiven a lot more than you probably realise. That is the starting point: because God has been generous with you, you can try to be generous with others. It is a process, not a switch.","c":"Think of a small hurt from this week, such as a snappy comment or being left out, and choose to let it go instead of replaying it.","p":"Thank God for forgiving you. Ask him to help you forgive someone who has hurt you, even a little.","q":"Who do I need to forgive, even in a small way?"},{"t":"Slow to anger","ref":"Psalm 103:8","v":"Yahweh is merciful and gracious, slow to anger, and abundant in loving kindness.","r":"God is patient with you when you mess up again and again. He does not rush to punish. This is the pattern to copy: pause before reacting, give people the benefit of the doubt, and let mercy lead.","c":"Next time someone annoys you, give them the benefit of the doubt for a minute. They might be having a bad day too.","p":"Thank God that he is patient with you. Ask him to help you be slow to anger and quick to show mercy.","q":"When was someone patient with me when I did not deserve it?"},{"t":"Bear and forgive","ref":"Colossians 3:13","v":"bearing with one another, and forgiving each other, if any man has a complaint against any; even as Christ forgave you, so you also do.","r":"Forgiving does not mean what happened was fine, and it does not mean you have to stay close to someone who keeps hurting you. If you are being hurt or feel unsafe, tell a trusted adult. That is wise, not unforgiving.","c":"Write a letter you will not send, saying everything you feel about a hurt. Then tear it up or put it away. Talk to a trusted adult if it is heavy.","p":"Be honest with God about how much something hurt. Ask him for the strength to forgive in his time.","q":"What hurt am I still carrying that I would like to put down?"},{"t":"Do not hold the scorecard","ref":"Luke 6:37","v":"Don’t judge, and you won’t be judged. Don’t condemn, and you won’t be condemned. Set free, and you will be set free.","r":"Keeping a score of what everyone has done wrong is exhausting and keeps you tied to the hurt. Letting go of the scorecard sets you free, even if the other person never apologises.","c":"Think of a grudge you have been holding. Imagine putting it down like a heavy bag, and say out loud: I choose to let this go.","p":"Ask God to help you let go of grudges and the scorecard. Thank him for the freedom that brings.","q":"What would feel lighter if I stopped keeping score?"},{"t":"As far as east from west","ref":"Psalm 103:12","v":"As far as the east is from the west, so far has he removed our transgressions from us.","r":"When God forgives, he truly removes it. There is no secret list of your mistakes waiting for a bad day. Receiving his forgiveness means you can stop punishing yourself for things you have already said sorry for.","c":"Think of something you feel guilty about. If you have already said sorry to God, say thank you for forgiving you, and then let it go.","p":"Thank God that your mistakes are removed as far as east from west. Ask him to help you forgive yourself too.","q":"What am I still beating myself up about that God has already forgiven?"},{"t":"Something new","ref":"Isaiah 43:18-19","v":"“Don’t remember the former things, and don’t consider the things of old. Behold, I will do a new thing. It springs out now. Don’t you know it? I will even make a way in the wilderness, and rivers in the desert.","r":"Forgiveness opens the door for something new. It does not erase the past, but it stops the past from controlling your future. God is always doing fresh things, and he can bring good even from hard seasons.","c":"Choose one fresh start today: a kind word to someone you fell out with, a clean slate with a sibling, or a simple sorry.","p":"Ask God to do something new in the relationships that feel stuck. Thank him that he makes all things new.","q":"What fresh start would I love to see in a relationship?"},{"t":"Review: no condemnation","ref":"Romans 8:1","v":"There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.","r":"This week you looked at forgiving others, receiving forgiveness and letting go of the scorecard. In Christ there is no condemnation. That is the foundation: you are forgiven, so you can forgive, one step at a time.","c":"Pick one forgiveness step to take this week, such as a message, a prayer or a decision to let something go, and write down when you will do it.","p":"Thank God for the forgiveness he has given you. Ask him to keep your heart soft, and to help you with any hurt that is still tender.","q":"What is one forgiveness step I will take this week?"}]},{"w":14,"theme":"Doing school well","intro":"School takes up a huge part of your week. This week is about turning up with a good attitude, building habits that actually help, and doing your best without crumbling under pressure.","days":[{"t":"Work as if for God","ref":"Colossians 3:23","v":"And whatever you do, work heartily, as for the Lord, and not for men,","r":"Homework is rarely exciting, but this verse gives it a bigger audience. You are not just working for a teacher or a grade. Doing your best, even on boring tasks, becomes something you offer to God.","c":"Pick the one assignment you least want to do today and do it first, giving it your full effort for twenty minutes.","p":"Lord, help me bring my best effort to school today, even on the dull stuff. Remind me that I am working with you watching.","q":"Which task do I tend to rush, and what would my best look like?"},{"t":"Effort beats talking","ref":"Proverbs 14:23","v":"In all hard work there is profit, but the talk of the lips leads only to poverty.","r":"Everyone has said, 'I'll start soon' or 'I'm going to smash this revision'. Plans and talk feel good, but the actual work is what makes the difference. Small, steady effort beats big promises every time.","c":"Write a simple three-item study plan for tonight and start item one before you check anything else on your phone.","p":"God, help me move from planning to doing. Give me the push to start, especially when I feel like putting things off.","q":"What is one thing I keep saying I'll do for school but haven't started?"},{"t":"Guard your focus","ref":"Psalm 119:37","v":"Turn my eyes away from looking at worthless things. Revive me in your ways.","r":"Focus is hard when your phone buzzes and your friends are in a group chat. Asking God to help where your eyes go is a brilliant prayer for a study session. Focus is a skill you can train.","c":"Study for twenty-five minutes with your phone in another room, then take a five-minute break. Notice how much you got done.","p":"Father, turn my attention away from distractions and help me concentrate. Give me energy and a clear head when I sit down to work.","q":"What distracts me most when I study, and how can I remove it?"},{"t":"Ask for help","ref":"James 1:5","v":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.","r":"Nobody understands every lesson first time. Asking for help is not weakness; it is smart. God is generous with wisdom, and he often answers through teachers, friends and parents who are glad to explain things.","c":"Choose a topic you find confusing and ask a teacher, friend or parent to explain it, or write down one clear question to ask.","p":"God, give me wisdom for the subjects I find hard. Take away my embarrassment about asking questions
